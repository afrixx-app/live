<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BIGULA – Creator Profile</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  background:#0f0f0f;
  color:#fff;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:#111;
  padding:14px 18px;
  border-bottom:1px solid #222;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:24px;
  font-weight:900;
  color:#ff0050;
  letter-spacing:2px;
}

.back-btn{
  background:#1c1c1c;
  border:none;
  color:#fff;
  padding:10px 15px;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
}

/* PROFILE HERO */

.profile-hero{
  padding:30px 20px;
  text-align:center;
  border-bottom:1px solid #1f1f1f;
  background:linear-gradient(to bottom,#161616,#0f0f0f);
}

.avatar{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid gold;
  margin-bottom:15px;
}

.username{
  font-size:34px;
  font-weight:900;
  color:#ff4da6;
  margin-bottom:8px;
}

.gold-badge{
  color:gold;
  font-size:24px;
  margin-left:8px;
}

.bio{
  max-width:700px;
  margin:10px auto;
  color:#bbb;
  line-height:1.6;
  font-size:15px;
}

.creator-stats{
  margin-top:25px;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:15px;
}

.stat-box{
  background:#161616;
  border:1px solid #222;
  border-radius:18px;
  min-width:130px;
  padding:16px;
}

.stat-box h2{
  color:#fff;
  font-size:26px;
}

.stat-box p{
  color:#999;
  margin-top:5px;
  font-size:14px;
}

/* ACTION BUTTONS */

.action-row{
  margin-top:25px;
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

.follow-btn,
.message-btn,
.share-btn{

  border:none;
  border-radius:999px;
  padding:14px 24px;
  cursor:pointer;
  font-weight:800;
  font-size:15px;
  transition:.25s;
}

.follow-btn{
  background:linear-gradient(45deg,#ff0050,#ff7a00);
  color:#fff;
}

.follow-btn.following{
  background:#222;
  color:#aaa;
  border:1px solid #444;
}

.message-btn{
  background:#1e1e1e;
  color:#fff;
  border:1px solid #333;
}

.share-btn{
  background:linear-gradient(45deg,#0066ff,#00ccff);
  color:#fff;
}

.follow-btn:hover,
.message-btn:hover,
.share-btn:hover{
  transform:scale(1.05);
}

/* TABS */

.tabs{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:25px;
  padding-bottom:15px;
  border-bottom:1px solid #1f1f1f;
}

.tab{
  cursor:pointer;
  font-weight:800;
  opacity:.6;
  transition:.25s;
  padding-bottom:6px;
}

.tab.active{
  opacity:1;
  color:#ff0050;
  border-bottom:2px solid #ff0050;
}

/* VIDEO GRID */

.video-grid{
  padding:25px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:20px;
}

.video-card{
  background:#151515;
  border-radius:18px;
  overflow:hidden;
  border:1px solid #222;
  transition:.25s;
}

.video-card:hover{
  transform:translateY(-4px);
}

.video-card video{
  width:100%;
  height:320px;
  object-fit:cover;
  background:#000;
}

.video-info{
  padding:14px;
}

.video-title{
  font-size:15px;
  font-weight:700;
  margin-bottom:10px;
}

.video-stats{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  color:#aaa;
}

/* INFO BOXES */

.info-section{
  max-width:1000px;
  margin:30px auto;
  padding:0 20px;
}

.info-box{
  background:#161616;
  border:1px solid #222;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
}

.info-box h3{
  color:#ff0050;
  margin-bottom:12px;
}

.info-box p{
  color:#bbb;
  line-height:1.6;
}

/* RESPONSIVE */

@media(max-width:700px){

  .username{
    font-size:28px;
  }

  .creator-stats{
    gap:10px;
  }

  .stat-box{
    min-width:100px;
    padding:12px;
  }

  .video-card video{
    height:260px;
  }
}


.real-name{
  font-size:24px;
  font-weight:900;
  margin-top:2px;
  color:#fff;
}
.username{
  font-size:15px;
  font-weight:700;
  color:#999;
  margin-top:5px;
  margin-bottom:8px;
}
.share-menu{
  position:fixed;
  inset:0;
  background:#0009;
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:100;
  padding:20px;
}
.share-menu.show{display:flex}
.share-panel{
  width:min(440px,100%);
  background:#181818;
  border:1px solid #333;
  border-radius:20px;
  padding:18px;
  box-shadow:0 20px 60px #000;
}
.share-panel h3{margin:0 0 14px;font-size:18px}
.share-option{
  width:100%;
  border:1px solid #333;
  background:#222;
  color:#fff;
  border-radius:13px;
  padding:14px;
  margin-top:9px;
  font-weight:800;
  cursor:pointer;
}
.share-cancel{
  width:100%;
  border:0;
  background:#333;
  color:#fff;
  border-radius:13px;
  padding:13px;
  margin-top:12px;
  font-weight:800;
  cursor:pointer;
}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

  <button class="back-btn"
    onclick="history.back()">
    ← Back
  </button>

  <div class="logo">
    BIGULA
  </div>

</div>

<!-- PROFILE HERO -->

<div class="profile-hero">

  <img
    id="avatar"
    class="avatar"
    src="https://placehold.co/300x300"
  >

  <div class="real-name" id="realName">Loading creator...</div>
  <div class="username" id="username">@creator <span id="badgeArea"></span></div>

  <div class="bio" id="bio">Loading creator profile...</div>

  <!-- STATS -->

  <div class="creator-stats">

    <div class="stat-box">
      <h2 id="followersCount">0</h2>
      <p>Followers</p>
    </div>

    <div class="stat-box">
      <h2 id="likesCount">0</h2>
      <p>Total Likes</p>
    </div>

    <div class="stat-box">
      <h2 id="videosCount">0</h2>
      <p>Videos</p>
    </div>

    <div class="stat-box">
      <h2 id="viewsCount">0</h2>
      <p>Total Views</p>
    </div>

    <div class="stat-box">
      <h2 id="followingCount">0</h2>
      <p>Following</p>
    </div>

  </div>

  <!-- ACTION BUTTONS -->

  <div class="action-row">

    <button
      id="followBtn"
      class="follow-btn">
      Follow
    </button>

    <button
      class="message-btn">
      Message
    </button>

    <button
      class="share-btn">
      Share Profile
    </button>

  </div>

</div>

<!-- VIDEO GRID -->

<div class="video-grid" id="videoGrid">

</div>

<script type="module">
import { createClient }
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const SUPABASE_URL = 'https://vfteiggdhthvrrlndtbs.supabase.co'
const SUPABASE_KEY = 'sb_publishable_7LUjk7PBJeCy-_ZdrEqDzA_sGUruHRe'
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}
})

const params = new URLSearchParams(location.search)
const uid = params.get('uid') || params.get('id')

if(!uid){
  alert('Creator not found')
  history.back()
}

let creator = null
let me = null
let isFollowing = false
let isFollowedBack = false

const esc = value => String(value ?? '').replace(/[&<>"']/g,m=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[m]))

const fmt = n => Intl.NumberFormat(undefined,{
  notation:'compact',
  maximumFractionDigits:1
}).format(Number(n)||0)

function getOwnerId(row){
  return row?.user_id || row?.creator_id || row?.owner_id
}

async function getCurrentUser(){
  const {data,error} = await supabase.auth.getUser()
  if(!error) me = data?.user || null
}

async function exactCount(table,column,value){
  const {count,error} = await supabase
    .from(table)
    .select('*',{head:true,count:'exact'})
    .eq(column,value)
  return error ? 0 : (count || 0)
}

function setFollowButton(){
  const btn=document.getElementById('followBtn')
  if(!btn)return

  if(isFollowedBack){
    btn.textContent='Besties'
    btn.classList.add('following')
  }else if(isFollowing){
    btn.textContent='Following'
    btn.classList.add('following')
  }else{
    btn.textContent='Follow'
    btn.classList.remove('following')
  }
}

async function loadFollowState(){
  if(!me || !creator?.id || me.id===creator.id){
    document.getElementById('followBtn').style.display =
      me?.id===creator?.id ? 'none' : ''
    return
  }

  const [outgoing,incoming] = await Promise.all([
    supabase.from('followers')
      .select('id')
      .eq('follower_id',me.id)
      .eq('following_id',creator.id)
      .maybeSingle(),

    supabase.from('followers')
      .select('id')
      .eq('follower_id',creator.id)
      .eq('following_id',me.id)
      .maybeSingle()
  ])

  isFollowing=!!outgoing.data
  isFollowedBack=!!incoming.data && isFollowing
  setFollowButton()
}

async function loadVideos(){
  const grid=document.getElementById('videoGrid')

  let query=supabase
    .from('videos')
    .select('*')
    .order('created_at',{ascending:false})

  // Support either creator_id or user_id because the current project
  // may use either column name.
  let result=await query.eq('creator_id',creator.id)

  if(result.error){
    result=await supabase
      .from('videos')
      .select('*')
      .eq('user_id',creator.id)
      .order('created_at',{ascending:false})
  }

  const videos=result.data || []

  document.getElementById('videosCount').textContent=fmt(videos.length)

  if(!videos.length){
    grid.innerHTML='<div class="empty" style="grid-column:1/-1">No videos yet.</div>'
    return {videos:[],likes:0,views:0}
  }

  let totalLikes=0
  let totalViews=0

  grid.innerHTML=''

  for(const video of videos){
    const [likes,views]=await Promise.all([
      exactCount('likes','video_id',video.id),
      exactCount('views','video_id',video.id)
    ])

    totalLikes+=likes
    totalViews+=views

    const card=document.createElement('div')
    card.className='video-card'

    const shortCode=video.short_code
    const videoUrl=video.video_url || video.url || video.file_url || ''

    card.innerHTML=`
      <video src="${esc(videoUrl)}" muted loop playsinline preload="metadata"></video>
      <div class="video-info">
        <div class="video-title">${esc(video.title || 'Untitled video')}</div>
        <div class="video-stats">
          <div>❤️ ${fmt(likes)}</div>
          <div>👁 ${fmt(views)}</div>
        </div>
      </div>
    `

    card.onclick=()=>{
      if(shortCode){
        location.href=`video_view.html?v=${encodeURIComponent(shortCode)}`
      }else{
        location.href=`video_view.html?id=${encodeURIComponent(video.id)}`
      }
    }

    grid.appendChild(card)
  }

  document.getElementById('likesCount').textContent=fmt(totalLikes)
  document.getElementById('viewsCount').textContent=fmt(totalViews)

  return {videos,likes:totalLikes,views:totalViews}
}

async function loadProfile(){
  await getCurrentUser()

  const {data:user,error} = await supabase
    .from('users')
    .select('*')
    .eq('id',uid)
    .maybeSingle()

  if(error || !user){
    document.getElementById('bio').textContent='Creator profile not found.'
    return
  }

  creator=user

  // Real creator name. Try common name fields without hard-coding a
  // display value into the page.
  const realName =
    user.full_name ||
    user.display_name ||
    user.name ||
    user.real_name ||
    user.username ||
    'BIGULA Creator'

  const username =
    user.username ||
    user.user_name ||
    user.handle ||
    ''

  document.getElementById('realName').textContent=realName
  document.getElementById('username').innerHTML=
    `${username ? '@'+esc(username) : ''}${user.is_monetized ? ' <span class="gold-badge">★</span>' : ''}`

  document.getElementById('bio').textContent=user.bio || 'No bio yet'

  const photo =
    user.avatar_url ||
    user.photo_url ||
    user.profile_photo ||
    user.avatar

  if(photo) document.getElementById('avatar').src=photo

  const [followers,following] = await Promise.all([
    exactCount('followers','following_id',creator.id),
    exactCount('followers','follower_id',creator.id)
  ])

  document.getElementById('followersCount').textContent=fmt(followers)
  document.getElementById('followingCount').textContent=fmt(following)

  const totals=await loadVideos()

  // Creator status is derived from the live users row.

  await loadFollowState()
  setupAutoplay()
}

function setupAutoplay(){
  const videos=document.querySelectorAll('#videoGrid video')
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting) entry.target.play().catch(()=>{})
      else entry.target.pause()
    })
  },{threshold:.7})
  videos.forEach(v=>observer.observe(v))
}

document.getElementById('followBtn').onclick=async()=>{
  if(!me){
    location.href='signup.html'
    return
  }

  if(me.id===creator.id)return

  const btn=document.getElementById('followBtn')
  btn.disabled=true

  if(isFollowing){
    const {error}=await supabase
      .from('followers')
      .delete()
      .eq('follower_id',me.id)
      .eq('following_id',creator.id)

    if(!error){
      isFollowing=false
      isFollowedBack=false
    }
  }else{
    const {error}=await supabase
      .from('followers')
      .insert({
        follower_id:me.id,
        following_id:creator.id
      })

    if(!error){
      isFollowing=true
    }
  }

  const followers=await exactCount('followers','following_id',creator.id)
  document.getElementById('followersCount').textContent=fmt(followers)
  setFollowButton()
  btn.disabled=false
}

document.querySelector('.message-btn').onclick=()=>{
  location.href=`message.html?uid=${encodeURIComponent(creator.id)}`
}

function openShareMenu(){
  document.getElementById('shareMenu').classList.add('show')
}

function closeShareMenu(){
  document.getElementById('shareMenu').classList.remove('show')
}

document.querySelector('.share-btn').onclick=openShareMenu
document.getElementById('shareCancel').onclick=closeShareMenu

document.getElementById('shareWhatsApp').onclick=()=>{
  const shortLink=creator.short_link || ''
  const name=creator.full_name || creator.display_name || creator.name || creator.username || 'BIGULA Creator'
  const text=`${name} on BIGULA${shortLink ? `\n${shortLink}` : ''}`
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,'_blank')
  closeShareMenu()
}

document.getElementById('shareStatus').onclick=async()=>{
  const shortLink=creator.short_link || ''
  const name=creator.full_name || creator.display_name || creator.name || creator.username || 'BIGULA Creator'
  const text=`${name} on BIGULA${shortLink ? `\n${shortLink}` : ''}`

  if(navigator.share){
    try{
      await navigator.share({title:name,text})
    }catch(e){}
  }else{
    await navigator.clipboard?.writeText(text)
    alert('BIGULA Status text copied')
  }

  closeShareMenu()
}

loadProfile()
</script>


<div class="share-menu" id="shareMenu">
  <div class="share-panel">
    <h3>Share creator</h3>
    <button class="share-option" id="shareWhatsApp">WhatsApp</button>
    <button class="share-option" id="shareStatus">BIGULA Status</button>
    <button class="share-cancel" id="shareCancel">Cancel</button>
  </div>
</div>

</body>
</html>
