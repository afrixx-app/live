<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIGULA — Notifications</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#111;background:#fff}header{height:64px;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 16px;gap:12px}a{color:#111;text-decoration:none}h1{font-size:20px;margin:0}main{max-width:760px;margin:auto;padding:8px 12px}.item{display:flex;gap:12px;padding:15px 8px;border-bottom:1px solid #eee;align-items:center}.icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#eee;font-size:20px}.body{flex:1}.time{font-size:12px;color:#777;margin-top:4px}.empty{text-align:center;color:#777;padding:50px 10px}.unread{background:#f5fff7}</style></head><body>
<header><a href="home.html" style="font-size:25px">‹</a><h1>Notifications</h1></header><main id="list"><div class="empty">Loading…</div></main>
<script>
const SB_URL="https://vfteiggdhthvrrlndtbs.supabase.co";
const SB_KEY="sb_publishable_7LUjk7PBJeCy-_ZdrEqDzA_sGUruHRe";
const H={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY};

async function api(p,o={}){
 return fetch(SB_URL+"/rest/v1/"+p,{...o,headers:{...H,"Content-Type":"application/json",...(o.headers||{})}});
}

async function load(){
 const list=document.getElementById("list");
 try{
  let me=await fetch(SB_URL+"/auth/v1/user",{headers:H});
  if(!me.ok){location.href="signup.html";return}
  me=await me.json();

  const r=await api("notifications?user_id=eq."+encodeURIComponent(me.id)+"&order=created_at.desc&limit=100");
  if(!r.ok){
   console.error("Notifications load failed:",await r.text());
   list.innerHTML='<div class="empty">No notifications yet.</div>';
   return;
  }

  const rows=await r.json();
  if(!Array.isArray(rows)||!rows.length){
   list.innerHTML='<div class="empty">No notifications yet.</div>';
   return;
  }

  const actorIds=[...new Set(rows.map(x=>x.actor_id).filter(Boolean))];
  const names={};
  if(actorIds.length){
   const u=await api("users?id=in.("+actorIds.map(id=>encodeURIComponent(id)).join(",")+")&select=id,name,username");
   if(u.ok){
    const users=await u.json();
    users.forEach(x=>names[x.id]=x.name||("@"+(x.username||"user")));
   }
  }

  list.innerHTML=rows.map(x=>{
   const actor=names[x.actor_id]||"Someone";
   const type=(x.type||"").toLowerCase();
   const icon=type.includes("like")?"♥":type.includes("comment")?"💬":type.includes("follow")?"👤":"🔔";
   const text=x.message||(type.includes("like")?actor+" liked your video.":type.includes("comment")?actor+" commented on your video.":type.includes("follow")?actor+" followed you.":"You have a new notification.");
   return '<div class="item '+(!x.is_read?"unread":"")+'"><div class="icon">'+icon+'</div><div class="body"><div>'+escapeHtml(text)+'</div><div class="time">'+new Date(x.created_at||Date.now()).toLocaleString()+'</div></div></div>';
  }).join("");

  const unread=rows.filter(x=>!x.is_read).map(x=>x.id).filter(Boolean);
  if(unread.length){
   await api("notifications?id=in.("+unread.map(id=>encodeURIComponent(id)).join(",")+")",{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({is_read:true})});
  }
 }catch(err){
  console.error("Notifications error:",err);
  list.innerHTML='<div class="empty">No notifications yet.</div>';
 }
}

function escapeHtml(s){
 return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
load();
</script></body></html>
