
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIGULA – Notifications</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

html,body{
  width:100%;
  min-height:100%;
  background:#f7f7f7;
  color:#111;
}

body{
  padding-bottom:80px;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  height:60px;
  background:#fff;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  padding:0 16px;
}

.back{
  border:none;
  background:none;
  font-size:25px;
  cursor:pointer;
  margin-right:12px;
}

.logo{
  font-size:23px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:#22b455;
}

.title{
  text-align:center;
  font-size:19px;
  font-weight:800;
  flex:1;
  margin-right:35px;
}

.notifications{
  max-width:700px;
  margin:auto;
  padding:10px 0;
}

.notification{
  display:flex;
  gap:12px;
  padding:15px;
  background:#fff;
  border-bottom:1px solid #e5e5e5;
  transition:.2s;
}

.notification.unread{
  background:#eefbf2;
  border-left:4px solid #22b455;
  padding-left:11px;
}

.notification.unread .body{
  font-weight:600;
}

.icon{
  width:44px;
  height:44px;
  min-width:44px;
  border-radius:50%;
  background:#22b455;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  font-weight:800;
}

.body{
  flex:1;
  line-height:1.4;
}

.text{
  font-size:15px;
}

.time{
  margin-top:4px;
  font-size:12px;
  color:#888;
}

.empty{
  text-align:center;
  padding:70px 20px;
  color:#888;
}

.loading{
  text-align:center;
  padding:40px;
  color:#888;
}

.error{
  text-align:center;
  padding:40px 20px;
  color:#d33;
}

footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:200;
}

.footer-btn{
  border:none;
  background:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  color:#555;
  font-size:11px;
  cursor:pointer;
}

.footer-btn .ficon{
  font-size:22px;
}

.footer-btn.active{
  color:#22b455;
  font-weight:700;
}

@media(max-width:500px){
  header{
    padding:0 12px;
  }

  .notifications{
    width:100%;
  }

  .notification{
    padding:14px 12px;
  }
}
</style>
</head>

<body>

<header>
  <button class="back" onclick="history.back()">‹</button>

  <div class="logo">
    BIGU<span>LA</span>
  </div>

  <div class="title">Notifications</div>
</header>

<main class="notifications" id="notifications">
  <div class="loading">Loading notifications...</div>
</main>

<footer>

  <button class="footer-btn" onclick="goHome()">
    <div class="ficon">⌂</div>
    <div>Home</div>
  </button>

  <button class="footer-btn" onclick="goUpload()">
    <div class="ficon">＋</div>
    <div>Upload</div>
  </button>

  <button class="footer-btn active">
    <div class="ficon">♡</div>
    <div>Notifications</div>
  </button>

  <button class="footer-btn" onclick="goAccount()">
    <div class="ficon">◉</div>
    <div>Account</div>
  </button>

</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://vfteiggdhthvrrlndtbs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_7LUjk7PBJeCy-_ZdrEqDzA_sGUruHRe";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


/* --------------------------------
   ESCAPE HTML
-------------------------------- */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* --------------------------------
   TIME FORMAT
-------------------------------- */

function timeAgo(date){

  const seconds =
    Math.floor(
      (Date.now() - new Date(date).getTime()) / 1000
    );

  if(seconds < 60)
    return "just now";

  const minutes = Math.floor(seconds / 60);

  if(minutes < 60)
    return minutes + "m ago";

  const hours = Math.floor(minutes / 60);

  if(hours < 24)
    return hours + "h ago";

  const days = Math.floor(hours / 24);

  if(days < 7)
    return days + "d ago";

  const weeks = Math.floor(days / 7);

  if(weeks < 5)
    return weeks + "w ago";

  return new Date(date).toLocaleDateString();

}


/* --------------------------------
   NOTIFICATION ICON
-------------------------------- */

function notificationIcon(type){

  type = String(type || "").toLowerCase();

  if(type.includes("like"))
    return "♥";

  if(type.includes("comment"))
    return "💬";

  if(type.includes("follow"))
    return "＋";

  if(type.includes("reply"))
    return "↩";

  if(type.includes("mention"))
    return "@";

  return "●";

}


/* --------------------------------
   BUILD NOTIFICATION TEXT
-------------------------------- */

function notificationText(notification,actor){

  const type =
    String(notification.type || "").toLowerCase();

  const person =
    actor || "Someone";

  /*
    Use the actor username/name for the
    notifications where the action was
    triggered by another user.
  */

  if(type.includes("comment")){
    return person + " commented on your video.";
  }

  if(type.includes("like")){
    return person + " liked your video.";
  }

  if(type.includes("follow")){
    return person + " followed you.";
  }

  if(type.includes("reply")){
    return person + " replied to your comment.";
  }

  if(type.includes("mention")){
    return person + " mentioned you.";
  }

  /*
    Preserve custom notification messages
    for other notification types.
  */

  if(notification.message){
    return notification.message;
  }

  return "You have a new notification.";

}


/* --------------------------------
   LOAD NOTIFICATIONS
-------------------------------- */

async function loadNotifications(){

  const container =
    document.getElementById("notifications");

  try{

    const {
      data:{
        session
      }
    } =
      await supabaseClient.auth.getSession();

    if(!session || !session.user){

      container.innerHTML = `
        <div class="empty">
          Please sign in to view your notifications.
        </div>
      `;

      return;
    }

    const userId =
      session.user.id;


    /*
      Fetch notifications belonging to
      the current user.
    */

    const {
      data,
      error
    } =
      await supabaseClient
        .from("notifications")
        .select("*")
        .or(`user_id.eq.${userId},recipient_id.eq.${userId}`)
        .order("created_at",{ascending:false});


    if(error)
      throw error;


    if(!data || !data.length){

      container.innerHTML = `
        <div class="empty">
          No notifications yet.
        </div>
      `;

      return;
    }


    /*
      Collect actor IDs.
    */

    const actorIds =
      [
        ...new Set(
          data
            .map(x => x.actor_id)
            .filter(Boolean)
        )
      ];


    let users = [];

    if(actorIds.length){

      const {
        data:userData,
        error:userError
      } =
        await supabaseClient
          .from("users")
          .select("id,name,username")
          .in("id",actorIds);

      if(!userError && userData)
        users = userData;
    }


    /*
      Create actor lookup.
    */

    const actorMap = {};

    users.forEach(x => {

      /*
        Prefer username so a notification
        can read naturally as:

        geofrey commented on your video.
      */

      actorMap[x.id] =
        x.username ||
        x.name ||
        "Someone";

    });


    container.innerHTML =
      data.map(x => {

        const actor =
          actorMap[x.actor_id] || "Someone";

        const text =
          notificationText(
            x,
            actor
          );

        const unread =
          x.is_read === false;

        return `
          <div
            class="notification ${unread ? "unread" : ""}"
            data-id="${escapeHtml(x.id)}"
          >

            <div class="icon">
              ${notificationIcon(x.type)}
            </div>

            <div class="body">

              <div class="text">
                ${escapeHtml(text)}
              </div>

              <div class="time">
                ${timeAgo(x.created_at)}
              </div>

            </div>

          </div>
        `;

      }).join("");


    /*
      Mark unread notifications as read
      after displaying them.
    */

    const unreadIds =
      data
        .filter(x => x.is_read === false)
        .map(x => x.id);

    if(unreadIds.length){

      await supabaseClient
        .from("notifications")
        .update({
          is_read:true
        })
        .in("id",unreadIds);

    }

  }catch(error){

    console.error(
      "Notification loading error:",
      error
    );

    container.innerHTML = `
      <div class="error">
        Unable to load notifications.
      </div>
    `;

  }

}


/* --------------------------------
   NAVIGATION
-------------------------------- */

function goHome(){

  window.location.href =
    "home.html";

}

function goUpload(){

  window.location.href =
    "upload.html";

}

function goAccount(){

  window.location.href =
    "account.html";

}


/* --------------------------------
   START
-------------------------------- */

loadNotifications();

</script>

</body>
</html>
