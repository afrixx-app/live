<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIGULA — Notifications</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  color:#111;
  background:#fff
}
header{
  height:64px;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  padding:0 16px;
  gap:12px
}
a{
  color:#111;
  text-decoration:none
}
h1{
  font-size:20px;
  margin:0
}
main{
  max-width:760px;
  margin:auto;
  padding:8px 12px
}
.item{
  display:flex;
  gap:12px;
  padding:15px 8px;
  border-bottom:1px solid #eee;
  align-items:center
}
.icon{
  width:42px;
  height:42px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#eee;
  font-size:20px
}
.body{
  flex:1
}
.time{
  font-size:12px;
  color:#777;
  margin-top:4px
}
.empty{
  text-align:center;
  color:#777;
  padding:50px 10px
}
.unread{
  background:#f5fff7
}
</style>

</head>

<body>

<header>
  <a href="home.html" style="font-size:25px">‹</a>
  <h1>Notifications</h1>
</header>

<main id="list">
  <div class="empty">Loading…</div>
</main>

<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SB_URL = "https://vfteiggdhthvrrlndtbs.supabase.co";
const SB_KEY = "sb_publishable_7LUjk7PBJeCy-_ZdrEqDzA_sGUruHRe";

const supabaseClient = window.supabase.createClient(
  SB_URL,
  SB_KEY
);

async function api(path, options = {}) {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) {
    throw new Error("NO_SESSION");
  }

  return fetch(
    SB_URL + "/rest/v1/" + path,
    {
      ...options,
      headers: {
        apikey: SB_KEY,
        Authorization: "Bearer " + session.access_token,
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    }
  );
}


async function load() {

  const list = document.getElementById("list");

  try {

    /*
     * IMPORTANT:
     * Get the REAL Supabase session.
     * Do NOT call /auth/v1/user using the publishable key.
     */
    const {
      data: { session },
      error: sessionError
    } = await supabaseClient.auth.getSession();

    if (sessionError) {
      console.error("Session error:", sessionError);
      location.href = "signup.html";
      return;
    }

    if (!session || !session.user) {
      console.warn("No active Supabase session.");
      location.href = "signup.html";
      return;
    }

    const me = session.user;

    console.log("BIGULA notifications user:", me.id);


    /*
     * Load notifications belonging to the logged-in user.
     */
    const r = await api(
      "notifications?user_id=eq." +
      encodeURIComponent(me.id) +
      "&order=created_at.desc&limit=100"
    );

    if (!r.ok) {

      console.error(
        "Notifications load failed:",
        await r.text()
      );

      list.innerHTML =
        '<div class="empty">No notifications yet.</div>';

      return;
    }


    const rows = await r.json();

    if (!Array.isArray(rows) || !rows.length) {

      list.innerHTML =
        '<div class="empty">No notifications yet.</div>';

      return;
    }


    /*
     * Get actor IDs.
     */
    const actorIds = [
      ...new Set(
        rows
          .map(x => x.actor_id)
          .filter(Boolean)
      )
    ];

    const names = {};


    /*
     * Load actor names.
     */
    if (actorIds.length) {

      const u = await api(
        "users?id=in.(" +
        actorIds.map(id => encodeURIComponent(id)).join(",") +
        ")&select=id,name,username"
      );

      if (u.ok) {

        const users = await u.json();

        users.forEach(x => {

          names[x.id] =
            x.name ||
            ("@" + (x.username || "user"));

        });
      }
    }


    /*
     * Render notifications.
     */
    list.innerHTML = rows.map(x => {

      const actor =
        names[x.actor_id] || "Someone";

      const type =
        (x.type || "").toLowerCase();

      const icon =
        type.includes("like")
          ? "♥"
          : type.includes("comment")
          ? "💬"
          : type.includes("follow")
          ? "👤"
          : "🔔";

      const text =
        x.message ||
        (
          type.includes("like")
            ? actor + " liked your video."
            : type.includes("comment")
            ? actor + " commented on your video."
            : type.includes("follow")
            ? actor + " followed you."
            : "You have a new notification."
        );

      return `
        <div class="item ${!x.is_read ? "unread" : ""}">
          <div class="icon">${icon}</div>

          <div class="body">

            <div>
              ${escapeHtml(text)}
            </div>

            <div class="time">
              ${new Date(
                x.created_at || Date.now()
              ).toLocaleString()}
            </div>

          </div>
        </div>
      `;

    }).join("");


    /*
     * Mark notifications as read.
     */
    const unread =
      rows
        .filter(x => !x.is_read)
        .map(x => x.id)
        .filter(Boolean);


    if (unread.length) {

      await api(
        "notifications?id=in.(" +
        unread.map(id => encodeURIComponent(id)).join(",") +
        ")",
        {
          method: "PATCH",

          headers: {
            Prefer: "return=minimal"
          },

          body: JSON.stringify({
            is_read: true
          })
        }
      );
    }


  } catch (err) {

    console.error(
      "Notifications error:",
      err
    );

    /*
     * Only redirect when there really is no session.
     * Database/API errors must NOT send the user
     * back to signup.
     */
    if (err.message === "NO_SESSION") {

      location.href = "signup.html";
      return;
    }

    list.innerHTML =
      '<div class="empty">Unable to load notifications.</div>';
  }
}


function escapeHtml(s) {

  return String(s ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );
}


load();

</script>

</body>
</html>
