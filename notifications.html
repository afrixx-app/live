  <div class="header-title">

    Home
  </button>

</header>


<main
  class="notifications"
  id="notifications"
>

  <div class="loading">
    Loading notifications...
  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://vfteiggdhthvrrlndtbs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_7LUjk7PBJeCy-_ZdrEqDzA_sGUruHRe";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   TIME AGO
========================================================= */

function timeAgo(date){

  if(!date) return "";

  const seconds =
    Math.floor(
      (Date.now() - new Date(date).getTime()) / 1000
    );

  if(seconds < 60)
    return "just now";

  const minutes =
    Math.floor(seconds / 60);

  if(minutes < 60)
    return minutes + "m ago";

  const hours =
    Math.floor(minutes / 60);

  if(hours < 24)
    return hours + "h ago";

  const days =
    Math.floor(hours / 24);

  if(days < 7)
    return days + "d ago";

  const weeks =
    Math.floor(days / 7);

  if(weeks < 5)
    return weeks + "w ago";

  return new Date(date).toLocaleDateString();

}


/* =========================================================
   ICON
========================================================= */

function getNotificationIcon(type){

  const t =
    String(type || "").toLowerCase();

  if(t.includes("like"))
    return "♥";

  if(t.includes("comment"))
    return "💬";

  if(t.includes("follow"))
    return "＋";

  if(t.includes("reply"))
    return "↩";

  if(t.includes("mention"))
    return "@";

  return "●";

}


/* =========================================================
   GET ACTOR NAME
========================================================= */

function getActorName(user){

  if(!user)
    return "Someone";

  /*
    USERNAME FIRST.
    This gives:

    geofrey commented on your video.

    instead of:

    @geofrey commented...
  */

  return (
    user.username ||
    user.name ||
    "Someone"
  );

}


/* =========================================================
   BUILD MESSAGE
========================================================= */

function buildNotificationMessage(notification,actor){

  const type =
    String(notification.type || "").toLowerCase();

  if(type.includes("comment")){

    return actor +
      " commented on your video.";

  }

  if(type.includes("like")){

    return actor +
      " liked your video.";

  }

  if(type.includes("follow")){

    return actor +
      " followed you.";

  }

  if(type.includes("reply")){

    return actor +
      " replied to your comment.";

  }

  if(type.includes("mention")){

    return actor +
      " mentioned you.";

  }

  /*
    If the database contains its own
    message for another notification type,
    preserve it.
  */

  if(notification.message){

    return String(
      notification.message
    );

  }

  return "You have a new notification.";

}


/* =========================================================
   LOAD USER SESSION
========================================================= */

async function getCurrentUser(){

  /*
    Finish Google PKCE login if the page
    was opened with ?code=...
  */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const code =
    params.get("code");

  if(code){

    const {
      error
    } =
      await supabaseClient.auth.exchangeCodeForSession(
        code
      );

    if(error){

      console.error(
        "Session exchange error:",
        error
      );

    }else{

      /*
        Remove ?code= from the URL
        after successful login.
      */

      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );

    }

  }


  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();


  if(error){

    console.error(
      "Session error:",
      error
    );

    return null;

  }


  return data.session
    ? data.session.user
    : null;

}


/* =========================================================
   LOAD NOTIFICATIONS
========================================================= */

async function loadNotifications(){

  const container =
    document.getElementById(
      "notifications"
    );

  container.innerHTML = `
    <div class="loading">
      Loading notifications...
    </div>
  `;


  try{

    const user =
      await getCurrentUser();


    /* -----------------------------------------
       NO LOGIN
    ----------------------------------------- */

    if(!user){

      container.innerHTML = `
        <div class="empty">
          Please sign in to view your notifications.
        </div>
      `;

      return;

    }


    /* -----------------------------------------
       FIRST: USE user_id
    ----------------------------------------- */

    let notifications = null;
    let notificationError = null;


    const firstQuery =
      await supabaseClient
        .from("notifications")
        .select("*")
        .eq("user_id",user.id)
        .order(
          "created_at",
          {ascending:false}
        );


    notifications =
      firstQuery.data;

    notificationError =
      firstQuery.error;


    /* -----------------------------------------
       FALLBACK: recipient_id

       Only used if the table/query requires
       recipient_id instead.
    ----------------------------------------- */

    if(
      notificationError &&
      String(
        notificationError.message || ""
      ).toLowerCase().includes(
        "recipient_id"
      )
    ){

      const secondQuery =
        await supabaseClient
          .from("notifications")
          .select("*")
          .eq("recipient_id",user.id)
          .order(
            "created_at",
            {ascending:false}
          );

      notifications =
        secondQuery.data;

      notificationError =
        secondQuery.error;

    }


    /* -----------------------------------------
       REAL DATABASE ERROR
    ----------------------------------------- */

    if(notificationError){

      console.error(
        "Notifications query error:",
        notificationError
      );

      container.innerHTML = `
        <div class="error">

          Unable to load notifications.

          <br>

          <button
            class="retry"
            onclick="loadNotifications()"
          >
            Retry
          </button>

        </div>
      `;

      return;

    }


    /* -----------------------------------------
       NO NOTIFICATIONS
    ----------------------------------------- */

    if(
      !notifications ||
      notifications.length === 0
    ){

      container.innerHTML = `
        <div class="empty">
          No notifications yet.
        </div>
      `;

      return;

    }


    /* -----------------------------------------
       FIND ACTOR IDs
    ----------------------------------------- */

    const actorIds =
      [
        ...new Set(
          notifications
            .map(
              notification =>
                notification.actor_id
            )
            .filter(Boolean)
        )
      ];


    let actors = [];


    /* -----------------------------------------
       FETCH ACTOR USERS
    ----------------------------------------- */

    if(actorIds.length > 0){

      const {
        data,
        error
      } =
        await supabaseClient
          .from("users")
          .select(
            "id,name,username"
          )
          .in(
            "id",
            actorIds
          );


      if(error){

        console.error(
          "Actor lookup error:",
          error
        );

        /*
          Do not break the entire
          notification page just because
          an actor profile cannot be read.
        */

        actors = [];

      }else{

        actors =
          data || [];

      }

    }


    /* -----------------------------------------
       ACTOR LOOKUP MAP
    ----------------------------------------- */

    const actorMap = {};

    actors.forEach(user => {

      actorMap[user.id] =
        getActorName(user);

    });


    /* -----------------------------------------
       DISPLAY NOTIFICATIONS
    ----------------------------------------- */

    container.innerHTML =
      notifications
        .map(notification => {

          const actor =
            actorMap[
              notification.actor_id
            ] || "Someone";


          const message =
            buildNotificationMessage(
              notification,
              actor
            );


          const isUnread =
            notification.is_read === false ||
            notification.is_read === null;


          return `
            <div
              class="notification ${
                isUnread ? "unread" : ""
              }"
              data-id="${
                escapeHtml(
                  notification.id
                )
              }"
            >

              <div class="icon">
                ${
                  getNotificationIcon(
                    notification.type
                  )
                }
              </div>

              <div class="body">

                <div class="text">
                  ${
                    escapeHtml(
                      message
                    )
                  }
                </div>

                <div class="time">
                  ${
                    timeAgo(
                      notification.created_at
                    )
                  }
                </div>

              </div>

            </div>
          `;

        })
        .join("");


    /* -----------------------------------------
       MARK UNREAD NOTIFICATIONS AS READ
    ----------------------------------------- */

    const unreadIds =
      notifications
        .filter(
          notification =>
            notification.is_read === false
        )
        .map(
          notification =>
            notification.id
        );


    if(unreadIds.length > 0){

      const {
        error
      } =
        await supabaseClient
          .from("notifications")
          .update({
            is_read:true
          })
          .in(
            "id",
            unreadIds
          );


      if(error){

        console.error(
          "Mark read error:",
          error
        );

      }

    }

  }catch(error){

    console.error(
      "Notification page error:",
      error
    );

    container.innerHTML = `
      <div class="error">

        Unable to load notifications.

        <br>

        <button
          class="retry"
          onclick="loadNotifications()"
        >
          Retry
        </button>

      </div>
    `;

  }

}


/* =========================================================
   HOME
========================================================= */

function goHome(){

  window.location.href =
    "home.html";

}


/* =========================================================
   START
========================================================= */

loadNotifications();

</script>

</body>
</html>
