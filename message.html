<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>BIGULA Messages</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  height:100%;
  font-family:Arial,sans-serif;
  background:#fff;
  color:#111;
}

body{
  display:flex;
  flex-direction:column;
}

/* =========================================================
   HEADER
========================================================= */

header{
  flex:0 0 auto;

  position:sticky;
  top:0;

  background:#fff;

  border-bottom:1px solid #ddd;

  padding:
    calc(10px + env(safe-area-inset-top))
    16px
    12px;

  z-index:10;
}

.headerRow{
  display:flex;
  align-items:center;
  gap:10px;
}

.backBtn{
  width:38px;
  height:38px;

  border:0;
  border-radius:50%;

  background:#f1f1f1;

  color:#111;

  font-size:25px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}

header strong{
  font-size:20px;
}

#status{
  font-size:13px;
  color:#666;
  margin-top:4px;
  margin-left:48px;
}

/* =========================================================
   MESSAGES AREA
========================================================= */

#messages{
  flex:1;

  overflow-y:auto;

  padding:
    16px
    12px
    100px;

  min-height:0;

  scroll-behavior:smooth;
}

.msg{
  max-width:78%;

  padding:10px 13px;

  margin:8px 0;

  border-radius:16px;

  word-break:break-word;

  line-height:1.4;

  position:relative;
}

.mine{
  margin-left:auto;

  background:#111;

  color:#fff;

  border-bottom-right-radius:5px;
}

.theirs{
  margin-right:auto;

  background:#eee;

  color:#111;

  border-bottom-left-radius:5px;
}

.time{
  display:block;

  font-size:10px;

  opacity:.65;

  margin-top:4px;

  text-align:right;
}

.empty{
  text-align:center;

  color:#777;

  padding:50px 15px;
}

/* =========================================================
   MESSAGE FORM
========================================================= */

form{
  flex:0 0 auto;

  position:fixed;

  bottom:0;
  left:0;
  right:0;

  background:#fff;

  border-top:1px solid #ddd;

  padding:
    10px
    10px
    calc(10px + env(safe-area-inset-bottom));

  display:flex;

  gap:8px;

  z-index:20;
}

#messageInput{
  flex:1;

  min-width:0;

  border:1px solid #ccc;

  border-radius:22px;

  padding:11px 14px;

  font-size:15px;

  outline:none;
}

#messageInput:focus{
  border-color:#888;
}

button{
  border:0;

  border-radius:22px;

  padding:0 18px;

  background:#111;

  color:#fff;

  font-weight:700;
}

#sendBtn{
  min-width:72px;
}

#sendBtn:disabled{
  opacity:.45;
}

/* =========================================================
   DELIVERY STATE
========================================================= */

.sending{
  opacity:.65;
}

/* =========================================================
   TOAST
========================================================= */

#toast{
  position:fixed;

  left:50%;
  bottom:85px;

  transform:
    translate(-50%,10px);

  background:#222;

  color:#fff;

  padding:10px 14px;

  border-radius:10px;

  font-size:13px;

  opacity:0;

  pointer-events:none;

  transition:.2s;

  z-index:50;

  max-width:90%;

  text-align:center;
}

#toast.show{
  opacity:1;

  transform:
    translate(-50%,0);
}

</style>
</head>

<body>

<!-- =======================================================
     HEADER
======================================================= -->

<header>

  <div class="headerRow">

    <button
      id="backBtn"
      class="backBtn"
      type="button"
      aria-label="Back">
      ‹
    </button>

    <strong>
      Messages
    </strong>

  </div>

  <div id="status">
    Checking your BIGULA session…
  </div>

</header>


<!-- =======================================================
     MESSAGES
======================================================= -->

<div id="messages">

  <div class="empty">
    Loading…
  </div>

</div>


<!-- =======================================================
     SEND FORM
======================================================= -->

<form id="sendForm">

  <input
    id="messageInput"
    autocomplete="off"
    maxlength="5000"
    placeholder="Write a message…"
    disabled>

  <button
    id="sendBtn"
    type="submit"
    disabled>

    Send

  </button>

</form>


<!-- =======================================================
     TOAST
======================================================= -->

<div id="toast"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://vfteiggdhthvrrlndtbs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_7LUjk7PBJeCy-_ZdrEqDzA_sGUruHRe";


const supabase =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true,
      flowType:"pkce"
    }
  }
);


/* =========================================================
   ELEMENTS
========================================================= */

const params =
new URLSearchParams(
  location.search
);


const recipientId =
params.get("uid") ||
params.get("user_id") ||
params.get("to");


const messagesEl =
document.getElementById(
  "messages"
);


const statusEl =
document.getElementById(
  "status"
);


const input =
document.getElementById(
  "messageInput"
);


const sendBtn =
document.getElementById(
  "sendBtn"
);


const form =
document.getElementById(
  "sendForm"
);


const backBtn =
document.getElementById(
  "backBtn"
);


const toastEl =
document.getElementById(
  "toast"
);


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let pollTimer = null;

let sending = false;

let authSubscription = null;


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );
}


/* =========================================================
   TOAST
========================================================= */

function toast(text){

  toastEl.textContent =
    text;

  toastEl.classList.add(
    "show"
  );

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer =
    setTimeout(
      ()=>{
        toastEl.classList.remove(
          "show"
        );
      },
      2500
    );
}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(value){

  if(!value)
    return "";

  const d =
    new Date(value);

  if(
    Number.isNaN(
      d.getTime()
    )
  ){
    return "";
  }

  return d.toLocaleString(
    undefined,
    {
      month:"short",
      day:"numeric",
      hour:"numeric",
      minute:"2-digit"
    }
  );
}


/* =========================================================
   PKCE SESSION
========================================================= */

async function finishPKCE(){

  const code =
    params.get("code");

  if(!code)
    return;


  try{

    const {
      error
    } =
    await supabase.auth
      .exchangeCodeForSession(
        code
      );


    if(error){

      console.error(
        "PKCE exchange error:",
        error
      );

      return;
    }


    /*
      Remove ?code= from
      the visible URL.
    */

    const cleanParams =
      new URLSearchParams();


    if(recipientId){

      cleanParams.set(
        "uid",
        recipientId
      );
    }


    const cleanUrl =
      location.pathname +
      (
        cleanParams.toString()
        ?
        "?" +
        cleanParams.toString()
        :
        ""
      );


    history.replaceState(
      {},
      document.title,
      cleanUrl
    );

  }catch(error){

    console.error(
      "PKCE exception:",
      error
    );
  }
}


/* =========================================================
   GET CURRENT SESSION
========================================================= */

async function getCurrentUser(){

  try{

    const {
      data,
      error
    } =
    await supabase.auth
      .getSession();


    if(error){

      console.warn(
        "getSession:",
        error
      );
    }


    if(
      data?.session?.user
    ){

      return data.session.user;
    }


    /*
      Try refreshing an existing
      refreshable session.
    */

    const refreshed =
      await supabase.auth
        .refreshSession();


    if(
      !refreshed.error &&
      refreshed.data?.session?.user
    ){

      return refreshed
        .data
        .session
        .user;
    }


    return null;

  }catch(error){

    console.error(
      "Session error:",
      error
    );

    return null;
  }
}


/* =========================================================
   CHECK RECIPIENT
========================================================= */

function validateRecipient(){

  if(!recipientId){

    statusEl.textContent =
      "No recipient selected.";

    messagesEl.innerHTML = `
      <div class="empty">
        Open a user profile and choose Message.
      </div>
    `;

    return false;
  }


  if(
    currentUser &&
    recipientId === currentUser.id
  ){

    statusEl.textContent =
      "You cannot message yourself.";

    messagesEl.innerHTML = `
      <div class="empty">
        Select another BIGULA user.
      </div>
    `;

    input.disabled = true;

    sendBtn.disabled = true;

    return false;
  }


  return true;
}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(
  rows
){

  if(!rows?.length){

    messagesEl.innerHTML = `
      <div class="empty">
        No messages yet.<br>
        Start the conversation.
      </div>
    `;

    return;
  }


  messagesEl.innerHTML =
    rows.map(
      message => {

        const mine =
          message.sender_id ===
          currentUser.id;


        const body =
          message.message ??
          "";


        return `

          <div
            class="msg ${
              mine
              ? "mine"
              : "theirs"
            }">

            ${esc(body)}

            <span class="time">

              ${esc(
                formatDate(
                  message.created_at
                )
              )}

              ${
                mine
                ?
                (
                  message.is_read
                  ? " · Read"
                  : " · Sent"
                )
                :
                ""
              }

            </span>

          </div>

        `;
      }
    ).join("");


  /*
    Always show the newest
    message.
  */

  requestAnimationFrame(
    ()=>{
      messagesEl.scrollTop =
        messagesEl.scrollHeight;
    }
  );
}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(){

  if(
    !currentUser ||
    !recipientId
  ){

    return;
  }


  const uid =
    currentUser.id;


  /*
    Explicit OR expression.

    Conversation consists of:

    current user -> recipient

    OR

    recipient -> current user
  */

  const conversation =
    `and(sender_id.eq.${uid},recipient_id.eq.${recipientId}),and(sender_id.eq.${recipientId},recipient_id.eq.${uid})`;


  const {
    data,
    error
  } =
  await supabase
    .from("messages")
    .select(
      "id,sender_id,recipient_id,message,created_at,is_read"
    )
    .or(conversation)
    .order(
      "created_at",
      {
        ascending:true
      }
    );


  if(error){

    console.error(
      "Message load error:",
      error
    );


    statusEl.textContent =
      "Could not load messages.";


    /*
      This often means RLS
      is blocking SELECT.
    */

    messagesEl.innerHTML = `
      <div class="empty">

        Could not load this conversation.

        <br><br>

        <small>
          ${esc(error.message)}
        </small>

      </div>
    `;

    return;
  }


  statusEl.textContent =
    "Conversation";


  renderMessages(
    data || []
  );


  /*
    Mark incoming messages
    as read.
  */

  const unreadIds =
    (data || [])
      .filter(
        message =>
          message.sender_id === recipientId &&
          message.recipient_id === currentUser.id &&
          message.is_read === false
      )
      .map(
        message => message.id
      );


  if(unreadIds.length){

    const {
      error:readError
    } =
    await supabase
      .from("messages")
      .update({
        is_read:true
      })
      .in(
        "id",
        unreadIds
      );


    if(readError){

      console.warn(
        "Read receipt error:",
        readError
      );
    }
  }
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  if(sending)
    return;


  if(!currentUser){

    toast(
      "Please sign in first."
    );

    return;
  }


  if(!recipientId){

    toast(
      "No recipient selected."
    );

    return;
  }


  if(
    recipientId ===
    currentUser.id
  ){

    toast(
      "You cannot message yourself."
    );

    return;
  }


  const body =
    input.value.trim();


  if(!body)
    return;


  sending = true;


  sendBtn.disabled =
    true;

  input.classList.add(
    "sending"
  );


  /*
    IMPORTANT:

    The insert uses exactly
    the columns in your
    public.messages table.
  */

  const {
    data,
    error
  } =
  await supabase
    .from("messages")
    .insert({
      sender_id:
        currentUser.id,

      recipient_id:
        recipientId,

      message:
        body,

      is_read:
        false
    })
    .select()
    .single();


  if(error){

    console.error(
      "MESSAGE INSERT ERROR:",
      error
    );


    /*
      Give the actual database
      error to the user.
    */

    toast(
      "Message failed: " +
      error.message
    );


    statusEl.textContent =
      "Message could not be delivered.";


    sending = false;

    sendBtn.disabled =
      false;

    input.classList.remove(
      "sending"
    );

    return;
  }


  /*
    Only clear the input after
    Supabase confirms the insert.
  */

  input.value =
    "";


  toast(
    "Message sent"
  );


  /*
    Immediately reload the
    conversation so the sender
    sees the new message.
  */

  await loadMessages();


  sending = false;

  sendBtn.disabled =
    false;

  input.classList.remove(
    "sending"
  );


  input.focus();
}


/* =========================================================
   AUTH CHANGE
========================================================= */

function setupAuthListener(){

  const {
    data
  } =
  supabase.auth.onAuthStateChange(
    async(
      event,
      session
    )=>{

      /*
        Ignore token refresh events
        that still have the same user.
      */

      if(
        session?.user
      ){

        const changed =
          !currentUser ||
          currentUser.id !==
          session.user.id;


        currentUser =
          session.user;


        if(changed){

          if(validateRecipient()){

            statusEl.textContent =
              "Signed in";

            input.disabled =
              false;

            sendBtn.disabled =
              false;

            await loadMessages();
          }

        }

        return;
      }


      /*
        User actually became
        signed out.
      */

      if(
        event ===
        "SIGNED_OUT"
      ){

        currentUser =
          null;


        clearInterval(
          pollTimer
        );


        input.disabled =
          true;

        sendBtn.disabled =
          true;


        statusEl.textContent =
          "Please sign in to use messages.";


        location.replace(
          "signup.html"
        );
      }

    }
  );


  authSubscription =
    data.subscription;
}


/* =========================================================
   BACK BUTTON
========================================================= */

backBtn.onclick =
  ()=>{

    if(
      history.length > 1
    ){

      history.back();

    }else{

      location.href =
        "home.html";
    }
  };


/* =========================================================
   FORM
========================================================= */

form.addEventListener(
  "submit",
  event => {

    event.preventDefault();

    sendMessage();
  }
);


/* =========================================================
   ENTER TO SEND
========================================================= */

input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();
    }
  }
);


/* =========================================================
   INITIALIZE
========================================================= */

async function init(){

  /*
    Validate URL first.
  */

  if(!recipientId){

    validateRecipient();

    return;
  }


  /*
    Finish Google/Supabase
    PKCE exchange first.
  */

  await finishPKCE();


  /*
    Now retrieve the actual
    authenticated user.
  */

  currentUser =
    await getCurrentUser();


  if(!currentUser){

    statusEl.textContent =
      "Please sign in to use messages.";


    messagesEl.innerHTML = `
      <div class="empty">
        Please sign in to use BIGULA Messages.
      </div>
    `;


    input.disabled =
      true;

    sendBtn.disabled =
      true;


    setTimeout(
      ()=>{
        location.replace(
          "signup.html"
        );
      },
      700
    );


    return;
  }


  /*
    Don't allow self-messaging.
  */

  if(
    !validateRecipient()
  ){

    return;
  }


  statusEl.textContent =
    "Signed in";


  input.disabled =
    false;

  sendBtn.disabled =
    false;


  /*
    Initial conversation load.
  */

  await loadMessages();


  /*
    Keep messages current.
  */

  clearInterval(
    pollTimer
  );


  pollTimer =
    setInterval(
      ()=>{
        loadMessages();
      },
      3000
    );


  /*
    Watch authentication.
  */

  setupAuthListener();


  /*
    Focus message box.
  */

  input.focus();
}


/* =========================================================
   START
========================================================= */

init();

</script>

</body>
</html>
