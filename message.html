<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIGULA Messages</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
  background:#fff;
  color:#111;
}

body{
  display:flex;
  flex-direction:column;
  overflow:hidden;
}


/* =========================================================
   HEADER
========================================================= */

header{
  flex-shrink:0;
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:12px 15px;
  z-index:5;
}

.header-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.back{
  border:0;
  background:none;
  color:#111;
  padding:4px;
  margin:0;
  width:auto;
  font-size:25px;
  line-height:1;
  cursor:pointer;
}

.header-info{
  min-width:0;
}

header strong{
  display:block;
  font-size:19px;
}

#recipientName{
  display:block;
  margin-top:3px;
  color:#777;
  font-size:12px;
}

#status{
  margin-top:3px;
  font-size:12px;
  color:#777;
}


/* =========================================================
   MESSAGES AREA
========================================================= */

#messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:15px 12px 90px;
  background:#fff;
  scroll-behavior:smooth;
}

.msg-row{
  width:100%;
  display:flex;
  margin:7px 0;
}

.msg-row.mine{
  justify-content:flex-end;
}

.msg-row.theirs{
  justify-content:flex-start;
}

.msg{
  max-width:78%;
  padding:10px 13px;
  border-radius:17px;
  word-break:break-word;
  overflow-wrap:anywhere;
  line-height:1.35;
  font-size:15px;
}

.mine .msg{
  background:#111;
  color:#fff;
  border-bottom-right-radius:5px;
}

.theirs .msg{
  background:#eee;
  color:#111;
  border-bottom-left-radius:5px;
}

.time{
  display:block;
  font-size:10px;
  opacity:.62;
  margin-top:4px;
}

.empty{
  text-align:center;
  color:#777;
  padding:55px 15px;
  font-size:14px;
}

.error{
  margin:20px auto;
  max-width:600px;
  padding:14px;
  border-radius:10px;
  background:#ffe9e9;
  color:#a00000;
  font-size:14px;
  line-height:1.45;
  word-break:break-word;
}


/* =========================================================
   COMPOSER
========================================================= */

form{
  flex-shrink:0;
  display:flex;
  gap:8px;
  padding:10px;
  background:#fff;
  border-top:1px solid #ddd;
}

#messageInput{
  flex:1;
  min-width:0;
  border:1px solid #ccc;
  border-radius:22px;
  padding:11px 14px;
  font-size:15px;
  outline:none;
}

#messageInput:focus{
  border-color:#111;
}

#sendBtn{
  flex-shrink:0;
  border:0;
  border-radius:22px;
  padding:0 18px;
  min-width:70px;
  background:#111;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

#sendBtn:disabled{
  opacity:.45;
  cursor:not-allowed;
}


/* =========================================================
   SMALL SCREENS
========================================================= */

@media(max-width:420px){

  .msg{
    max-width:84%;
  }

  #sendBtn{
    padding:0 15px;
  }

}
</style>
</head>

<body>


<header>

  <div class="header-row">

    <button
      id="backBtn"
      class="back"
      type="button"
      aria-label="Back">
      ‹
    </button>

    <div class="header-info">

      <strong>Messages</strong>

      <span id="recipientName">
        Loading…
      </span>

      <div id="status">
        Checking your BIGULA session…
      </div>

    </div>

  </div>

</header>


<div id="messages">

  <div class="empty">
    Loading messages…
  </div>

</div>


<form id="sendForm">

  <input
    id="messageInput"
    autocomplete="off"
    maxlength="5000"
    placeholder="Write a message…"
    disabled>

  <button
    id="sendBtn"
    type="submit"
    disabled>
    Send
  </button>

</form>


<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


/* =========================================================
   BIGULA SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://vfteiggdhthvrrlndtbs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_7LUjk7PBJeCy-_ZdrEqDzA_sGUruHRe";


const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true,
      flowType:"pkce"
    }
  }
);


/* =========================================================
   URL
========================================================= */

const params =
  new URLSearchParams(location.search);

const recipientId =
  params.get("uid") ||
  params.get("user_id") ||
  params.get("to");


/* =========================================================
   ELEMENTS
========================================================= */

const messagesEl =
  document.getElementById("messages");

const statusEl =
  document.getElementById("status");

const recipientNameEl =
  document.getElementById("recipientName");

const input =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const form =
  document.getElementById("sendForm");

const backBtn =
  document.getElementById("backBtn");


/* =========================================================
   STATE
========================================================= */

let currentUser =
  null;

let recipient =
  null;

let pollTimer =
  null;

let loadingMessages =
  false;


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c]));

}


/* =========================================================
   GET AUTHENTICATED USER
========================================================= */

async function getCurrentUser(){

  /*
    First use the existing persisted session.
  */

  const {
    data,
    error
  } =
    await supabase.auth.getSession();


  if(error){

    console.error(
      "getSession error:",
      error
    );

  }


  if(data?.session?.user){

    return data.session.user;

  }


  /*
    Try refresh if session wasn't immediately available.
  */

  const refreshed =
    await supabase.auth.refreshSession();


  if(
    !refreshed.error &&
    refreshed.data?.session?.user
  ){

    return refreshed.data.session.user;

  }


  return null;

}


/* =========================================================
   SHOW ERROR
========================================================= */

function showError(message){

  messagesEl.innerHTML =
    `<div class="error">${esc(message)}</div>`;

}


/* =========================================================
   LOAD RECIPIENT PROFILE
========================================================= */

async function loadRecipient(){

  if(!recipientId){

    recipientNameEl.textContent =
      "No recipient selected";

    return false;

  }


  /*
    Fetch the recipient from users.
    Select * prevents this page from breaking if
    your users table has different optional profile
    column names.
  */

  const {
    data,
    error
  } =
    await supabase
      .from("users")
      .select("*")
      .eq("id",recipientId)
      .maybeSingle();


  if(error){

    console.error(
      "Recipient error:",
      error
    );

    /*
      Messaging can still work even if profile
      information cannot be loaded.
    */

    recipientNameEl.textContent =
      "User";

    return true;

  }


  if(data){

    recipient =
      data;


    const name =
      data.name ||
      data.full_name ||
      data.username ||
      data.display_name ||
      data.email ||
      "User";


    recipientNameEl.textContent =
      name;

  }else{

    recipientNameEl.textContent =
      "User";

  }


  return true;

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(rows){

  if(!rows || !rows.length){

    messagesEl.innerHTML =
      `<div class="empty">
        No messages yet.<br>
        Start the conversation.
      </div>`;

    return;

  }


  messagesEl.innerHTML =
    rows.map(message => {

      const mine =
        String(message.sender_id) ===
        String(currentUser.id);


      const text =
        message.message ?? "";


      const date =
        message.created_at
          ? new Date(
              message.created_at
            ).toLocaleString()
          : "";


      return `
        <div class="msg-row ${mine ? "mine" : "theirs"}">

          <div class="msg">

            ${esc(text)}

            <span class="time">
              ${esc(date)}
              ${mine && message.is_read ? " · Read" : ""}
            </span>

          </div>

        </div>
      `;

    }).join("");


  /*
    Always show the newest messages.
  */

  requestAnimationFrame(() => {

    messagesEl.scrollTop =
      messagesEl.scrollHeight;

  });

}


/* =========================================================
   LOAD CONVERSATION
========================================================= */

async function loadMessages(){

  if(
    loadingMessages ||
    !currentUser ||
    !recipientId
  ){

    return;

  }


  loadingMessages =
    true;


  try{

    /*
      Get both directions of this conversation.

      sender = me + recipient
      OR
      sender = recipient + me
    */

    const {
      data,
      error
    } =
      await supabase
        .from("messages")
        .select(
          "id,sender_id,recipient_id,message,created_at,is_read"
        )
        .or(
          `and(sender_id.eq.${currentUser.id},recipient_id.eq.${recipientId}),and(sender_id.eq.${recipientId},recipient_id.eq.${currentUser.id})`
        )
        .order(
          "created_at",
          {
            ascending:true
          }
        );


    if(error){

      console.error(
        "Message load error:",
        error
      );

      statusEl.textContent =
        "Message database error.";

      showError(
        "Could not load messages: " +
        error.message
      );

      return;

    }


    renderMessages(
      data || []
    );


    /*
      Mark messages received from this person
      as read.
    */

    const {
      error:readError
    } =
      await supabase
        .from("messages")
        .update({
          is_read:true
        })
        .eq(
          "sender_id",
          recipientId
        )
        .eq(
          "recipient_id",
          currentUser.id
        )
        .eq(
          "is_read",
          false
        );


    if(readError){

      /*
        Don't destroy the conversation if only
        the read receipt policy is missing.
      */

      console.warn(
        "Read receipt update failed:",
        readError
      );

    }


    statusEl.textContent =
      "Connected";

  }catch(error){

    console.error(
      "Conversation error:",
      error
    );

    statusEl.textContent =
      "Connection error.";

  }finally{

    loadingMessages =
      false;

  }

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  const body =
    input.value.trim();


  if(
    !body ||
    !currentUser ||
    !recipientId
  ){

    return;

  }


  if(
    String(currentUser.id) ===
    String(recipientId)
  ){

    alert(
      "You cannot send a message to yourself."
    );

    return;

  }


  sendBtn.disabled =
    true;

  input.disabled =
    true;

  statusEl.textContent =
    "Sending…";


  try{

    /*
      IMPORTANT:
      Supabase automatically sends the real logged-in
      user's JWT here.

      We do NOT manually put the publishable key
      into Authorization.
    */

    const {
      data,
      error
    } =
      await supabase
        .from("messages")
        .insert({
          sender_id:currentUser.id,
          recipient_id:recipientId,
          message:body,
          is_read:false
        })
        .select(
          "id,sender_id,recipient_id,message,created_at,is_read"
        )
        .single();


    if(error){

      console.error(
        "Message send error:",
        error
      );

      throw error;

    }


    /*
      Put the sent message immediately on screen.
      No waiting for polling.
    */

    input.value =
      "";


    await loadMessages();


    statusEl.textContent =
      "Delivered";

  }catch(error){

    console.error(
      "BIGULA send message error:",
      error
    );

    alert(
      "Message could not be delivered:\n\n" +
      (error.message || error)
    );

    statusEl.textContent =
      "Message not sent.";

  }finally{

    input.disabled =
      false;

    sendBtn.disabled =
      false;

    input.focus();

  }

}


/* =========================================================
   BACK BUTTON
========================================================= */

backBtn.addEventListener(
  "click",
  () => {

    if(
      history.length > 1
    ){

      history.back();

    }else{

      location.href =
        "account.html";

    }

  }
);


/* =========================================================
   FORM
========================================================= */

form.addEventListener(
  "submit",
  event => {

    event.preventDefault();

    sendMessage();

  }
);


/* =========================================================
   AUTH CHANGES
========================================================= */

supabase.auth.onAuthStateChange(
  (event,session) => {

    if(
      event === "SIGNED_OUT" ||
      !session?.user
    ){

      if(pollTimer){

        clearInterval(
          pollTimer
        );

      }

      location.replace(
        "signup.html"
      );

    }

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

async function init(){

  try{

    if(!recipientId){

      statusEl.textContent =
        "No recipient selected.";

      recipientNameEl.textContent =
        "Messages";

      showError(
        "No recipient ID was supplied. Open Messages from a user's profile."
      );

      return;

    }


    currentUser =
      await getCurrentUser();


    if(!currentUser){

      location.replace(
        "signup.html?next=" +
        encodeURIComponent(
          "messages.html?uid=" +
          recipientId
        )
      );

      return;

    }


    /*
      Don't allow self-conversation.
    */

    if(
      String(currentUser.id) ===
      String(recipientId)
    ){

      statusEl.textContent =
        "Invalid recipient.";

      showError(
        "You cannot open a conversation with yourself."
      );

      return;

    }


    await loadRecipient();

    await loadMessages();


    input.disabled =
      false;

    sendBtn.disabled =
      false;

    input.focus();


    /*
      Poll every 3 seconds so the recipient sees
      new messages without refreshing.
    */

    pollTimer =
      setInterval(
        loadMessages,
        3000
      );


  }catch(error){

    console.error(
      "BIGULA Messages initialization error:",
      error
    );

    statusEl.textContent =
      "Messages failed to start.";

    showError(
      "Messages could not start: " +
      (error.message || error)
    );

  }

}


init();

</script>

</body>
</html>
