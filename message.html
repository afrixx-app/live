<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIGULA Messages</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#111}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:14px 16px;z-index:5}
header strong{font-size:20px}
#status{font-size:13px;color:#666;margin-top:4px}
#messages{padding:16px 12px 90px;min-height:calc(100vh - 120px)}
.msg{max-width:78%;padding:10px 13px;margin:8px 0;border-radius:16px;word-break:break-word}
.mine{margin-left:auto;background:#111;color:#fff;border-bottom-right-radius:5px}
.theirs{margin-right:auto;background:#eee;color:#111;border-bottom-left-radius:5px}
.time{display:block;font-size:10px;opacity:.65;margin-top:4px}
.empty{text-align:center;color:#777;padding:50px 15px}
form{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:10px;display:flex;gap:8px}
#messageInput{flex:1;border:1px solid #ccc;border-radius:22px;padding:11px 14px;font-size:15px}
button{border:0;border-radius:22px;padding:0 18px;background:#111;color:#fff;font-weight:700}
</style>
</head>
<body>
<header>
  <strong>Messages</strong>
  <div id="status">Checking your BIGULA session…</div>
</header>
<div id="messages"><div class="empty">Loading…</div></div>

<form id="sendForm">
  <input id="messageInput" autocomplete="off" placeholder="Write a message…" disabled>
  <button id="sendBtn" type="submit" disabled>Send</button>
</form>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SUPABASE_URL = "https://vfteiggdhthvrrlndtbs.supabase.co";
const SUPABASE_KEY = "sb_publishable_7LUjk7PBJeCy-_ZdrEqDzA_sGUruHRe";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
});

const params = new URLSearchParams(location.search);
const recipientId = params.get("uid") || params.get("user_id") || params.get("to");
const messagesEl = document.getElementById("messages");
const statusEl = document.getElementById("status");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const form = document.getElementById("sendForm");

let currentUser = null;
let pollTimer = null;

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

async function getLiveSession(){
  // getSession reads the persisted Supabase session from this same origin.
  const {data, error} = await supabase.auth.getSession();
  if(error) console.warn("getSession:", error);
  if(data?.session?.user) return data.session.user;

  // A refresh catches an expired/stale access token without falsely treating
  // an existing refreshable session as logged out.
  const refreshed = await supabase.auth.refreshSession();
  if(!refreshed.error && refreshed.data?.session?.user){
    return refreshed.data.session.user;
  }
  return null;
}

function requireRecipient(){
  if(!recipientId){
    statusEl.textContent = "No recipient selected.";
    messagesEl.innerHTML = '<div class="empty">Open a user profile and choose Message.</div>';
    return false;
  }
  return true;
}

function renderMessages(rows){
  if(!rows?.length){
    messagesEl.innerHTML = '<div class="empty">No messages yet. Start the conversation.</div>';
    return;
  }

  messagesEl.innerHTML = rows.map(m => {
    const mine = m.sender_id === currentUser.id;
    const body = m.message ?? m.text ?? "";
    const date = m.created_at ? new Date(m.created_at).toLocaleString() : "";
    return `<div class="msg ${mine ? "mine" : "theirs"}">${esc(body)}<span class="time">${esc(date)}</span></div>`;
  }).join("");

  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function loadMessages(){
  if(!currentUser || !recipientId) return;

  const {data, error} = await supabase
    .from("messages")
    .select("*")
    .or(`and(sender_id.eq.${currentUser.id},recipient_id.eq.${recipientId}),and(sender_id.eq.${recipientId},recipient_id.eq.${currentUser.id})`)
    .order("created_at",{ascending:true});

  if(error){
    console.error("Message load error:", error);
    statusEl.textContent = "Could not load messages.";
    return;
  }

  renderMessages(data || []);

  // Mark incoming messages as read.
  await supabase
    .from("messages")
    .update({is_read:true})
    .eq("sender_id",recipientId)
    .eq("recipient_id",currentUser.id)
    .eq("is_read",false);
}

async function sendMessage(){
  const body = input.value.trim();
  if(!body || !currentUser || !recipientId) return;

  sendBtn.disabled = true;

  const {error} = await supabase.from("messages").insert({
    sender_id: currentUser.id,
    recipient_id: recipientId,
    message: body,
    is_read: false
  });

  if(error){
    console.error("Message send error:", error);
    alert("Message could not be delivered: " + error.message);
    sendBtn.disabled = false;
    return;
  }

  input.value = "";
  await loadMessages();
  sendBtn.disabled = false;
}

async function init(){
  if(!requireRecipient()) return;

  currentUser = await getLiveSession();

  if(!currentUser){
    statusEl.textContent = "Please sign in to use messages.";
    alert("Please sign in first.");
    location.replace("signup.html");
    return;
  }

  statusEl.textContent = "Signed in";
  input.disabled = false;
  sendBtn.disabled = false;

  await loadMessages();

  // Keep the conversation current even without realtime.
  pollTimer = setInterval(loadMessages, 5000);

  supabase.auth.onAuthStateChange(async (event, session) => {
    currentUser = session?.user || null;
    if(!currentUser){
      clearInterval(pollTimer);
      location.replace("signup.html");
      return;
    }
    await loadMessages();
  });
}

form.addEventListener("submit", e => {
  e.preventDefault();
  sendMessage();
});

init();
</script>
</body>
</html>
