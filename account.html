<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIGULA – Account</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Segoe UI,sans-serif
}

body{
  background:#0b0b0b;
  color:#fff;
  padding-bottom:30px
}

.header{
  position:sticky;
  top:0;
  z-index:20;
  background:#111;
  border-bottom:1px solid #222;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.logo{
  font-size:24px;
  font-weight:900;
  color:#ff1744;
  letter-spacing:2px
}

.back{
  border:0;
  background:#222;
  color:#fff;
  padding:9px 14px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer
}

.profile{
  text-align:center;
  padding:28px 16px 22px;
  background:linear-gradient(#171717,#0b0b0b);
  border-bottom:1px solid #222
}

.avatar{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #ff1744;
  background:#222
}

.name{
  margin-top:12px;
  font-size:28px;
  font-weight:900
}

.handle{
  color:#aaa;
  margin-top:3px
}

.bio{
  max-width:650px;
  margin:10px auto;
  color:#bbb;
  line-height:1.5
}

/* STAT BUTTONS */

.stats{
  display:flex;
  justify-content:center;
  gap:9px;
  margin:20px auto;
  flex-wrap:wrap
}

.stat{
  min-width:105px;
  background:#161616;
  border:1px solid #292929;
  border-radius:14px;
  padding:11px 15px;
  color:#fff;
  cursor:pointer;
  transition:.2s;
  font:inherit
}

.stat:hover{
  background:#202020;
  border-color:#ff1744;
  transform:translateY(-2px)
}

.stat.active{
  background:#251116;
  border-color:#ff1744;
  box-shadow:0 0 0 1px rgba(255,23,68,.25)
}

.stat strong{
  display:block;
  font-size:20px
}

.stat span{
  font-size:12px;
  color:#999
}

/* ACTIONS */

.actions{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap
}

.action{
  border:0;
  border-radius:999px;
  padding:11px 22px;
  font-weight:800;
  cursor:pointer
}

.monetize{
  background:#ffd54a;
  color:#111;
  padding:13px 28px;
  font-size:15px;
  border:2px solid #fff;
  box-shadow:0 6px 22px rgba(255,213,74,.35);
  transform:scale(1.04);
}

.monetize:hover{
  background:#ffe27a;
  transform:scale(1.07) translateY(-1px);
}

.share{
  background:#1683ff;
  color:#fff
}

.edit{
  background:#222;
  color:#fff;
  border:1px solid #444
}

/* SETTINGS BUTTON */

.settings{
  background:#333;
  color:#fff;
  border:1px solid #555
}

.settings:hover{
  background:#444;
  border-color:#777
}

.logout{
  background:#ff1744;
  color:#fff;
  box-shadow:0 5px 18px rgba(255,23,68,.25)
}

.logout:hover{
  background:#ff3159
}

/* BOTTOM TAB AREA */

.tab-panel{
  display:none;
  padding:20px 10px 30px;
  max-width:950px;
  margin:0 auto
}

.tab-panel.active{
  display:block
}

.tab-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
  padding:0 4px
}

.tab-title h2{
  font-size:20px
}

.tab-close{
  border:0;
  background:#222;
  color:#aaa;
  border-radius:8px;
  padding:7px 11px;
  cursor:pointer
}

/* USERS */

.user-list{
  display:flex;
  flex-direction:column;
  gap:8px
}

.user-row{
  display:flex;
  align-items:center;
  gap:12px;
  background:#151515;
  border:1px solid #292929;
  padding:10px 12px;
  border-radius:13px
}

.user-row img{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:#222
}

.user-info{
  flex:1;
  min-width:0
}

.user-name{
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.user-handle{
  color:#888;
  font-size:13px;
  margin-top:2px
}

/* VIDEO GRIDS */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  max-width:900px;
  margin:auto
}

.card{
  position:relative;
  background:#111;
  aspect-ratio:9/14;
  overflow:hidden;
  cursor:pointer
}

.card video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  background:#000;
  pointer-events:none
}

.overlay{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:28px 7px 7px;
  background:linear-gradient(transparent,rgba(0,0,0,.8));
  font-size:12px;
  font-weight:700
}

.empty{
  text-align:center;
  color:#777;
  padding:45px 10px;
  grid-column:1/-1
}

.loading{
  text-align:center;
  color:#888;
  padding:35px 10px;
  grid-column:1/-1
}

.error{
  text-align:center;
  color:#ff6b6b;
  padding:30px 10px;
  grid-column:1/-1
}

@media(min-width:700px){

  .grid{
    grid-template-columns:repeat(4,1fr);
    gap:8px
  }

  .section{
    padding:25px
  }

  .card{
    border-radius:8px
  }

}
</style>

</head>

<script type="module">

import {
  createClient
} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';


/* =========================================================
   SUPABASE
========================================================= */

const supabase =
  createClient(
    'https://vfteiggdhthvrrlndtbs.supabase.co',
    'sb_publishable_7LUjk7PBJeCy-_ZdrEqDzA_sGUruHRe',
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true,
        flowType:'pkce'
      }
    }
  );


let currentUser =
  null;

let myVideos =
  [];


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(v){

  return String(v ?? '')
    .replace(
      /[&<>"']/g,
      c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c])
    );

}


/* =========================================================
   INIT
========================================================= */

async function init(){

  try{

    const params =
      new URLSearchParams(
        location.search
      );

    const code =
      params.get('code');


    if(code){

      const {
        error:exchangeError
      } =
        await supabase.auth
          .exchangeCodeForSession(code);


      if(exchangeError){

        console.error(
          'AUTH CODE EXCHANGE FAILED:',
          exchangeError
        );

        location.href =
          'signup.html';

        return;

      }


      history.replaceState(
        {},
        document.title,
        location.pathname +
        location.hash
      );

    }


    const {
      data:{
        session
      },
      error
    } =
      await supabase.auth
        .getSession();


    if(
      error ||
      !session?.user
    ){

      location.href =
        'signup.html';

      return;

    }


    currentUser =
      session.user;


    /* =====================================================
       BUTTONS
    ===================================================== */

    document.getElementById(
      'editBtn'
    ).onclick = () => {

      location.href =
        'edit_profile.html';

    };


    document.getElementById(
      'settingsBtn'
    ).onclick = () => {

      location.href =
        'settings.html';

    };


    document.getElementById(
      'monetizeBtn'
    ).onclick = () => {

      location.href =
        'monetize.html';

    };


    document.getElementById(
      'shareBtn'
    ).onclick = async () => {

      if(navigator.share){

        try{

          await navigator.share({
            title:'My BIGULA Profile',
            url:location.href
          });

        }catch(e){}

      }else if(
        navigator.clipboard
      ){

        await navigator.clipboard
          .writeText(location.href);

        alert(
          'Profile link copied'
        );

      }

    };


    document.getElementById(
      'logoutBtn'
    ).onclick =
      logout;


    /* =====================================================
       STAT BUTTONS
    ===================================================== */

    document.getElementById(
      'followersStat'
    ).onclick = () => {

      openTab('followers');

    };


    document.getElementById(
      'followingStat'
    ).onclick = () => {

      openTab('following');

    };


    document.getElementById(
      'videosStat'
    ).onclick = () => {

      openTab('videos');

    };


    document.getElementById(
      'likesStat'
    ).onclick = () => {

      openTab('likes');

    };


    await loadAccount();


  }catch(err){

    console.error(
      'ACCOUNT INIT ERROR:',
      err
    );

    alert(
      'Unable to load your account.'
    );

  }

}


/* =========================================================
   LOAD ACCOUNT
========================================================= */

async function loadAccount(){

  const {
    data:user,
    error:userError
  } =
    await supabase
      .from('users')
      .select('*')
      .eq('id',currentUser.id)
      .maybeSingle();


  if(userError){

    console.error(
      'USER LOAD ERROR:',
      userError
    );

  }


  if(user){

    document.getElementById(
      'name'
    ).textContent =
      user.name ||
      user.full_name ||
      user.display_name ||
      user.username ||
      'BIGULA User';


    document.getElementById(
      'handle'
    ).textContent =
      user.username
        ? '@'+user.username
        : '';


    document.getElementById(
      'bio'
    ).textContent =
      user.bio ||
      'No bio yet';


    const avatar =
      user.avatar_url ||
      user.photo_url ||
      user.profile_photo ||
      user.avatar;


    if(avatar){

      document.getElementById(
        'avatar'
      ).src =
        avatar;

    }


    localStorage.setItem(
      'bigula_user',
      JSON.stringify(user)
    );

  }


  /* =====================================================
     COUNTS + VIDEOS
  ===================================================== */

  const [
    followersResult,
    followingResult,
    videosResult
  ] =
    await Promise.all([

      supabase
        .from('followers')
        .select(
          'id',
          {
            head:true,
            count:'exact'
          }
        )
        .eq(
          'following_id',
          currentUser.id
        ),

      supabase
        .from('followers')
        .select(
          'id',
          {
            head:true,
            count:'exact'
          }
        )
        .eq(
          'follower_id',
          currentUser.id
        ),

      supabase
        .from('videos')
        .select('*')
        .eq(
          'user_id',
          currentUser.id
        )
        .order(
          'created_at',
          {
            ascending:false
          }
        )

    ]);


  document.getElementById(
    'followers'
  ).textContent =
    followersResult.count || 0;


  document.getElementById(
    'following'
  ).textContent =
    followingResult.count || 0;


  if(videosResult.error){

    console.error(
      'VIDEOS LOAD ERROR:',
      videosResult.error
    );

    myVideos=[];

  }else{

    myVideos =
      videosResult.data || [];

  }


  document.getElementById(
    'videos'
  ).textContent =
    myVideos.length;


  await calculateTotalLikes();

}


/* =========================================================
   TOTAL LIKES
========================================================= */

async function calculateTotalLikes(){

  if(!myVideos.length){

    document.getElementById(
      'likes'
    ).textContent =
      '0';

    return;

  }


  let totalLikes =
    0;


  for(
    const video of myVideos
  ){

    const {
      count,
      error
    } =
      await supabase
        .from('likes')
        .select(
          'id',
          {
            head:true,
            count:'exact'
          }
        )
        .eq(
          'video_id',
          video.id
        );


    if(!error){

      totalLikes +=
        count || 0;

    }

  }


  document.getElementById(
    'likes'
  ).textContent =
    totalLikes;

}


/* =========================================================
   OPEN TAB
========================================================= */

async function openTab(tab){

  closeTabs(false);


  const panel =
    document.getElementById(
      tab+'Panel'
    );


  if(!panel) return;


  panel.classList.add(
    'active'
  );


  const button =
    document.getElementById(
      tab+'Stat'
    );


  if(button){

    button.classList.add(
      'active'
    );

  }


  if(tab === 'followers')
    await loadFollowers();

  if(tab === 'following')
    await loadFollowing();

  if(tab === 'videos')
    await loadMyVideos();

  if(tab === 'likes')
    await loadLikedVideos();


  panel.scrollIntoView({
    behavior:'smooth',
    block:'start'
  });

}


/* =========================================================
   CLOSE TABS
========================================================= */

function closeTabs(){

  document
    .querySelectorAll('.tab-panel')
    .forEach(panel => {

      panel.classList.remove(
        'active'
      );

    });


  document
    .querySelectorAll('.stat')
    .forEach(button => {

      button.classList.remove(
        'active'
      );

    });

}


/* =========================================================
   FOLLOWERS
========================================================= */

async function loadFollowers(){

  const list =
    document.getElementById(
      'followersList'
    );


  list.innerHTML =
    '<div class="loading">Loading followers...</div>';


  const {
    data:relations,
    error
  } =
    await supabase
      .from('followers')
      .select('follower_id')
      .eq(
        'following_id',
        currentUser.id
      );


  if(error){

    console.error(
      'FOLLOWERS ERROR:',
      error
    );

    list.innerHTML =
      '<div class="empty">Unable to load followers.</div>';

    return;

  }


  if(!relations?.length){

    list.innerHTML =
      '<div class="empty">You have no followers yet.</div>';

    return;

  }


  const ids =
    relations
      .map(
        row =>
          row.follower_id
      )
      .filter(Boolean);


  const {
    data:users,
    error:userError
  } =
    await supabase
      .from('users')
      .select(
        'id,username,name,avatar_url,bio'
      )
      .in(
        'id',
        ids
      );


  if(userError){

    console.error(
      'FOLLOWER USERS ERROR:',
      userError
    );

    list.innerHTML =
      '<div class="error">Unable to load follower profiles.</div>';

    return;

  }


  renderUsers(
    users || [],
    list
  );

}


/* =========================================================
   FOLLOWING
========================================================= */

async function loadFollowing(){

  const list =
    document.getElementById(
      'followingList'
    );


  list.innerHTML =
    '<div class="loading">Loading following...</div>';


  const {
    data:relations,
    error
  } =
    await supabase
      .from('followers')
      .select('following_id')
      .eq(
        'follower_id',
        currentUser.id
      );


  if(error){

    console.error(
      'FOLLOWING ERROR:',
      error
    );

    list.innerHTML =
      '<div class="empty">Unable to load following.</div>';

    return;

  }


  if(!relations?.length){

    list.innerHTML =
      '<div class="empty">You are not following anyone yet.</div>';

    return;

  }


  const ids =
    relations
      .map(
        row =>
          row.following_id
      )
      .filter(Boolean);


  const {
    data:users,
    error:userError
  } =
    await supabase
      .from('users')
      .select(
        'id,username,name,avatar_url,bio'
      )
      .in(
        'id',
        ids
      );


  if(userError){

    console.error(
      'FOLLOWING USERS ERROR:',
      userError
    );

    list.innerHTML =
      '<div class="error">Unable to load following profiles.</div>';

    return;

  }


  renderUsers(
    users || [],
    list
  );

}


/* =========================================================
   RENDER USERS
========================================================= */

function renderUsers(
  users,
  list
){

  list.innerHTML='';


  if(!users.length){

    list.innerHTML =
      '<div class="empty">No users found.</div>';

    return;

  }


  users.forEach(
    user => {

      const row =
        document.createElement(
          'div'
        );


      row.className =
        'user-row';


      const avatar =
        user.avatar_url ||
        'https://placehold.co/100x100';


      const displayName =
        user.name ||
        user.username ||
        'BIGULA User';


      row.innerHTML = `

        <img
          src="${esc(avatar)}"
          alt=""
        >

        <div class="user-info">

          <div class="user-name">
            ${esc(displayName)}
          </div>

          <div class="user-handle">
            ${
              user.username
                ? '@'+esc(user.username)
                : ''
            }
          </div>

        </div>

      `;


      row.style.cursor =
        'pointer';


      row.addEventListener(
        'click',
        () => {

          location.href =
            'creator_profile.html?id=' +
            encodeURIComponent(
              user.id
            );

        }
      );


      list.appendChild(
        row
      );

    }
  );

}


/* =========================================================
   MY VIDEOS
========================================================= */

async function loadMyVideos(){

  const grid =
    document.getElementById(
      'videoGrid'
    );


  grid.innerHTML =
    '<div class="loading">Loading your videos...</div>';


  const {
    data:videos,
    error
  } =
    await supabase
      .from('videos')
      .select('*')
      .eq(
        'user_id',
        currentUser.id
      )
      .order(
        'created_at',
        {
          ascending:false
        }
      );


  if(error){

    console.error(
      'MY VIDEOS ERROR:',
      error
    );

    grid.innerHTML =
      '<div class="error">Unable to load your videos: ' +
      esc(error.message || 'Database error') +
      '</div>';

    return;

  }


  myVideos =
    videos || [];


  document.getElementById(
    'videos'
  ).textContent =
    myVideos.length;


  await renderVideos(
    myVideos,
    'videoGrid'
  );

}


/* =========================================================
   VIDEO URL
========================================================= */

function getVideoUrl(video){

  if(
    video.video_url
  )
    return video.video_url;

  if(
    video.url
  )
    return video.url;

  if(
    video.file_url
  )
    return video.file_url;

  if(
    video.public_url
  )
    return video.public_url;

  if(
    video.storage_path
  ){

    return (
      'https://vfteiggdhthvrrlndtbs.supabase.co' +
      '/storage/v1/object/public/bigula/' +
      String(
        video.storage_path
      ).replace(/^\/+/,'')
    );

  }

  return '';

}


/* =========================================================
   RENDER VIDEOS
========================================================= */

async function renderVideos(
  videos,
  targetId
){

  const grid =
    document.getElementById(
      targetId
    );


  grid.innerHTML='';


  if(!videos.length){

    grid.innerHTML =
      '<div class="empty">You have not uploaded any videos yet.</div>';

    return;

  }


  for(
    const v of videos
  ){

    const {
      count:likes
    } =
      await supabase
        .from('likes')
        .select(
          'id',
          {
            head:true,
            count:'exact'
          }
        )
        .eq(
          'video_id',
          v.id
        );


    const card =
      document.createElement(
        'div'
      );


    card.className =
      'card';


    const videoUrl =
      getVideoUrl(v);


    card.innerHTML = `

      <video
        src="${esc(videoUrl)}"
        preload="metadata"
        playsinline>
      </video>

      <div class="overlay">

        ${esc(
          v.title ||
          'Untitled video'
        )}

        · ❤️ ${likes || 0}

      </div>

    `;


    /*
      Clicking your own video opens Edit Video.
    */

    card.addEventListener(
      'click',
      () => {

        location.href =
          'edit_video.html?id=' +
          encodeURIComponent(
            v.id
          );

      }
    );


    grid.appendChild(
      card
    );

  }

}


/* =========================================================
   LIKED VIDEOS
========================================================= */

async function loadLikedVideos(){

  const grid =
    document.getElementById(
      'likesGrid'
    );


  grid.innerHTML =
    '<div class="loading">Loading liked videos...</div>';


  const {
    data:likes,
    error
  } =
    await supabase
      .from('likes')
      .select(
        'video_id,created_at'
      )
      .eq(
        'user_id',
        currentUser.id
      )
      .order(
        'created_at',
        {
          ascending:false
        }
      );


  if(error){

    console.error(
      'LIKED VIDEOS ERROR:',
      error
    );

    grid.innerHTML =
      '<div class="error">Unable to load liked videos.</div>';

    return;

  }


  if(!likes?.length){

    grid.innerHTML =
      '<div class="empty">You have not liked any videos yet.</div>';

    return;

  }


  const ids =
    likes
      .map(
        row =>
          row.video_id
      )
      .filter(Boolean);


  const {
    data:videos,
    error:videoError
  } =
    await supabase
      .from('videos')
      .select('*')
      .in(
        'id',
        ids
      );


  if(videoError){

    console.error(
      'LIKED VIDEO LOAD ERROR:',
      videoError
    );

    grid.innerHTML =
      '<div class="error">Unable to load liked videos.</div>';

    return;

  }


  const videoMap =
    new Map(
      (videos || [])
        .map(
          video => [
            String(video.id),
            video
          ]
        )
    );


  const orderedVideos =
    ids
      .map(
        id =>
          videoMap.get(
            String(id)
          )
      )
      .filter(Boolean);


  await renderLikedVideos(
    orderedVideos,
    grid
  );

}

/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  const confirmed =
    confirm(
      'Are you sure you want to log out of BIGULA?'
    );


  if(!confirmed)
    return;


  try{

    const {
      error
    } =
      await supabase.auth.signOut();


    if(error){

      console.error(
        'LOGOUT ERROR:',
        error
      );

      alert(
        'Unable to log out. Please try again.'
      );

      return;

    }


    localStorage.removeItem(
      'bigula_user'
    );


    location.replace(
      'home.html'
    );


  }catch(err){

    console.error(
      'LOGOUT FAILED:',
      err
    );

    alert(
      'Logout failed. Please try again.'
    );

  }

}
