<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIGULA – Home</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  background:#000;
  color:#fff;
  overflow-y:auto;
}

/* TOPBAR */

.topbar{
  position:fixed;
  top:0;
  width:100%;
  min-height:100px;
  background:linear-gradient(to bottom,#000 80%,transparent);
  z-index:20;
  padding:10px 15px;
  display:flex;
  flex-direction:column;
  transition:top .3s;
}

.logo{
  font-size:32px;
  font-weight:900;
  letter-spacing:4px;
  color:#ff0000;
  text-shadow:0 0 20px rgba(255,0,0,.8);
}

.welcome-user{
  margin-top:2px;
  font-size:16px;
  font-weight:800;
  color:#fff;
  opacity:.95;
}
.creator-line{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.creator-name{
  background:none;
  border:0;
  color:#fff;
  font-weight:900;
  font-size:22px;
  padding:0;
  cursor:pointer;
  text-align:left;
}
.action-row{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.comment-item{
  padding:12px 0;
  border-bottom:1px solid #222;
}
.comment-body{line-height:1.45}
.comment-actions{display:flex;gap:8px;margin-top:7px}
.comment-actions button{
  background:#222;color:#fff;border:0;border-radius:18px;padding:6px 10px;cursor:pointer;font-weight:700;
}
.stat-btn.active-like{background:rgba(255,0,0,.2)}

.top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:5px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  justify-content:flex-end;
}

.btn{
  padding:8px 16px;
  border-radius:25px;
  border:none;
  font-weight:800;
  cursor:pointer;
  transition:.3s;
  font-size:14px;
  min-width:80px;
  white-space:nowrap;
}

.btn:hover{
  transform:scale(1.04);
}

.login-btn{
  background:#fff;
  color:#000;
}

.upload-btn{
  background:#007BFF;
  color:#fff;
}

.upload-btn.disabled{
  opacity:.4;
  cursor:not-allowed;
}

#installBtn{
  background:#00cc00;
  color:#000;
}

.search{
  font-size:42px;
  cursor:pointer;
  color:#ff0000;
}

/* SEARCH */

.search-bar{
  position:fixed;
  top:140px;
  width:100%;
  background:#111;
  padding:10px 15px;
  display:none;
  z-index:19;
  border-bottom:1px solid #222;
}

.search-bar input{
  width:100%;
  padding:12px;
  border-radius:40px;
  border:1px solid #333;
  background:#000;
  color:#fff;
  font-size:16px;
}

/* TABS */

.tabs{
  display:flex;
  gap:20px;
  margin-top:10px;
}

.tab{
  cursor:pointer;
  font-weight:700;
  opacity:.6;
  transition:.3s;
  font-size:16px;
}

.tab.active{
  opacity:1;
  color:#ff0000;
  border-bottom:2px solid #ff0000;
  padding-bottom:2px;
}

/* FEED */

.feed{
  margin-top:180px;
  margin-bottom:90px;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  gap:20px;
}

.video-card{
  width:95%;
  max-width:800px;
  background:#111;
  border-radius:18px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  scroll-snap-align:start;
  position:relative;
  border:1px solid #222;
}
.gold-badge{
  margin-left:6px;
  font-size:14px;
  color:#ffd700;
  text-shadow:0 0 6px rgba(255,215,0,0.6);
  vertical-align:middle;
}

video{
  width:100%;
  height:auto;
  max-height:500px;
  object-fit:cover;
  display:block;
  background:#000;
}

/* META */

.meta-overlay{
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  background:rgba(0,0,0,.75);
}

.user-row{
  display:flex;
  flex-direction:column;
  padding:6px 2px;
  align-items:flex-start;
  gap:8px;
  flex-wrap:wrap;
}

.username{
  font-weight:900;
  font-size:30px;
  cursor:pointer;
  color:pink; /* TikTok-like pink/red accent */
  letter-spacing:0.5px;
  text-shadow:0 2px 10px rgba(255,45,85,0.4);
}

.follow-btn,
.share-btn{
  background:#111;
  color:#fff;
  padding:7px 12px;
  border-radius:20px;
  border:none;
  font-size:13px;
  cursor:pointer;
  font-weight:800;
  margin-left:5px;
  transition:.25s;
}

.view-count{
  color:#00c6ff;
  font-weight:900;
  margin-left:4px;
}
.follow-btn:hover,
.share-btn:hover{
  transform:scale(1.05);
}
.follow-btn{
  background:linear-gradient(45deg,#ff0000,blue);
  border:none;
  font-weight:900;
}
.follow-btn{
  transition:all .25s;
}

.follow-btn.following{
  background:#222;
  color:#aaa;
  border:1px solid #444;
}
.share-btn{
  background:linear-gradient(45deg,#ff0000,green);
  border:none;
  font-weight:900;
}
.title{
  font-size:16px;
  font-weight:700;
  color:#fff;
}

.stats{
  display:flex;
  gap:10px;
  margin-top:5px;
}

.stat-btn{
  display:flex;
  align-items:center;
  gap:6px;
  background:rgba(255,255,255,.08);
  padding:8px 14px;
  border-radius:999px;
  cursor:pointer;
  font-weight:700;
  font-size:14px;
  transition:.25s;
}

.stat-btn:hover{
  transform:scale(1.05);
}

/* SHARE */

.share-options{
  display:none;
  position:absolute;
  bottom:60px;
  right:10px;
  background:#111;
  padding:10px;
  border-radius:12px;
  flex-direction:column;
  gap:8px;
  border:1px solid #222;
}

.share-options button{
  background:#222;
  color:#fff;
  padding:8px 12px;
  border-radius:10px;
  border:none;
  cursor:pointer;
}

/* COMMENTS */

.comment-modal{
  position:fixed;
  bottom:0;
  width:100%;
  height:60%;
  background:#111;
  display:none;
  flex-direction:column;
  border-top:3px solid #ff0000;
  z-index:50;
}

.close-comments{
  background:#ff0000;
  border:none;
  color:#fff;
  padding:12px;
  font-weight:800;
  cursor:pointer;
}

.comment-list{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.comment-input{
  display:flex;
  border-top:1px solid #333;
}

.comment-input input{
  flex:1;
  padding:14px;
  background:#000;
  border:none;
  color:#fff;
  font-size:16px;
}

.following{
  background:#222 !important;
  color:#aaa !important;
  border:1px solid #444;
}
.comment-input button{
  background:#ff0000;
  border:none;
  padding:14px 22px;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

/* FOOTER */

.footer{
  position:fixed;
  bottom:0;
  width:100%;
  height:75px;
  background:#000;
  border-top:1px solid #222;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

.footer-btn{
  font-size:28px;
  cursor:pointer;
  transition:.25s;
}

.footer-btn:hover:not(.disabled){
  transform:scale(1.08);
  color:#ff0000;
}

.footer-btn.disabled{
  opacity:.3;
  pointer-events:none;
}


/* SIGN-IN MODAL */
.signin-modal{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:20px;z-index:10000}
.signin-card{width:100%;max-width:390px;background:#111;border:1px solid #2b2b2b;border-radius:20px;padding:26px 22px;box-shadow:0 20px 70px rgba(0,0,0,.65);text-align:center}
.signin-card h2{margin:0 0 8px;font-size:22px}
.signin-card p{margin:0;color:#aaa;line-height:1.5;font-size:14px}
.signin-actions{display:flex;gap:10px;margin-top:20px}
.signin-actions button{flex:1;padding:12px;border:0;border-radius:12px;font-weight:800;cursor:pointer}
.signin-cancel{background:#252525;color:#fff}
.signin-go{background:#fff;color:#111}

/* TOAST */

#toast{
  position:fixed;
  bottom:95px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:#111;
  color:#fff;
  padding:12px 24px;
  border-radius:40px;
  font-size:14px;
  font-weight:700;
  z-index:9999;
  opacity:0;
  transition:.35s ease;
  border:1px solid #333;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

</style>
</head>

<body>

<div class="topbar" id="topbar">

  <div class="top-row">

    <div class="logo">BIGULA</div>
    <div id="welcomeUser" class="welcome-user">Welcome to BIGULA</div>

    <div class="actions">
      <div class="search">🔍</div>

      <button class="btn upload-btn disabled">
        Upload
      </button>

      <button class="btn" id="installBtn">
        Install App
      </button>
    </div>

  </div>

  <div class="tabs">
    <div class="tab active" data-feed="foryou">For You</div>
    <div class="tab" data-feed="latest">Latest</div>
    <div class="tab" data-feed="viral">Viral</div>
  </div>

</div>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="Search videos or creators...">
</div>

<div class="feed" id="feed"></div>

<div class="comment-modal" id="commentModal">

  <button class="close-comments" id="closeComments">
    Close
  </button>

  <div class="comment-list" id="commentList"></div>

  <div class="comment-input">
    <input type="text" id="commentText" placeholder="Write a comment...">
    <button id="postCommentBtn">Post</button>
  </div>

</div>


<div class="signin-modal" id="signinModal" role="dialog" aria-modal="true" aria-labelledby="signinTitle">
  <div class="signin-card">
    <h2 id="signinTitle">Sign in to BIGULA</h2>
    <p id="signinMessage">Sign in to continue.</p>
    <div class="signin-actions">
      <button class="signin-cancel" id="signinCancel" type="button">Not now</button>
      <button class="signin-go" id="signinGo" type="button">Continue with Google</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<div class="footer">

  <div class="footer-btn" onclick="location.href='home.html'">
    🏠
  </div>

  <div id="notifBtn" class="footer-btn disabled">
    🔔
  </div>

  <div id="accountBtn" class="footer-btn disabled">
    👤
  </div>

</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const SUPABASE_URL = "https://vfteiggdhthvrrlndtbs.supabase.co"
const SUPABASE_KEY = "sb_publishable_7LUjk7PBJeCy-_ZdrEqDzA_sGUruHRe"
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}
})

let currentUser = null
let currentProfile = null
let currentVideoId = null
let currentCommentId = null
const profileCache = new Map()

function showToast(message){
  const toast=document.getElementById('toast')
  toast.textContent=message
  toast.classList.add('show')
  clearTimeout(toast.timer)
  toast.timer=setTimeout(()=>toast.classList.remove('show'),2600)
}

function requireSignIn(action){
  if(currentUser) return true
  const modal=document.getElementById('signinModal')
  const message=document.getElementById('signinMessage')
  if(message) message.textContent=`Please sign in to ${action}. You can keep watching BIGULA without signing in.`
  if(modal) modal.style.display='flex'
  return false
}

function closeSignInModal(){
  const modal=document.getElementById('signinModal')
  if(modal) modal.style.display='none'
}

document.getElementById('signinCancel').onclick=closeSignInModal
document.getElementById('signinModal').addEventListener('click',e=>{
  if(e.target.id==='signinModal') closeSignInModal()
})
document.getElementById('signinGo').onclick=()=>{
  location.href='signup.html'
}


function escapeHtml(value=''){
  return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))
}

function getGoogleName(user){
  const m=user?.user_metadata || {}
  return m.name || m.full_name || m.display_name ||
         [m.given_name,m.family_name].filter(Boolean).join(' ') || null
}

function getUserName(profile,user){
  return profile?.name || profile?.full_name || profile?.display_name ||
         profile?.username || profile?.user_name || getGoogleName(user) ||
         (user?.email ? user.email.split('@')[0] : null) || 'BIGULA creator'
}

async function loadProfile(uid){
  if(!uid) return null
  if(profileCache.has(uid)) return profileCache.get(uid)
  const {data,error}=await supabase.from('users').select('*').eq('id',uid).maybeSingle()
  if(!error && data) profileCache.set(uid,data)
  return data || null
}

async function syncGoogleProfile(user){
  if(!user?.id) return null
  const metadata=user.user_metadata || {}
  const googleName=getGoogleName(user)
  const avatar=metadata.avatar_url || metadata.picture || null
  const fallbackUsername=`user_${user.id.slice(0,8)}`
  const payload={
    id:user.id,
    name:googleName || fallbackUsername,
    username:googleName || fallbackUsername
  }
  if(avatar) payload.avatar_url=avatar

  const {data,error}=await supabase.from('users').upsert(payload,{onConflict:'id'}).select('*').single()
  if(error){
    console.warn('Could not sync Google profile:',error.message)
    return loadProfile(user.id)
  }
  profileCache.set(user.id,data)
  localStorage.setItem('bigula_profile',JSON.stringify(data))
  localStorage.setItem('bigula_user_name',data.name || googleName || fallbackUsername)
  return data
}

async function initUser(){
  let {data:{session}}=await supabase.auth.getSession()
  if(!session && new URLSearchParams(location.search).has('code')){
    const {data,error}=await supabase.auth.exchangeCodeForSession(new URLSearchParams(location.search).get('code'))
    if(!error) session=data?.session || null
    history.replaceState({},document.title,location.pathname)
  }

  currentUser=session?.user || null

  if(currentUser){
    currentProfile=await syncGoogleProfile(currentUser)
  }

  const uploadBtn=document.querySelector('.upload-btn')
  const accountBtn=document.getElementById('accountBtn')
  const notifBtn=document.getElementById('notifBtn')
  const loginBtn=document.querySelector('.login-btn')

  if(currentUser){
    currentProfile=currentProfile || await loadProfile(currentUser.id)
    const name=getUserName(currentProfile,currentUser)
    localStorage.setItem('bigula_profile',JSON.stringify(currentProfile || {id:currentUser.id,name}))
    const welcome=document.getElementById('welcomeUser')
    if(welcome) welcome.textContent=`Welcome back, ${name}`

    uploadBtn.classList.remove('disabled')
    uploadBtn.onclick=()=>location.href='upload.html'
    accountBtn.classList.remove('disabled')
    notifBtn.classList.remove('disabled')
    accountBtn.onclick=()=>location.href='account.html'
    notifBtn.onclick=()=>location.href='notifications.html'
    if(loginBtn) loginBtn.style.display='none'
  }else{
    const welcome=document.getElementById('welcomeUser')
    if(welcome) welcome.textContent='Welcome to BIGULA'
    uploadBtn.classList.remove('disabled')
    uploadBtn.onclick=()=>requireSignIn('upload a video')
    accountBtn.classList.remove('disabled')
    notifBtn.classList.remove('disabled')
    accountBtn.onclick=()=>requireSignIn('open your account')
    notifBtn.onclick=()=>requireSignIn('open your notifications')
    if(loginBtn) loginBtn.style.display='none'
  }
}

async function getCounts(videoId){
  const [l,c,v]=await Promise.all([
    supabase.from('likes').select('*',{head:true,count:'exact'}).eq('video_id',videoId),
    supabase.from('comments').select('*',{head:true,count:'exact'}).eq('video_id',videoId),
    supabase.from('views').select('*',{head:true,count:'exact'}).eq('video_id',videoId)
  ])
  return {likes:l.count||0,comments:c.count||0,views:v.count||0}
}

async function isFollowing(uid){
  if(!currentUser || !uid) return false
  const {data}=await supabase.from('followers').select('follower_id').eq('follower_id',currentUser.id).eq('following_id',uid).maybeSingle()
  return !!data
}

async function isLiked(videoId){
  if(!currentUser) return false
  const {data}=await supabase.from('likes').select('video_id').eq('video_id',videoId).eq('user_id',currentUser.id).maybeSingle()
  return !!data
}

async function fetchVideos(type='foryou'){
  let query=supabase.from('videos').select('*')
  if(type==='latest') query=query.order('created_at',{ascending:false})
  if(type==='viral') query=query.order('views',{ascending:false})
  const {data,error}=await query
  if(error){console.error('Video fetch error:',error);return}
  await renderVideos(data||[])
}

async function renderVideos(videos){
  const feed=document.getElementById('feed')
  feed.innerHTML=''
  if(!videos.length){feed.innerHTML='<div style="padding:40px;text-align:center;opacity:.7">No videos yet.</div>';return}

  for(const video of videos){
    const creatorId=String(video.user_id || video.creator_id || video.owner_id || '')
    const creatorProfile=await loadProfile(creatorId)
    const creatorName=getUserName(creatorProfile,null)
    const counts=await getCounts(video.id)
    const following=await isFollowing(creatorId)
    const liked=await isLiked(video.id)

    const card=document.createElement('div')
    card.className='video-card'
    card.dataset.id=video.id
    card.dataset.creatorId=creatorId
    card.innerHTML=`
      <video src="${escapeHtml(video.video_url||'')}" autoplay playsinline></video>
      <div class="meta-overlay">
        <div class="user-row">
          <div class="creator-line">
            <button class="creator-name" type="button">${escapeHtml(creatorName)}</button>
            <button class="follow-btn ${following?'following':''}" type="button">${following?'Following':'Follow'}</button>
          </div>
          <div class="action-row">
            <button class="views-btn" type="button">Views <span class="view-count">${counts.views}</span></button>
            <button class="share-btn" type="button">Share</button>
            <div class="share-options">
              <button class="status-share" type="button">Bigula Status</button>
              <button class="wa-share" type="button">WhatsApp</button>
            </div>
          </div>
        </div>
        <div class="title">${escapeHtml(video.title||'')}</div>
        <div class="stats">
          <button class="stat-btn like-btn ${liked?'active-like':''}" type="button">❤️ <span>${counts.likes}</span></button>
          <button class="stat-btn comment-btn" type="button">💬 <span>${counts.comments}</span></button>
        </div>
      </div>`

    feed.appendChild(card)
    bindCardActions(card,video,creatorName)
    setupVideoAutoScroll(card)
  }
  setupAutoplay()
}

function bindCardActions(card,video,creatorName){
  const creatorId=card.dataset.creatorId
  card.querySelector('.creator-name').onclick=()=>openProfile(creatorId)
  card.querySelector('.follow-btn').onclick=()=>followUser(creatorId,card.querySelector('.follow-btn'))
  card.querySelector('.like-btn').onclick=()=>toggleLike(video.id,card.querySelector('.like-btn'))
  card.querySelector('.comment-btn').onclick=()=>openComments(video.id)
  card.querySelector('.share-btn').onclick=e=>toggleShare(e.currentTarget)
  card.querySelector('.status-share').onclick=()=>showToast('Status sharing is coming soon.')
  card.querySelector('.wa-share').onclick=()=>shareWhatsApp(video.video_url,creatorName)
}

function setupAutoplay(){
  const vids=document.querySelectorAll('.video-card video')
  const topbar=document.getElementById('topbar')
  const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{
    const video=entry.target
    if(entry.isIntersecting){
      vids.forEach(v=>{if(v!==video)v.pause()})
      video.volume=1
      video.play().catch(()=>{})
      topbar.style.top='-120px'
    }else{video.pause();topbar.style.top='0'}
  }),{threshold:.75})
  vids.forEach(v=>observer.observe(v))
}

function setupVideoAutoScroll(card){
  const video=card.querySelector('video')
  video.addEventListener('ended',()=>card.nextElementSibling?.scrollIntoView({behavior:'smooth',block:'center'}))
}

function toggleShare(btn){
  document.querySelectorAll('.share-options').forEach(el=>{if(el!==btn.nextElementSibling)el.style.display='none'})
  const options=btn.nextElementSibling
  options.style.display=options.style.display==='flex'?'none':'flex'
}

function shareWhatsApp(url,name){
  window.open(`https://wa.me/?text=${encodeURIComponent(`Watch this BIGULA video created by ${name}: ${url}`)}`,'_blank')
}

function openProfile(uid){
  if(!uid || uid==='undefined' || uid==='null') return showToast('Creator profile is unavailable.')
  location.href=`creator-profile.html?uid=${encodeURIComponent(uid)}`
}

async function toggleLike(videoId,btn){
  if(!requireSignIn('like this video')) return
  const countEl=btn.querySelector('span')
  const old=Number(countEl.textContent)||0
  btn.disabled=true
  try{
    const {data:existing,error:checkError}=await supabase.from('likes').select('video_id').eq('video_id',videoId).eq('user_id',currentUser.id).maybeSingle()
    if(checkError) throw checkError
    if(existing){
      const {error}=await supabase.from('likes').delete().eq('video_id',videoId).eq('user_id',currentUser.id)
      if(error) throw error
      countEl.textContent=Math.max(0,old-1);btn.classList.remove('active-like')
    }else{
      const {error}=await supabase.from('likes').insert({video_id:videoId,user_id:currentUser.id})
      if(error) throw error
      countEl.textContent=old+1;btn.classList.add('active-like')
    }
  }catch(e){console.error('Like error:',e);showToast('Could not update like. Please try again.')}
  finally{btn.disabled=false}
}

async function followUser(uid,btn){
  if(!requireSignIn('follow this creator')) return
  if(!uid || uid===currentUser.id){showToast('You cannot follow yourself.');return}
  btn.disabled=true
  try{
    const {data:existing,error:checkError}=await supabase.from('followers').select('follower_id').eq('follower_id',currentUser.id).eq('following_id',uid).maybeSingle()
    if(checkError) throw checkError
    if(existing){
      const {error}=await supabase.from('followers').delete().eq('follower_id',currentUser.id).eq('following_id',uid)
      if(error) throw error
      btn.textContent='Follow';btn.classList.remove('following');showToast('Unfollowed')
    }else{
      const {error}=await supabase.from('followers').insert({follower_id:currentUser.id,following_id:uid})
      if(error) throw error
      btn.textContent='Following';btn.classList.add('following');showToast('Following')
    }
  }catch(e){console.error('Follow error:',e);showToast('Could not update follow. Check your connection or permissions.')}
  finally{btn.disabled=false}
}

async function openComments(videoId){
  currentVideoId=videoId
  currentCommentId=null
  const modal=document.getElementById('commentModal')
  const list=document.getElementById('commentList')
  list.innerHTML='<div style="opacity:.6;text-align:center;padding:20px">Loading comments…</div>'
  modal.style.display='flex'

  const {data:comments,error}=await supabase.from('comments').select('*').eq('video_id',videoId).order('created_at',{ascending:true})
  if(error){console.error('Comments fetch error:',error);list.innerHTML='<div style="opacity:.7;padding:20px;text-align:center">Comments could not be loaded.</div>';return}
  if(!comments?.length){list.innerHTML='<div style="opacity:.6;text-align:center;padding:25px">No comments yet. Be the first.</div>';return}

  list.innerHTML=''
  for(const c of comments){
    const commenter=await loadProfile(c.user_id)
    const name=getUserName(commenter,null) || c.username || 'BIGULA user'
    const div=document.createElement('div')
    div.className='comment-item'
    div.dataset.commentId=c.id || ''
    div.innerHTML=`<div class="comment-body"><strong>${escapeHtml(name)}</strong><div>${escapeHtml(c.text||'')}</div></div>
      <div class="comment-actions">
        <button class="comment-like" type="button">❤️ ${Number(c.likes_count||c.like_count||0)}</button>
        <button class="comment-reply" type="button">Reply</button>
      </div>`
    div.querySelector('.comment-like').onclick=()=>likeComment(c.id)
    div.querySelector('.comment-reply').onclick=()=>replyToComment(c.id,name)
    list.appendChild(div)
  }
}

function replyToComment(commentId,name){
  if(!requireSignIn('reply to this comment')) return
  currentCommentId=commentId
  const input=document.getElementById('commentText')
  input.value=`@${name} `
  input.focus()
}

async function likeComment(commentId){
  if(!requireSignIn('like this comment')) return
  if(!commentId){showToast('This comment cannot be liked yet.');return}
  showToast('Comment likes will be enabled when comment-like storage is connected.')
}

async function postComment(){
  if(!requireSignIn('add a comment')) return
  if(!currentVideoId)return
  const input=document.getElementById('commentText')
  const text=input.value.trim()
  if(!text)return
  const profileName=getUserName(currentProfile,currentUser)
  const payload={video_id:currentVideoId,user_id:currentUser.id,username:profileName,text}
  if(currentCommentId) payload.parent_id=currentCommentId
  const {error}=await supabase.from('comments').insert(payload)
  if(error){
    // If the existing comments table does not yet have parent_id, retry as a normal comment.
    if(currentCommentId && /parent_id|column/i.test(error.message||'')){
      delete payload.parent_id
      const retry=await supabase.from('comments').insert(payload)
      if(retry.error){console.error(retry.error);showToast('Could not post comment.');return}
    }else{console.error(error);showToast('Could not post comment.');return}
  }
  input.value=''
  currentCommentId=null
  await openComments(currentVideoId)
}

document.getElementById('postCommentBtn').onclick=postComment
document.getElementById('closeComments').onclick=()=>document.getElementById('commentModal').style.display='none'

document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'))
  tab.classList.add('active')
  fetchVideos(tab.dataset.feed)
})

document.querySelector('.search').onclick=()=>document.querySelector('.search-bar').style.display='block'
document.getElementById('searchInput').addEventListener('input',e=>{
  const term=e.target.value.toLowerCase()
  document.querySelectorAll('.video-card').forEach(card=>card.style.display=card.innerText.toLowerCase().includes(term)?'flex':'none')
})

let deferredPrompt=null
const installBtn=document.getElementById('installBtn')
installBtn.style.display='none'
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='inline-block'})
installBtn.onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none'}

// Do NOT make Home dependent on authentication. Everyone can browse/watch.
await initUser()
await fetchVideos()
</script>
