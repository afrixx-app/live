<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>BIGULA — Home</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",Arial,sans-serif;
}

html,
body{
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  overflow:hidden;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

/* =========================================================
   APP
========================================================= */

#app{
  width:100%;
  height:100%;
  position:relative;
  background:#000;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:62px;
  z-index:50;

  display:flex;
  align-items:center;
  gap:10px;

  padding:8px 12px;

  background:rgba(0,0,0,.92);
  backdrop-filter:blur(10px);
}

.logo{
  font-size:23px;
  font-weight:900;
  letter-spacing:-1px;
  flex-shrink:0;
}

.search-wrap{
  flex:1;
  min-width:0;
  position:relative;
}

#search{
  width:100%;
  height:40px;

  border:1px solid #333;
  border-radius:22px;

  background:#171717;
  color:#fff;

  padding:0 16px;

  outline:none;
}

#search::placeholder{
  color:#888;
}

#search:focus{
  border-color:#777;
}

.search-clear{
  position:absolute;
  right:8px;
  top:6px;

  width:28px;
  height:28px;

  border:0;
  border-radius:50%;

  background:#333;
  color:#fff;

  display:none;
}

/* =========================================================
   TABS
========================================================= */

.tabs{
  position:fixed;
  top:62px;
  left:0;
  right:0;

  height:48px;

  z-index:49;

  display:flex;
  align-items:center;

  background:rgba(0,0,0,.94);
  border-bottom:1px solid #222;

  overflow-x:auto;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  height:48px;

  min-width:20%;

  padding:0 15px;

  border:0;
  background:none;

  color:#888;

  font-size:14px;
  font-weight:700;

  white-space:nowrap;
}

.tab.active{
  color:#fff;
  position:relative;
}

.tab.active::after{
  content:"";

  position:absolute;

  left:18px;
  right:18px;
  bottom:0;

  height:3px;

  border-radius:3px;

  background:#fff;
}

/* =========================================================
   FEED
========================================================= */

#feed{
  position:absolute;

  top:110px;
  bottom:62px;

  left:0;
  right:0;

  overflow-y:auto;
  overflow-x:hidden;

  scroll-snap-type:y mandatory;

  scrollbar-width:none;

  background:#000;
}

#feed::-webkit-scrollbar{
  display:none;
}

.feed-card{
  width:100%;
  height:calc(100vh - 172px);

  min-height:420px;

  position:relative;

  scroll-snap-align:start;
  scroll-snap-stop:always;

  background:#000;

  overflow:hidden;
}

.video{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:contain;

  background:#000;
}

/* =========================================================
   VIDEO OVERLAYS
========================================================= */

.video-shade{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:45%;

  pointer-events:none;

  background:linear-gradient(
    transparent,
    rgba(0,0,0,.75)
  );
}

.video-loading{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  font-size:13px;
  color:#aaa;
}

.pause-indicator{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%) scale(.7);

  width:72px;
  height:72px;

  border-radius:50%;

  background:rgba(0,0,0,.65);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:30px;

  opacity:0;
  pointer-events:none;

  transition:.15s;
}

.pause-indicator.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

/* =========================================================
   VIDEO INFO
========================================================= */

.video-info{
  position:absolute;

  left:14px;
  right:76px;
  bottom:16px;

  z-index:5;
}

.creator-line{
  display:flex;
  align-items:center;
  gap:9px;

  margin-bottom:9px;
}

.creator-avatar{
  width:39px;
  height:39px;

  border-radius:50%;

  background:#222;

  overflow:hidden;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:800;
}

.creator-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.creator-name{
  font-size:15px;
  font-weight:800;
}

.creator-badge{
  font-size:10px;
  padding:3px 6px;

  border-radius:7px;

  background:#fff;
  color:#000;

  font-weight:800;
}

.follow-btn{
  border:1px solid rgba(255,255,255,.7);

  background:rgba(0,0,0,.4);
  color:#fff;

  border-radius:8px;

  padding:5px 9px;

  font-size:11px;
  font-weight:800;
}

.follow-btn.following{
  background:#fff;
  color:#000;
}

.video-title{
  font-size:16px;
  font-weight:700;

  line-height:1.35;

  margin-bottom:5px;
}

.video-description{
  font-size:13px;

  line-height:1.35;

  color:#ddd;

  max-height:42px;

  overflow:hidden;
}

/* =========================================================
   SIDE ACTIONS
========================================================= */

.actions{
  position:absolute;

  right:10px;
  bottom:16px;

  z-index:7;

  width:54px;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:14px;
}

.action{
  border:0;
  background:none;
  color:#fff;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;

  text-shadow:0 1px 5px #000;
}

.action-icon{
  width:42px;
  height:42px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.45);

  font-size:21px;
}

.action-count{
  font-size:10px;
  font-weight:700;
}

.like-button.liked .action-icon{
  color:#ff3b5f;
}

.comment-button .action-icon{
  font-size:20px;
}

.share-button .action-icon{
  font-size:19px;
}

/* =========================================================
   DOUBLE TAP HEART
========================================================= */

.double-heart{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%) scale(.3);

  font-size:92px;

  opacity:0;

  pointer-events:none;

  z-index:20;
}

.double-heart.animate{
  animation:heartPop .75s ease forwards;
}

@keyframes heartPop{

  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.3);
  }

  20%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.15);
  }

  60%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }

  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.35);
  }

}

/* =========================================================
   FOOTER
========================================================= */

.footer{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:62px;

  z-index:60;

  background:#090909;
  border-top:1px solid #222;

  display:grid;
  grid-template-columns:repeat(4,1fr);
}

.footer-btn{
  border:0;
  background:none;

  color:#777;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:3px;

  font-size:11px;
  font-weight:700;
}

.footer-icon{
  font-size:21px;
}

.footer-btn.active{
  color:#fff;
}

.notification-wrap{
  position:relative;
}

.notification-badge{
  position:absolute;

  top:-3px;
  right:-12px;

  min-width:17px;
  height:17px;

  border-radius:10px;

  padding:0 4px;

  background:#ff3157;
  color:#fff;

  font-size:9px;

  display:none;
  align-items:center;
  justify-content:center;
}

/* =========================================================
   STATES
========================================================= */

.center-message{
  width:100%;
  min-height:100%;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  color:#888;

  padding:30px;
}

.center-message strong{
  color:#fff;
  font-size:18px;
  margin-bottom:7px;
}

.center-message button{
  margin-top:15px;

  padding:10px 17px;

  border:0;
  border-radius:10px;

  background:#fff;
  color:#000;

  font-weight:800;
}

/* =========================================================
   COMMENTS OVERLAY
========================================================= */

#commentsOverlay{
  position:fixed;

  inset:0;

  z-index:200;

  background:rgba(0,0,0,.6);

  display:none;

  align-items:flex-end;
}

#commentsOverlay.open{
  display:flex;
}

.comments-panel{
  width:100%;

  max-height:88vh;

  background:#fff;
  color:#111;

  border-radius:24px 24px 0 0;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  animation:commentsUp .2s ease;
}

@keyframes commentsUp{
  from{
    transform:translateY(100%);
  }
  to{
    transform:translateY(0);
  }
}

/* =========================================================
   COMMENT HEADER
========================================================= */

.comments-header{
  flex-shrink:0;

  padding:15px 16px 10px;

  border-bottom:1px solid #eee;
}

.comment-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.comment-heading{
  font-size:18px;
  font-weight:900;
  letter-spacing:-.3px;
}

.comment-close{
  width:34px;
  height:34px;

  border:0;
  border-radius:50%;

  background:#f0f0f0;

  font-size:20px;
}

.comment-subheading{
  font-size:12px;
  color:#777;
  margin-top:3px;
}

/* =========================================================
   REACTION STRIP
========================================================= */

.reactions{
  display:flex;
  gap:7px;

  margin-top:12px;

  overflow-x:auto;
  scrollbar-width:none;
}

.reactions::-webkit-scrollbar{
  display:none;
}

.reaction{
  flex-shrink:0;

  border:1px solid #e4e4e4;

  background:#fafafa;

  border-radius:20px;

  padding:6px 10px;

  font-size:14px;
}

/* =========================================================
   COMMENT SORT
========================================================= */

.comment-sort{
  display:flex;
  gap:8px;

  margin-top:10px;
}

.sort-btn{
  border:0;

  background:#f1f1f1;

  border-radius:15px;

  padding:6px 10px;

  font-size:11px;

  font-weight:700;

  color:#666;
}

.sort-btn.active{
  background:#111;
  color:#fff;
}

/* =========================================================
   COMMENTS LIST
========================================================= */

#commentsList{
  flex:1;

  overflow-y:auto;

  padding:8px 14px 15px;

  min-height:180px;

  scrollbar-width:none;
}

#commentsList::-webkit-scrollbar{
  display:none;
}

.comment{
  display:flex;

  gap:10px;

  padding:12px 2px;

  position:relative;
}

.comment-avatar{
  width:36px;
  height:36px;

  border-radius:50%;

  flex-shrink:0;

  background:#ddd;

  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:800;

  font-size:13px;
}

.comment-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.comment-body{
  min-width:0;
  flex:1;
}

.comment-author-line{
  display:flex;
  align-items:center;
  gap:6px;

  margin-bottom:3px;
}

.comment-author{
  font-size:13px;
  font-weight:800;
}

.comment-time{
  font-size:10px;
  color:#999;
}

.comment-creator{
  background:#111;
  color:#fff;

  border-radius:6px;

  padding:2px 5px;

  font-size:8px;

  font-weight:900;
}

.comment-text{
  font-size:14px;
  line-height:1.4;

  word-break:break-word;
}

.comment-meta{
  display:flex;
  align-items:center;

  gap:13px;

  margin-top:6px;
}

.comment-action{
  border:0;
  background:none;

  padding:0;

  color:#777;

  font-size:11px;
  font-weight:700;
}

.comment-action.reacted{
  color:#e51d4f;
}

.comment-actions-more{
  margin-left:auto;
}

.reply-list{
  margin-top:8px;
  padding-left:8px;

  border-left:2px solid #eee;
}

.reply{
  display:flex;
  gap:8px;

  padding:7px 0;
}

.reply .comment-avatar{
  width:27px;
  height:27px;
  font-size:10px;
}

.reply .comment-text{
  font-size:13px;
}

.pinned{
  background:#f7f7f7;

  border-radius:12px;

  padding:10px;

  margin:4px 0;
}

.pin-label{
  font-size:9px;
  font-weight:900;

  color:#777;

  margin-bottom:4px;
}

.comments-empty{
  padding:55px 20px;

  text-align:center;

  color:#777;
}

.comments-empty strong{
  display:block;

  color:#111;

  font-size:16px;

  margin-bottom:5px;
}

/* =========================================================
   COMMENT COMPOSER
========================================================= */

.comment-composer{
  flex-shrink:0;

  border-top:1px solid #eee;

  padding:10px;

  background:#fff;

  display:flex;

  gap:8px;

  align-items:flex-end;
}

.composer-avatar{
  width:34px;
  height:34px;

  border-radius:50%;

  flex-shrink:0;

  background:#111;
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:12px;
  font-weight:800;

  overflow:hidden;
}

.composer-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

#commentInput{
  flex:1;

  min-width:0;

  min-height:40px;
  max-height:100px;

  resize:none;

  border:1px solid #ddd;

  border-radius:20px;

  padding:10px 14px;

  outline:none;

  font-size:14px;
}

#commentInput:focus{
  border-color:#111;
}

#commentSend{
  width:40px;
  height:40px;

  border:0;
  border-radius:50%;

  background:#111;
  color:#fff;

  font-size:17px;

  flex-shrink:0;
}

#commentSend:disabled{
  opacity:.4;
}

/* =========================================================
   REPLY BAR
========================================================= */

#replyBar{
  display:none;

  padding:7px 12px;

  background:#f5f5f5;

  border-top:1px solid #eee;

  font-size:11px;

  color:#555;
}

#replyBar.show{
  display:flex;

  align-items:center;
  justify-content:space-between;
}

#cancelReply{
  border:0;
  background:none;

  font-weight:800;

  font-size:11px;
}

/* =========================================================
   SEARCH RESULTS
========================================================= */

.search-result{
  height:100%;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  padding:30px;

  text-align:center;
}

.search-result h2{
  margin-bottom:8px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px){

  .topbar{
    height:58px;
  }

  .tabs{
    top:58px;
  }

  #feed{
    top:106px;
  }

  .feed-card{
    height:calc(100vh - 168px);
  }

  .video-info{
    bottom:13px;
  }

  .actions{
    right:7px;
    gap:11px;
  }

  .action-icon{
    width:39px;
    height:39px;
  }

}
</style>
</head>

<body>

<div id="app">

  <!-- =====================================================
       TOP
  ====================================================== -->

  <header class="topbar">

    <div class="logo">BIGULA</div>

    <div class="search-wrap">

      <input
        id="search"
        type="search"
        autocomplete="off"
        placeholder="Search BIGULA"
      >

      <button
        id="searchClear"
        class="search-clear"
      >×</button>

    </div>

  </header>


  <!-- =====================================================
       TABS
  ====================================================== -->

  <nav class="tabs">

    <button class="tab active" data-tab="foryou">
      For You
    </button>

    <button class="tab" data-tab="latest">
      Latest
    </button>

    <button class="tab" data-tab="viral">
      Viral
    </button>

    <button class="tab" data-tab="live">
      Live
    </button>

    <button class="tab" data-tab="status">
      Status
    </button>

  </nav>


  <!-- =====================================================
       FEED
  ====================================================== -->

  <main id="feed">

    <div class="center-message">
      Loading BIGULA…
    </div>

  </main>


  <!-- =====================================================
       FOOTER
  ====================================================== -->

  <footer class="footer">

    <button
      class="footer-btn active"
      id="homeBtn"
    >
      <span class="footer-icon">⌂</span>
      Home
    </button>


    <button
      class="footer-btn"
      id="uploadBtn"
    >
      <span class="footer-icon">＋</span>
      Upload
    </button>


    <button
      class="footer-btn"
      id="notificationsBtn"
    >
      <span class="footer-icon notification-wrap">
        ♡
        <span
          id="notificationBadge"
          class="notification-badge"
        >0</span>
      </span>
      Notifications
    </button>


    <button
      class="footer-btn"
      id="accountBtn"
    >
      <span class="footer-icon">●</span>
      Account
    </button>

  </footer>

</div>


<!-- =======================================================
     BIGULA CONVERSATION
======================================================= -->

<div id="commentsOverlay">

  <section class="comments-panel">

    <div class="comments-header">

      <div class="comment-top">

        <div>
          <div class="comment-heading">
            THE CONVERSATION
          </div>

          <div
            id="commentSubheading"
            class="comment-subheading"
          >
            Join the conversation
          </div>
        </div>

        <button
          id="commentClose"
          class="comment-close"
        >
          ×
        </button>

      </div>


      <div class="reactions">

        <button class="reaction" data-reaction="😂">
          😂
        </button>

        <button class="reaction" data-reaction="❤️">
          ❤️
        </button>

        <button class="reaction" data-reaction="🔥">
          🔥
        </button>

        <button class="reaction" data-reaction="👀">
          👀
        </button>

        <button class="reaction" data-reaction="👏">
          👏
        </button>

        <button class="reaction" data-reaction="🤣">
          🤣
        </button>

      </div>


      <div class="comment-sort">

        <button
          class="sort-btn active"
          data-sort="interesting"
        >
          Interesting
        </button>

        <button
          class="sort-btn"
          data-sort="newest"
        >
          Newest
        </button>

      </div>

    </div>


    <div id="replyBar">

      <span>
        Replying to <strong id="replyName"></strong>
      </span>

      <button id="cancelReply">
        Cancel
      </button>

    </div>


    <div id="commentsList">

      <div class="comments-empty">
        Loading conversation…
      </div>

    </div>


    <div class="comment-composer">

      <div
        id="composerAvatar"
        class="composer-avatar"
      >
        B
      </div>

      <textarea
        id="commentInput"
        rows="1"
        maxlength="1000"
        placeholder="Join the conversation…"
      ></textarea>

      <button
        id="commentSend"
        disabled
      >
        ➤
      </button>

    </div>

  </section>

</div>


<script type="module">

import {
  createClient
} from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://vfteiggdhthvrrlndtbs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_7LUjk7PBJeCy-_ZdrEqDzA_sGUruHRe";


const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true,
      flowType:"pkce"
    }
  }
);


/* =========================================================
   ELEMENTS
========================================================= */

const feed =
document.getElementById("feed");

const search =
document.getElementById("search");

const searchClear =
document.getElementById("searchClear");

const commentsOverlay =
document.getElementById("commentsOverlay");

const commentsList =
document.getElementById("commentsList");

const commentInput =
document.getElementById("commentInput");

const commentSend =
document.getElementById("commentSend");

const commentClose =
document.getElementById("commentClose");

const commentSubheading =
document.getElementById("commentSubheading");

const replyBar =
document.getElementById("replyBar");

const replyName =
document.getElementById("replyName");

const composerAvatar =
document.getElementById("composerAvatar");


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let currentTab = "foryou";

let videos = [];

let visibleVideos = [];

let observer = null;

let activeVideo = null;

let activeVideoId = null;

let commentsVideoId = null;

let replyToComment = null;

let commentsSort = "interesting";

let commentRows = [];

let userCache = new Map();

let lastTap = 0;

let lastTapVideoId = null;

let loadingFeed = false;


/* =========================================================
   AUTH
========================================================= */

async function getCurrentUser(){

  /*
    Complete Google PKCE callback first.
  */

  const code =
  new URLSearchParams(location.search)
  .get("code");


  if(code){

    const result =
    await supabase.auth.exchangeCodeForSession(code);

    if(result.error){

      console.error(
        "PKCE exchange failed:",
        result.error
      );

    }else{

      history.replaceState(
        {},
        document.title,
        location.pathname
      );

    }

  }


  const result =
  await supabase.auth.getSession();


  if(result.data?.session?.user){

    return result.data.session.user;

  }


  const refreshed =
  await supabase.auth.refreshSession();


  if(
    !refreshed.error &&
    refreshed.data?.session?.user
  ){

    return refreshed.data.session.user;

  }


  return null;
}

async function getUserProfile(userId){

  if(!userId)return null;

  if(userCache.has(userId)){
    return userCache.get(userId);
  }


  const {data,error} =
  await supabase
    .from("users")
    .select("*")
    .eq("id",userId)
    .maybeSingle();


  if(error){

    console.warn(
      "User profile:",
      error.message
    );

  }


  if(data){
    userCache.set(userId,data);
  }


  return data || null;
}

/* =========================================================
   ESCAPE
========================================================= */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[c])
    );

}


/* =========================================================
   TIME
========================================================= */

function timeAgo(date){

  if(!date)return "";

  const seconds =
  Math.floor(
    (Date.now() - new Date(date).getTime())
    / 1000
  );


  if(seconds < 60)
    return `${seconds}s`;

  const minutes =
  Math.floor(seconds / 60);

  if(minutes < 60)
    return `${minutes}m`;

  const hours =
  Math.floor(minutes / 60);

  if(hours < 24)
    return `${hours}h`;

  const days =
  Math.floor(hours / 24);

  if(days < 7)
    return `${days}d`;

  return new Date(date)
    .toLocaleDateString();

}


/* =========================================================
   VIDEO URL
========================================================= */

function getVideoUrl(video){

  if(!video)return "";

  if(video.video_url)
    return video.video_url;

  if(video.url)
    return video.url;

  if(video.file_url)
    return video.file_url;

  if(video.public_url)
    return video.public_url;

  if(video.storage_path){

    return (
      SUPABASE_URL +
      "/storage/v1/object/public/bigula/" +
      video.storage_path
    );

  }

  return "";

}

/* =========================================================
   PREPARE FEED
========================================================= */

async function prepareFeed(){

  let list =
  [...videos];


  const interests =
  getSavedInterests();


  if(currentTab === "latest"){

    list.sort(
      (a,b) =>
        new Date(b.created_at || 0) -
        new Date(a.created_at || 0)
    );

  }


  else if(currentTab === "viral"){

    /*
      Use available counters when present.
      The exact database counters are not required.
    */

    list.sort(
      (a,b) => {

        const av =
          Number(
            a.views_count ??
            a.view_count ??
            a.views ??
            0
          );

        const bv =
          Number(
            b.views_count ??
            b.view_count ??
            b.views ??
            0
          );

        return bv-av;

      }
    );

  }


  else if(currentTab === "foryou"){

    /*
      For You:
      1. Saved interests
      2. Followed creators can be prioritized
      3. Newer content
    */

    const scores =
    new Map();


    for(const video of list){

      let score = 0;

      const category =
      String(video.category || "")
        .toLowerCase();


      if(
        interests.some(
          i =>
          String(i).toLowerCase() === category
        )
      ){

        score += 100;

      }


      score +=
      new Date(video.created_at || 0)
        .getTime()
        / 100000000;


      scores.set(video.id,score);

    }


    list.sort(
      (a,b) =>
        (scores.get(b.id) || 0) -
        (scores.get(a.id) || 0)
    );

  }


  else if(currentTab === "live"){

    list =
    list.filter(video => {

      return (
        video.is_live === true ||
        video.live === true
      );

    });

  }


  else if(currentTab === "status"){

    /*
      Status is handled separately when a statuses
      table exists. We don't pretend ordinary videos
      are statuses.
    */

    await loadStatuses();

    return;

  }


  if(search.value.trim()){

    list =
    await filterSearch(list,search.value);

  }


  visibleVideos = list;

  renderFeed(list);

}


/* =========================================================
   INTERESTS
========================================================= */

function getSavedInterests(){

  try{

    const raw =
    localStorage.getItem("bigula_interests");

    const result =
    JSON.parse(raw || "[]");

    return Array.isArray(result)
      ? result
      : [];

  }catch(e){

    return [];

  }

}


/* =========================================================
   SEARCH
========================================================= */

async function filterSearch(list,text){

  const q =
  text.trim().toLowerCase();

  if(!q)return list;


  const creatorIds =
  new Set();


  for(const video of list){

    const userId =
    getVideoUserId(video);

    if(userId)
      creatorIds.add(userId);

  }


  const creators = {};


  if(creatorIds.size){

    const {data} =
    await supabase
      .from("users")
      .select("*")
      .in("id",[...creatorIds]);


    for(const user of data || []){

      const name =
      String(
        user.full_name ||
        user.name ||
        user.display_name ||
        ""
      ).toLowerCase();


      creators[user.id] = name;

    }

  }


  return list.filter(video => {

    const title =
    String(
      video.title ||
      ""
    ).toLowerCase();


    const description =
    String(
      video.description ||
      ""
    ).toLowerCase();


    const category =
    String(
      video.category ||
      ""
    ).toLowerCase();


    const creator =
    creators[getVideoUserId(video)] ||
    "";


    return (
      title.includes(q) ||
      description.includes(q) ||
      category.includes(q) ||
      creator.includes(q)
    );

  });

}

/* =========================================================
   FORMAT COUNT
========================================================= */

function formatCount(number){

  number =
  Number(number || 0);


  if(number >= 1000000)
    return (
      (number / 1000000)
        .toFixed(number >= 10000000 ? 0 : 1)
      + "M"
    );


  if(number >= 1000)
    return (
      (number / 1000)
        .toFixed(number >= 10000 ? 0 : 1)
      + "K"
    );


  return String(number);

}


/* =========================================================
   VIDEO TAP
========================================================= */

function handleVideoTap(card,video,videoData){

  const now =
  Date.now();


  const isDouble =
  lastTapVideoId === videoData.id &&
  now - lastTap < 350;


  lastTap = now;
  lastTapVideoId = videoData.id;


  if(isDouble){

    showDoubleHeart(card);

    if(!card.querySelector(".like-button")
      .classList.contains("liked")){

      toggleLike(
        videoData.id,
        card
      );

    }

    return;

  }


  if(video.paused){

    video.play().catch(()=>{});

    card.querySelector(
      ".pause-indicator"
    ).classList.remove("show");

  }else{

    video.pause();

    const indicator =
    card.querySelector(
      ".pause-indicator"
    );

    indicator.textContent = "▶";

    indicator.classList.add("show");

  }

}


/* =========================================================
   DOUBLE HEART
========================================================= */

function showDoubleHeart(card){

  const heart =
  card.querySelector(".double-heart");


  heart.classList.remove("animate");

  void heart.offsetWidth;

  heart.classList.add("animate");

}


/* =========================================================
   VIDEO OBSERVER
========================================================= */

function setupObserver(){

  if(observer)
    observer.disconnect();


  observer =
  new IntersectionObserver(
    entries => {

      entries.forEach(entry => {

        const video =
        entry.target.querySelector(
          ".video"
        );


        if(!video)return;


        if(
          entry.isIntersecting &&
          entry.intersectionRatio >= .75
        ){

          activeVideo =
          video;


          document
            .querySelectorAll(".feed-card .video")
            .forEach(other => {

              if(other !== video)
                other.pause();

            });


          video.play().catch(()=>{});

          recordViewOnce(
            entry.target.dataset.videoId
          );

        }else{

          video.pause();

        }

      });

    },
    {
      threshold:[0,.75]
    }
  );


  document
    .querySelectorAll(".feed-card")
    .forEach(card =>
      observer.observe(card)
    );

}


/* =========================================================
   VIEW TRACKING
========================================================= */

const viewedVideos =
new Set();


async function recordViewOnce(videoId){

  if(!currentUser)return;

  if(viewedVideos.has(videoId))
    return;


  viewedVideos.add(videoId);


  /*
    View is recorded only after the card is
    actually visible enough to become active.
  */

  const {error} =
  await supabase
    .from("views")
    .insert({
      video_id:videoId,
      user_id:currentUser.id
    });


  if(error){

    /*
      Do not crash the feed if the views
      table has a stricter policy.
    */

    console.warn(
      "View record:",
      error.message
    );

  }

}


/* =========================================================
   LIKE
========================================================= */

async function toggleLike(videoId,card){

  if(!currentUser){

    alert("Please sign in to like videos.");

    location.href =
    "signup.html";

    return;

  }


  const button =
  card.querySelector(".like-button");


  const icon =
  button.querySelector(".action-icon");


  const countEl =
  button.querySelector(".like-count");


  const wasLiked =
  button.classList.contains("liked");


  button.disabled = true;


  if(wasLiked){

    const {error} =
    await supabase
      .from("likes")
      .delete()
      .eq("video_id",videoId)
      .eq("user_id",currentUser.id);


    if(error){

      console.error(
        "Unlike error:",
        error
      );

      alert(
        "Could not remove your like: " +
        error.message
      );

      button.disabled = false;

      return;

    }


    button.classList.remove("liked");

    icon.textContent = "♡";

    countEl.textContent =
    formatCount(
      Math.max(
        0,
        Number(
          parseCount(countEl.textContent)
        ) - 1
      )
    );

  }else{

    const {error} =
    await supabase
      .from("likes")
      .insert({
        video_id:videoId,
        user_id:currentUser.id
      });


    if(error){

      /*
        If duplicate insert happens because
        another event already liked it, refresh.
      */

      console.error(
        "Like error:",
        error
      );

      alert(
        "Could not like this video: " +
        error.message
      );

      button.disabled = false;

      return;

    }


    button.classList.add("liked");

    icon.textContent = "♥";

    countEl.textContent =
    formatCount(
      Number(
        parseCount(countEl.textContent)
      ) + 1
    );

  }


  button.disabled = false;

}


/* =========================================================
   PARSE COUNT
========================================================= */

function parseCount(value){

  const s =
  String(value || "0")
    .toUpperCase()
    .trim();


  if(s.endsWith("K"))
    return parseFloat(s) * 1000;


  if(s.endsWith("M"))
    return parseFloat(s) * 1000000;


  return parseInt(s,10) || 0;

}

/* =========================================================
   RENDER COMMENTS
========================================================= */

async function renderComments(){

  if(!commentRows.length){

    commentsList.innerHTML = `
      <div class="comments-empty">
        <strong>Start the conversation.</strong>
        <span>
          Be the first person to say something about this video.
        </span>
      </div>
    `;

    commentSubheading.textContent =
    "Be the first to join";

    return;

  }


  const userIds =
  [
    ...new Set(
      commentRows
        .map(getCommentUserId)
        .filter(Boolean)
    )
  ];


  await Promise.all(
    userIds.map(
      id => getUserProfile(id)
    )
  );


  const topLevel =
  commentRows.filter(
    c => !getParentId(c)
  );


  const replies =
  commentRows.filter(
    c => getParentId(c)
  );


  commentSubheading.textContent =
  `${commentRows.length} ${
    commentRows.length === 1
      ? "person"
      : "people"
  } joined the conversation`;


  commentsList.innerHTML =
  topLevel
    .map(comment => {

      const childReplies =
      replies.filter(
        r =>
          getParentId(r) ===
          comment.id
      );


      return renderComment(
        comment,
        childReplies
      );

    })
    .join("");


  bindCommentButtons();

}


/* =========================================================
   RENDER SINGLE COMMENT
========================================================= */

function renderComment(comment,replies=[]){

  const userId =
  getCommentUserId(comment);


  const profile =
  userCache.get(userId) || {};


  const name =
  profile.full_name ||
  profile.name ||
  profile.display_name ||
  "BIGULA User";


  const avatar =
  profile.avatar_url ||
  profile.photo_url ||
  profile.profile_photo ||
  profile.avatar ||
  "";


  const isCreator =
  userId &&
  currentVideoOwnerId() === userId;


  const pinned =
  comment.is_pinned === true ||
  comment.pinned === true;


  const likeCount =
  Number(
    comment.likes_count ??
    comment.like_count ??
    comment.likes ??
    0
  );


  return `

    <div
      class="comment ${pinned ? "pinned" : ""}"
      data-comment-id="${esc(comment.id)}"
    >

      <div class="comment-avatar">

        ${
          avatar
          ? `<img src="${esc(avatar)}" alt="">`
          : esc(
              name
                .charAt(0)
                .toUpperCase()
            )
        }

      </div>


      <div class="comment-body">

        ${
          pinned
          ? `<div class="pin-label">📌 PINNED BY CREATOR</div>`
          : ""
        }


        <div class="comment-author-line">

          <span class="comment-author">
            ${esc(name)}
          </span>

          ${
            isCreator
            ? `<span class="comment-creator">CREATOR</span>`
            : ""
          }

          <span class="comment-time">
            ${esc(timeAgo(comment.created_at))}
          </span>

        </div>


        <div class="comment-text">
          ${esc(getCommentText(comment))}
        </div>


        <div class="comment-meta">

          <button
            class="comment-action comment-react"
            data-id="${esc(comment.id)}"
          >
            ${
              likeCount
                ? "♥ " + formatCount(likeCount)
                : "♡"
            }
          </button>


          <button
            class="comment-action comment-reply"
            data-id="${esc(comment.id)}"
            data-name="${esc(name)}"
          >
            Reply
          </button>


          ${
            currentUser &&
            userId === currentUser.id
            ?
            `<button
              class="comment-action comment-delete"
              data-id="${esc(comment.id)}"
            >
              Delete
            </button>`
            :
            `<button
              class="comment-action comment-report"
              data-id="${esc(comment.id)}"
            >
              Report
            </button>`
          }

        </div>


        ${
          replies.length
          ?
          `<div class="reply-list">
            ${replies.map(
              r => renderReply(r)
            ).join("")}
          </div>`
          :
          ""
        }

      </div>

    </div>

  `;

}

/* =========================================================

========================================================= */

function bindCommentButtons(){

  document
    .querySelectorAll(".comment-reply")
    .forEach(button => {

      button.onclick = () => {

        if(!currentUser){

          alert(
            "Please sign in to reply."
          );

          location.href =
          "signup.html";

          return;

        }


        replyToComment =
        button.dataset.id;


        replyName.textContent =
        button.dataset.name;


        replyBar.classList.add(
          "show"
        );


        commentInput.focus();

      };

    });


  document
    .querySelectorAll(".comment-react")
    .forEach(button => {

      button.onclick = () => {

        /*
          Comment reactions are visually supported.
          Actual persistence is attempted only if
          the comments table exposes a usable
          likes_count field; otherwise the main
          comments table remains untouched.
        */

        button.classList.toggle(
          "reacted"
        );

      };

    });


  document
    .querySelectorAll(".comment-delete")
    .forEach(button => {

      button.onclick = () =>
        deleteComment(
          button.dataset.id
        );

    });


  document
    .querySelectorAll(".comment-report")
    .forEach(button => {

      button.onclick = () =>
        reportComment(
          button.dataset.id
        );

    });

}


/* =========================================================
   SEND COMMENT
========================================================= */

async function sendComment(){

  if(!currentUser){

    alert(
      "Please sign in to join the conversation."
    );

    location.href =
    "signup.html";

    return;

  }


  const text =
  commentInput.value.trim();


  if(!text)return;

  if(!commentsVideoId)return;


  commentSend.disabled = true;


  /*
    Your comments table may use "comment"
    or "content". Try the BIGULA "comment"
    field first, then content if necessary.
  */

  let payload = {

    video_id:
    commentsVideoId,

    user_id:
    currentUser.id,

    comment:
    text

  };


  if(replyToComment){

    payload.parent_id =
    replyToComment;

  }


  let result =
  await supabase
    .from("comments")
    .insert(payload);


  /*
    If the table does not have "comment",
    retry using "content".
  */

  if(
    result.error &&
    /comment/i.test(
      result.error.message || ""
    )
  ){

    payload =
    {
      video_id:
      commentsVideoId,

      user_id:
      currentUser.id,

      content:
      text
    };


    if(replyToComment){

      payload.parent_id =
      replyToComment;

    }


    result =
    await supabase
      .from("comments")
      .insert(payload);

  }


  if(result.error){

    console.error(
      "Comment insert error:",
      result.error
    );


    alert(
      "Comment could not be posted: " +
      result.error.message
    );


    commentSend.disabled = false;

    return;

  }


  commentInput.value = "";

  replyToComment = null;

  replyBar.classList.remove(
    "show"
  );


  commentSend.disabled = true;


  await loadComments();

}


/* =========================================================
   DELETE COMMENT
========================================================= */

async function deleteComment(commentId){

  if(!currentUser)return;


  const yes =
  confirm(
    "Delete this comment?"
  );


  if(!yes)return;


  const {error} =
  await supabase
    .from("comments")
    .delete()
    .eq("id",commentId)
    .eq("user_id",currentUser.id);


  if(error){

    alert(
      "Could not delete comment: " +
      error.message
    );

    return;

  }


  await loadComments();

}


/* =========================================================
   REPORT COMMENT
========================================================= */

async function reportComment(commentId){

  if(!currentUser){

    alert(
      "Please sign in first."
    );

    return;

  }


  /*
    Keep reporting available without assuming
    extra columns in the reports table.
  */

  const reason =
  prompt(
    "Why are you reporting this comment?",
    "Inappropriate content"
  );


  if(!reason)return;


  const {error} =
  await supabase
    .from("reports")
    .insert({

      user_id:
      currentUser.id,

      comment_id:
      commentId,

      reason:
      reason.trim()

    });


  if(error){

    alert(
      "Report could not be submitted: " +
      error.message
    );

    return;

  }


  alert(
    "Thanks. BIGULA received your report."
  );

}

/* =========================================================
   SHARE
========================================================= */

async function shareVideo(video){

  const code =
  video.short_code ||
  video.shortCode ||
  "";


  const url =
  code
  ? `${location.origin}${location.pathname.replace(
      "home.html",
      ""
    )}video_view.html?short_code=${encodeURIComponent(code)}`
  : `${location.origin}${location.pathname.replace(
      "home.html",
      ""
    )}video_view.html?id=${encodeURIComponent(video.id)}`;


  if(
    navigator.share
  ){

    try{

      await navigator.share({
        title:
          video.title ||
          "BIGULA video",
        text:
          "Watch this on BIGULA",
        url
      });

      return;

    }catch(e){

      if(e.name === "AbortError")
        return;

    }

  }


  try{

    await navigator.clipboard.writeText(
      url
    );

    alert(
      "BIGULA video link copied."
    );

  }catch(e){

    prompt(
      "Copy this BIGULA link:",
      url
    );

  }

}


/* =========================================================
   STATUSES
========================================================= */

async function loadStatuses(){

  /*
    Statuses are intentionally kept separate
    from ordinary videos.
  */

  const {data,error} =
  await supabase
    .from("statuses")
    .select("*")
    .eq("is_active",true)
    .gt(
      "expires_at",
      new Date().toISOString()
    )
    .order(
      "created_at",
      {ascending:false}
    );


  if(error){

    /*
      If statuses table has not been created yet,
      show a useful state instead of crashing Home.
    */

    console.warn(
      "Status feed:",
      error.message
    );


    feed.innerHTML = `
      <div class="center-message">
        <strong>Status is coming to BIGULA</strong>
        <span>
          Status posts will appear here when enabled.
        </span>
      </div>
    `;

    return;

  }


  if(!data?.length){

    feed.innerHTML = `
      <div class="center-message">
        <strong>No active statuses</strong>
        <span>
          Follow creators and friends to see their status posts here.
        </span>
      </div>
    `;

    return;

  }


  /*
    A status can reference video_id.
    Load those videos and display them using
    the normal video-card system.
  */

  const videoIds =
  data
    .map(s => s.video_id)
    .filter(Boolean);


  if(!videoIds.length){

    feed.innerHTML = `
      <div class="center-message">
        <strong>No video statuses yet</strong>
      </div>
    `;

    return;

  }


  const {data:statusVideos} =
  await supabase
    .from("videos")
    .select("*")
    .in("id",videoIds);


  if(!statusVideos?.length){

    feed.innerHTML = `
      <div class="center-message">
        <strong>No active statuses</strong>
      </div>
    `;

    return;

  }


  visibleVideos =
  statusVideos;


  await renderFeed(
    statusVideos
  );

}

/* =========================================================
   NOTIFICATION BADGE
========================================================= */

async function loadNotificationBadge(){

  if(!currentUser)return;


  /*
    BIGULA notifications may use either
    user_id or recipient_id depending on
    the existing version of the table.
  */

  let result =
  await supabase
    .from("notifications")
    .select("id",{count:"exact",head:true})
    .eq("user_id",currentUser.id)
    .eq("is_read",false);


  if(result.error){

    result =
    await supabase
      .from("notifications")
      .select("id",{count:"exact",head:true})
      .eq("recipient_id",currentUser.id)
      .eq("is_read",false);

  }


  const count =
  result.count || 0;


  const badge =
  document.getElementById(
    "notificationBadge"
  );


  if(count > 0){

    badge.textContent =
    count > 99
      ? "99+"
      : String(count);

    badge.style.display =
    "flex";

  }else{

    badge.style.display =
    "none";

  }

}
