<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BIGULA – Home</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

html,
body{
  background:#000;
  color:#fff;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  touch-action:pan-y;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:112px;
  background:linear-gradient(to bottom,#000 88%,rgba(0,0,0,.92));
  z-index:100;
  padding:10px 14px 8px;
  display:flex;
  flex-direction:column;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  box-shadow:0 3px 18px rgba(0,0,0,.45);
}

.top-row{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
}

.logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:4px;
  color:#ff0000;
  text-shadow:0 0 20px rgba(255,0,0,.8);
  flex:0 0 auto;
  line-height:1;
}

.top-search{
  flex:1;
  min-width:0;
}

.top-search input{
  width:100%;
  height:42px;
  padding:10px 17px;
  border-radius:999px;
  border:1px solid #333;
  background:#111;
  color:#fff;
  font-size:15px;
  outline:none;
}

.top-search input:focus{
  border-color:#ff0000;
  box-shadow:0 0 0 2px rgba(255,0,0,.12);
}

/* =========================================================
   TABS
========================================================= */

.tabs{
  display:flex;
  gap:0;
  margin-top:10px;
  width:100%;
  overflow-x:auto;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  cursor:pointer;
  font-weight:700;
  opacity:.6;
  transition:.2s;
  font-size:16px;
  flex:1 1 0;
  text-align:center;
  padding:7px 6px 8px;
  white-space:nowrap;
  min-width:0;
}

.tab.active{
  opacity:1;
  color:#ff0000;
  border-bottom:2px solid #ff0000;
}

/* =========================================================
   FEED
========================================================= */

/*
   The usable screen is:

   topbar
      +
   video card
      +
   footer

   Every video card is exactly the available viewport.
*/

.feed{
  position:fixed;
  top:112px;
  left:0;
  right:0;
  bottom:72px;

  width:100%;
  height:calc(100dvh - 184px);

  overflow-y:auto;
  overflow-x:hidden;

  display:flex;
  flex-direction:column;
  align-items:stretch;

  scroll-snap-type:y mandatory;
  scroll-behavior:smooth;

  overscroll-behavior-y:contain;

  scrollbar-width:none;
}

.feed::-webkit-scrollbar{
  display:none;
}

/* =========================================================
   VIDEO CARD
========================================================= */

.video-card{
  position:relative;

  flex:0 0 100%;
  width:100%;

  height:100%;
  min-height:100%;

  background:#000;

  overflow:hidden;

  display:flex;
  flex-direction:column;

  scroll-snap-align:start;
  scroll-snap-stop:always;

  margin:0;
  padding:0;
}

/*
   Video takes all available space except metadata.
*/

.video-stage{
  position:relative;

  width:100%;
  flex:1 1 auto;

  min-height:0;

  background:#000;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.video-stage video{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

  background:#000;

  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
}

/* =========================================================
   VIDEO TITLE
========================================================= */

.title-overlay{
  position:absolute;

  left:14px;
  right:14px;
  bottom:12px;

  max-width:calc(100% - 28px);

  font-size:15px;
  font-weight:800;

  color:#fff;

  text-shadow:
    0 2px 12px #000,
    0 0 3px #000;

  z-index:3;

  pointer-events:none;

  padding:30px 0 4px;
}

/* =========================================================
   METADATA AREA
========================================================= */

.meta-overlay{
  position:relative;

  flex:0 0 128px;

  height:128px;
  min-height:128px;

  padding:9px 13px 9px;

  display:flex;
  flex-direction:column;

  gap:6px;

  background:#090909;

  border-top:1px solid #242424;

  overflow:hidden;
}

/* =========================================================
   CREATOR ROW
========================================================= */

.user-row{
  display:flex;
  align-items:center;

  gap:9px;

  width:100%;
  min-width:0;

  flex:0 0 auto;
}

.username{
  font-weight:900;
  font-size:18px;

  cursor:pointer;

  color:#00e5ff;

  line-height:1.2;

  white-space:nowrap;

  overflow:hidden;
  text-overflow:ellipsis;

  text-shadow:0 0 10px rgba(0,229,255,.18);

  min-width:0;
}

.follow-btn{
  flex:0 0 auto;

  padding:7px 13px;

  font-size:13px;

  background:linear-gradient(180deg,#1e1e1e,#111);

  color:#fff;

  border-radius:999px;

  border:1px solid #333;

  cursor:pointer;

  font-weight:800;

  white-space:nowrap;
}

.live-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;

  color:#ff3040;

  font-size:11px;
  font-weight:900;

  flex:0 0 auto;
}

.live-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#ff3040;

  display:inline-block;

  box-shadow:0 0 8px rgba(255,48,64,.8);
}

/* =========================================================
   ACTION BUTTONS
========================================================= */

.video-actions{
  display:flex;

  align-items:center;

  gap:8px;

  width:100%;

  overflow-x:auto;

  scrollbar-width:none;

  padding:1px 0 1px;

  flex:0 0 auto;
}

.video-actions::-webkit-scrollbar{
  display:none;
}

/*
   Slightly larger than the old buttons.
*/

.stat-btn,
.views-btn,
.share-btn{
  height:40px;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:6px;

  background:linear-gradient(180deg,#242424,#111);

  color:#fff;

  padding:8px 13px;

  border-radius:999px;

  border:1px solid #383838;

  cursor:pointer;

  font-weight:800;

  font-size:13px;

  white-space:nowrap;

  min-width:82px;

  box-shadow:
    0 3px 10px rgba(0,0,0,.3);

  flex:0 0 auto;
}

.stat-btn span:first-child{
  font-size:19px;
  line-height:1;
}

.stat-btn span:last-child{
  font-size:13px;
  font-weight:900;
}

.views-btn{
  min-width:88px;
}

.share-btn{
  min-width:90px;
}

.stat-btn:active,
.views-btn:active,
.share-btn:active{
  transform:scale(.97);
}

/* =========================================================
   STATUS
========================================================= */

.status-card{
  min-height:90px;

  padding:14px;

  border-bottom:1px solid #222;

  display:flex;
  align-items:center;

  gap:12px;

  background:#090909;

  cursor:pointer;
}

.status-avatar{
  width:52px;
  height:52px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#222;

  color:#00e5ff;

  font-weight:900;

  font-size:18px;

  flex:0 0 52px;

  overflow:hidden;
}

.status-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.status-content{
  min-width:0;
  flex:1;
}

.status-name{
  font-weight:900;
  color:#00e5ff;
  margin-bottom:5px;
}

.status-time{
  font-size:11px;
  color:#888;
}

.status-text{
  font-size:14px;
  color:#ddd;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.feed.status-feed{
  display:block;
  overflow-y:auto;
}

/* =========================================================
   SHARE MENU
========================================================= */

.share-options{
  display:none;

  position:absolute;

  right:10px;
  bottom:49px;

  background:#000;

  padding:10px;

  border-radius:10px;

  flex-direction:column;

  gap:5px;

  z-index:20;

  border:1px solid #333;
}

.share-options button{
  background:#333;
  color:#fff;

  padding:7px 12px;

  border:0;
  border-radius:10px;

  cursor:pointer;

  white-space:nowrap;
}

/* =========================================================
   COMMENTS
========================================================= */

.comment-modal{
  position:fixed;

  left:0;
  bottom:0;

  width:100%;
  height:60%;

  background:#111;

  display:none;

  flex-direction:column;

  border-top:3px solid #ff0000;

  z-index:200;
}

.comment-list{
  flex:1;

  overflow-y:auto;

  padding:15px;
}

.comment-input{
  display:flex;

  border-top:1px solid #333;
}

.comment-input input{
  flex:1;

  padding:12px;

  background:#000;

  border:none;

  color:#fff;

  font-size:16px;
}

.comment-input button{
  background:#ff0000;

  border:none;

  padding:12px 20px;

  color:#fff;

  font-weight:bold;

  cursor:pointer;

  font-size:16px;
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
  position:fixed;

  bottom:0;
  left:0;

  width:100%;

  height:72px;

  background:rgba(0,0,0,.97);

  border-top:1px solid #292929;

  display:flex;

  justify-content:space-around;
  align-items:center;

  z-index:100;

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  padding-bottom:env(safe-area-inset-bottom);
}

.footer div{
  cursor:pointer;

  transition:.2s;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:3px;

  min-width:72px;

  height:58px;

  color:#ddd;

  font-size:20px;
}

.footer div::after{
  font-size:10px;

  font-weight:800;

  color:#aaa;

  letter-spacing:.2px;
}

#notifBtn{
  position:relative;
}

#notificationBadge{
  position:absolute;

  top:3px;
  right:12px;

  min-width:18px;
  height:18px;

  padding:0 5px;

  border-radius:999px;

  background:#ff1744;

  color:#fff;

  font-size:10px;

  font-weight:900;

  display:none;

  align-items:center;
  justify-content:center;

  border:2px solid #000;

  box-shadow:0 2px 8px rgba(255,23,68,.45);
}

#notifBtn::after{
  content:'Notifications';
}

#footerUpload{
  position:relative;
  min-width:82px;
}

#footerUpload::after{
  content:'Create';
}

#footerUpload.signed-out::after{
  content:'Upload';
}

/* =========================================================
   ACCOUNT BUTTON
========================================================= */

#accountBtn{
  position:relative;

  min-width:92px;

  color:#fff;

  font-size:14px;

  font-weight:900;

  letter-spacing:.2px;

  border-radius:16px;

  padding:5px 9px;
}

#accountBtn .account-icon{
  width:34px;
  height:34px;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  background:linear-gradient(145deg,#202020,#080808);

  border:1px solid #444;

  box-shadow:
    0 0 0 1px rgba(255,255,255,.04),
    0 4px 14px rgba(0,0,0,.45);

  font-size:16px;

  overflow:hidden;
}

#accountBtn .account-icon img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

#accountBtn .account-label{
  max-width:82px;

  overflow:hidden;
  text-overflow:ellipsis;

  white-space:nowrap;

  font-size:10px;

  line-height:1.1;

  font-weight:900;

  color:#aaa;
}

#accountBtn.signed-in{
  background:linear-gradient(
    180deg,
    rgba(255,0,0,.10),
    rgba(0,0,0,.05)
  );

  border:1px solid rgba(255,0,0,.35);

  box-shadow:0 0 16px rgba(255,0,0,.08);
}

#accountBtn.signed-in .account-icon{
  border-color:#ff3030;

  background:linear-gradient(145deg,#ff3030,#700000);

  box-shadow:0 0 12px rgba(255,0,0,.35);
}

#accountBtn.signed-in .account-label{
  color:#fff;
}

#accountBtn.signed-out .account-icon{
  background:linear-gradient(145deg,#222,#0b0b0b);
  border-color:#555;
}

#accountBtn.signed-out .account-label{
  color:#ff3030;
}

/* =========================================================
   UPLOAD BUTTON
========================================================= */

#footerUpload .upload-icon{
  width:38px;
  height:38px;

  border-radius:13px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:25px;
  font-weight:900;

  line-height:1;

  color:#fff;

  background:linear-gradient(
    145deg,
    #ff3030,
    #a00000 58%,
    #520000
  );

  border:1px solid #ff5555;

  box-shadow:
    0 5px 18px rgba(255,0,0,.30),
    inset 0 1px 0 rgba(255,255,255,.22);
}

#footerUpload.signed-out .upload-icon{
  background:linear-gradient(145deg,#242424,#0b0b0b);

  border-color:#555;

  box-shadow:0 4px 13px rgba(0,0,0,.5);
}

#accountBtn::after{
  content:none;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:620px){

  .topbar{
    height:104px;

    padding:
      9px
      10px
      7px;
  }

  .top-row{
    gap:8px;
  }

  .logo{
    font-size:22px;
    letter-spacing:2px;
  }

  .top-search input{
    height:38px;

    font-size:13px;

    padding:8px 12px;
  }

  .tabs{
    margin-top:9px;
  }

  .tab{
    font-size:14px;
    padding:7px 4px 8px;
  }

  /*
     Mobile viewport.

     104px top bar
     70px footer
     = actual card area
  */

  .feed{
    top:104px;
    bottom:70px;

    height:calc(100dvh - 174px);
  }

  .video-card{
    flex-basis:100%;
    height:100%;
    min-height:100%;
  }

  .video-stage{
    flex:1 1 auto;
  }

  .meta-overlay{
    flex-basis:126px;
    height:126px;
    min-height:126px;

    padding:8px 10px 8px;

    gap:6px;
  }

  .username{
    font-size:16px;
  }

  .follow-btn{
    padding:6px 11px;
    font-size:12px;
  }

  .stat-btn,
  .views-btn,
  .share-btn{
    height:39px;

    padding:7px 11px;

    font-size:12px;

    min-width:80px;
  }

  .stat-btn span:first-child{
    font-size:18px;
  }

  .footer{
    height:70px;
  }

  .footer div{
    min-width:64px;
    height:58px;
  }

  #accountBtn{
    min-width:72px;
    padding:4px 5px;
  }

  #accountBtn .account-label{
    max-width:62px;
  }

  #footerUpload{
    min-width:64px;
  }

  #notificationBadge{
    right:7px;
    top:2px;
  }

  .title-overlay{
    left:10px;
    right:10px;
    max-width:calc(100% - 20px);
    font-size:13px;
  }
}

/* Very short screens */

@media(max-height:650px){

  .meta-overlay{
    flex-basis:112px;
    height:112px;
    min-height:112px;

    padding-top:6px;
    padding-bottom:6px;

    gap:4px;
  }

  .stat-btn,
  .views-btn,
  .share-btn{
    height:36px;
    padding:6px 10px;
  }

  .username{
    font-size:15px;
  }

  .follow-btn{
    padding:5px 10px;
  }
}

/* =========================================================
   EMPTY / SEARCH
========================================================= */

.empty-message{
  width:100%;

  text-align:center;

  color:#aaa;

  padding:30px 20px;

  font-size:14px;
}

/* =========================================================
   HIDDEN SEARCH RESULTS
========================================================= */

.search-active .video-card{
  scroll-snap-align:start;
}
</style>
</head>

<body>

<!-- =======================================================
     TOP BAR
======================================================== -->

<div class="topbar" id="topbar">

  <div class="top-row">

    <div class="logo">BIGULA</div>

    <div class="top-search">
      <input
        type="search"
        id="searchInput"
        placeholder="Search videos or creators..."
        autocomplete="off"
      >
    </div>

  </div>

  <div class="tabs">

    <div class="tab active" data-feed="foryou">

    </div>

</div>

<div class="footer">

  <div
    id="footerUpload"
    class="signed-out"

  >
    <span
      class="upload-icon"
      aria-hidden="true"
    >↑</span>
  </div>

    🔔

    <span id="notificationBadge">
      0
    </span>

  </div>


  <div
    id="accountBtn"
    class="signed-out"
    title="Signup"
  >

    <span
      class="account-icon"
      aria-hidden="true"
    >👤</span>

    <span class="account-label">
      Signup
    </span>

  </div>

</div>


<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://vfteiggdhthvrrlndtbs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_7LUjk7PBJeCy-_ZdrEqDzA_sGUruHRe";

const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   GLOBAL STATE
========================================================= */

let currentUser = null;

let currentVideoId = null;

const creatorProfiles = new Map();

let allLoadedVideos = [];

let allLoadedCreators = [];

let activeFeedType = "foryou";

let searchTimer = null;


/* =========================================================
   SESSION
========================================================= */

async function initUser(){

  currentUser = null;

  try{

    const params =
      new URLSearchParams(
        window.location.search
      );

    const code =
      params.get("code");

    if(code){

      const {
        data,
        error
      } =
        await supabase.auth
          .exchangeCodeForSession(code);

      if(error) throw error;

      currentUser =
        data?.session?.user || null;

      history.replaceState(
        {},
        document.title,
        window.location.pathname
      );

    }else{

      /*
         getSession is used to restore the
         persisted browser session.
      */

      const {
        data,
        error
      } =
        await supabase.auth.getSession();

      if(error){

        console.warn(
          "Session check failed:",
          error
        );

      }else{

        currentUser =
          data?.session?.user || null;

      }

    }

  }catch(error){

    console.warn(
      "Could not establish Supabase session:",
      error
    );

    currentUser = null;

  }


  updateFooterUserState();


  if(currentUser){

    await loadCurrentUserProfile();

    loadNotificationBadge();

  }

  return true;
}


/* =========================================================
   LOAD LOGGED-IN USER PROFILE
========================================================= */

async function loadCurrentUserProfile(){

  if(!currentUser) return null;

  try{

    const {
      data,
      error
    } =
      await supabase
        .from("users")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();

    if(error){

      console.warn(
        "Could not load current user profile:",
        error.message
      );

      return null;
    }

    if(data){

      localStorage.setItem(
        "bigula_user",
        JSON.stringify(data)
      );

      updateFooterUserState(data);

      return data;

    }

  }catch(error){

    console.warn(
      "Profile loading failed:",
      error
    );

  }

  return null;
}


/* =========================================================
   GET AVATAR URL
========================================================= */

function getAvatarUrl(profile){

  if(!profile) return "";

  /*
     Support several likely avatar column names.

     The actual users table can therefore use:
       avatar_url
       avatar
       profile_image
       profile_image_url
       image_url
       photo_url
       photo
       picture
       image
  */

  const candidates = [

    profile.avatar_url,

    profile.avatar,

    profile.profile_image,

    profile.profile_image_url,

    profile.image_url,

    profile.photo_url,

    profile.photo,

    profile.picture,

    profile.image

  ];

  for(const value of candidates){

    const url =
      String(value || "").trim();

    if(url) return url;

  }

  /*
     If no avatar is stored in users,
     try Google's profile picture from
     Supabase user metadata.
  */

  const metadata =
    currentUser?.user_metadata || {};

  const googleAvatar =
    String(
      metadata.avatar_url ||
      metadata.picture ||
      metadata.photo_url ||
      ""
    ).trim();

  return googleAvatar;

}


/* =========================================================
   UPDATE FOOTER USER STATE
========================================================= */

function updateFooterUserState(profile = null){

  const upload =
    document.getElementById(
      "footerUpload"
    );

  const account =
    document.getElementById(
      "accountBtn"
    );

  if(!upload || !account) return;


  if(currentUser){

    /*
       Use supplied profile first.
       If not supplied, use cached profile.
    */

    let cached = {};

    try{

      const stored =
        localStorage.getItem(
          "bigula_user"
        );

      cached =
        stored
          ? JSON.parse(stored)
          : {};

    }catch(_){

      cached = {};

    }


    const userProfile =
      profile || cached || {};


    const username =
      String(

        userProfile?.username ||

        userProfile?.name ||

        userProfile?.full_name ||

        userProfile?.display_name ||

        currentUser.user_metadata?.user_name ||

        currentUser.user_metadata?.preferred_username ||

        currentUser.user_metadata?.name ||

        "Account"

      ).trim();


    const avatarUrl =
      getAvatarUrl(userProfile);


    account.classList.remove(
      "signed-out"
    );

    account.classList.add(
      "signed-in"
    );

    account.title =
      username;


    const label =
      account.querySelector(
        ".account-label"
      );

    if(label){

      label.textContent =
        username;

    }


    /*
       Replace the 👤 icon with
       the real avatar from users.
    */

    const icon =
      account.querySelector(
        ".account-icon"
      );

    if(icon){

      if(avatarUrl){

        icon.innerHTML = "";

        const img =
          document.createElement(
            "img"
          );

        img.src = avatarUrl;

        img.alt = username;

        img.loading = "eager";

        img.referrerPolicy =
          "no-referrer";

        img.onerror = () => {

          icon.innerHTML = "👤";

        };

        icon.appendChild(img);

      }else{

        icon.innerHTML = "👤";

      }

    }


    upload.classList.remove(
      "signed-out"
    );

    upload.classList.add(
      "signed-in"
    );

    upload.title =
      "Create / Upload";


  }else{

    account.classList.remove(
      "signed-in"
    );

    account.classList.add(
      "signed-out"
    );

    account.title =
      "Signup";


    const label =
      account.querySelector(
        ".account-label"
      );

    if(label){

      label.textContent =
        "Signup";

    }


    const icon =
      account.querySelector(
        ".account-icon"
      );

    if(icon){

      icon.innerHTML = "👤";

    }


    upload.classList.remove(
      "signed-in"
    );

    upload.classList.add(
      "signed-out"
    );

    upload.title =
      "Sign up to upload";

  }

}

async function requireSignIn(){

  if(currentUser) return true;

  try{

    const {
      data
    } =
      await supabase.auth.getSession();

    currentUser =
      data?.session?.user || null;

  }catch(_){

    currentUser = null;

  }


  if(currentUser){

    updateFooterUserState();

    return true;

  }


  alert(
    "Please sign in first."
  );

  window.location.href =
    "signup.html";

  return false;

========================================================= */

async function loadNotificationBadge(){

  const badge =
    document.getElementById(
      "notificationBadge"
    );

  if(!badge || !currentUser)
    return;


  let count = null;


  try{

    const first =
      await supabase
        .from("notifications")
        .select(
          "id",
          {
            count:"exact",
            head:true
          }
        )
        .eq(
          "user_id",
          currentUser.id
        );


    if(!first.error){

      count =
        first.count || 0;

    }else{

      const second =
        await supabase
          .from("notifications")
          .select(
            "id",
            {
              count:"exact",
              head:true
            }
          )
          .eq(
            "recipient_id",
            currentUser.id
          );

        count =
          second.count || 0;

      }

    }

  }catch(e){

    );

  }


  if(count === null)
    return;


  badge.textContent =
    count > 99
      ? "99+"
      : String(count);

  badge.style.display =
    count > 0
      ? "flex"
      : "none";

}


/* =========================================================
   PUBLIC VIDEO CHECK
========================================================= */

function isPublicVideo(video){

  const status =
    String(
      video.status ??
      video.visibility ??
      video.publish_status ??
      video.content_status ??
      ""
    )
      .toLowerCase()
      .trim();


  if(
    video.is_public === true ||
    video.public === true ||
    video.published === true
  )
    return true;


  if(
    video.is_public === false ||
    video.public === false ||
    video.published === false
  )
    return false;


  if(
    [
      "public",
      "published",
      "live",
      "active"
    ].includes(status)
  )
    return true;


  if(
    [
      "private",
      "draft",
      "unlisted",
      "blocked",
      "rejected",
      "pending",
      "processing",
      "deleted"
    ].includes(status)
  )
    return false;


  return true;

}


/* =========================================================
   CREATOR PROFILE
========================================================= */

function getCreatorNameFromProfile(profile){

  return String(

    profile?.name ||

    profile?.full_name ||

    profile?.display_name ||

    profile?.username ||

    "BIGULA Creator"

  ).trim();

}


function getCreatorName(video){

  const uid =
    video.creator_id ||
    video.user_id;

  const profile =
    uid
      ? creatorProfiles.get(uid)
      : null;


  return String(

    profile?.name ||

    profile?.full_name ||

    profile?.display_name ||

    profile?.username ||

    video.username ||

    "BIGULA Creator"

  ).trim();

}


/* =========================================================
   LOAD CREATOR PROFILES
========================================================= */

async function getCreatorProfiles(videos){

  const ids =
    [
      ...new Set(
        videos
          .map(
            v =>
              v.creator_id ||
              v.user_id
          )
          .filter(Boolean)
      )
    ];


  if(!ids.length)
    return;


  const {
    data,
    error
  } =
    await supabase
      .from("users")
      .select("*")
      .in(
        "id",
        ids
      );


  if(error){

    console.warn(
      "Could not fetch creator profiles:",
      error.message
    );

    return;

  }


  (data || []).forEach(
    profile => {

      creatorProfiles.set(
        profile.id,
        profile
      );

    }
  );

}


/* =========================================================
   FETCH VIDEOS
========================================================= */

async function fetchVideos(
  type = "foryou"
){

  activeFeedType = type;

  const feed =
    document.getElementById(
      "feed"
    );

  feed.classList.remove(
    "status-feed"
  );

  feed.innerHTML =
    `<div class="empty-message">
       Loading videos...
     </div>`;


  let query =
    supabase
      .from("videos")
      .select("*");


  if(type === "latest"){

    query =
      query.order(
        "created_at",
        {
          ascending:false
        }
      );

  }else if(type === "viral"){

    query =
      query.order(
        "views",
        {
          ascending:false
        }
      );

  }else{

    query =
      query.order(
        "created_at",
        {
          ascending:false
        }
      );

  }


  const {
    data,
    error
  } =
    await query;


  if(error){

    console.error(error);

    feed.innerHTML =
      `<div class="empty-message">
         Failed to load videos.
       </div>`;

    return;

  }


  const publicVideos =
    (data || [])
      .filter(isPublicVideo);


  allLoadedVideos =
    publicVideos;


  await getCreatorProfiles(
    publicVideos
  );


  /*
     Save creator profiles for
     search.
  */

  allLoadedCreators =
    [
      ...creatorProfiles.values()
    ];


  renderVideos(
    publicVideos
  );

}


/* =========================================================
   SEARCH
   =========================================================

   Search now works against BOTH:

     1. video title
     2. video description/caption
     3. creator name
     4. creator username
     5. creator display name

   If the creator matches, all public videos
   belonging to that creator are shown.
========================================================= */

async function searchBigula(term){

  const search =
    String(term || "")
      .trim()
      .toLowerCase();


  if(!search){

    /*
       Return to the current feed.
    */

    if(activeFeedType === "status"){

      await fetchStatuses();

    }else if(activeFeedType === "live"){

      await fetchLive();

    }else{

      await fetchVideos(
        activeFeedType
      );

    }

    return;

  }


  const feed =
    document.getElementById(
      "feed"
    );


  feed.classList.remove(
    "status-feed"
  );


  feed.innerHTML =
    `<div class="empty-message">
       Searching BIGULA...
     </div>`;


  try{

    /*
       Search creators directly in users.
       We use ilike so the search is
       case-insensitive.
    */

    const {
      data: creators,
      error: creatorError
    } =
      await supabase
        .from("users")
        .select("*")
        .or(
          [
            `name.ilike.%${escapePostgrest(search)}%`,
            `username.ilike.%${escapePostgrest(search)}%`,
            `full_name.ilike.%${escapePostgrest(search)}%`,
            `display_name.ilike.%${escapePostgrest(search)}%`
          ].join(",")
        )
        .limit(100);


    if(!creatorError){

      allLoadedCreators =
        creators || [];

      (creators || []).forEach(
        profile => {

          creatorProfiles.set(
            profile.id,
            profile
          );

        }
      );

    }


    /*
       Search videos directly.
       Some installations may not have
       description/caption columns, so
       the local search below remains
       important.
    */

    const {
      data: videos,
      error: videoError
    } =
      await supabase
        .from("videos")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(videoError)
      throw videoError;


    const publicVideos =
      (videos || [])
        .filter(isPublicVideo);


    await getCreatorProfiles(
      publicVideos
    );


    const creatorIds =
      new Set(
        (creators || [])
          .map(
            profile =>
              String(profile.id)
          )
      );


    const matchingVideos =
      publicVideos.filter(
        video => {

          const creatorId =
            String(
              video.creator_id ||
              video.user_id ||
              ""
            );


          const creator =
            creatorProfiles.get(
              creatorId
            );


          const creatorText =
            [

              creator?.name,

              creator?.username,

              creator?.full_name,

              creator?.display_name,

              video.username

            ]
              .filter(Boolean)
              .join(" ")
              .toLowerCase();


          const videoText =
            [

              video.title,

              video.description,

              video.caption,

              video.category,

              video.tags,

              video.username

            ]
              .filter(Boolean)
              .join(" ")
              .toLowerCase();


          return (

            creatorIds.has(
              creatorId
            )

            ||

            creatorText.includes(
              search
            )

            ||

            videoText.includes(
              search
            )

          );

        }
      );


    allLoadedVideos =
      matchingVideos;


    if(!matchingVideos.length){

      feed.innerHTML =
        `<div class="empty-message">
           No creators or videos found for
           "<strong>${escapeHtml(term)}</strong>".
         </div>`;

      return;

    }


    renderVideos(
      matchingVideos
    );


  }catch(error){

    console.error(
      "Search failed:",
      error
    );

    feed.innerHTML =
      `<div class="empty-message">
         Search could not be completed.
       </div>`;

  }

}


/*
   Protect PostgREST search strings.
*/

function escapePostgrest(value){

  return String(value)
    .replace(/\\/g,"\\\\")
    .replace(/,/g,"\\,")
    .replace(/\./g,"\\.")
    .replace(/\(/g,"\\(")
    .replace(/\)/g,"\\)");

}


/* =========================================================
   LIVE
========================================================= */

async function fetchLive(){

  activeFeedType = "live";

  const feed =
    document.getElementById(
      "feed"
    );

  feed.classList.remove(
    "status-feed"
  );

  feed.innerHTML =
    `<div class="empty-message">
       Loading live videos...
     </div>`;


  let query =
    supabase
      .from("videos")
      .select("*");


  query =
    query.or(
      "is_live.eq.true,live.eq.true,status.eq.live"
    );


  const {
    data,
    error
  } =
    await query.order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.warn(
      "Live query failed:",
      error.message
    );

    feed.innerHTML =
      `<div class="empty-message">
         No users are live right now.
       </div>`;

    return;

  }


  const live =
    (data || [])
      .filter(
        v =>
          v.is_live === true ||
          v.live === true ||
          String(
            v.status || ""
          ).toLowerCase() === "live"
      );


  if(!live.length){

    feed.innerHTML =
      `<div class="empty-message">
         No users are live right now.
       </div>`;

    return;

  }


  allLoadedVideos =
    live;


  await getCreatorProfiles(
    live
  );


  renderVideos(live);

}


/* =========================================================
   STATUS
========================================================= */

async function fetchStatuses(){

  activeFeedType = "status";

  const feed =
    document.getElementById(
      "feed"
    );

  feed.classList.add(
    "status-feed"
  );

  feed.innerHTML =
    `<div class="empty-message">
       Loading statuses...
     </div>`;


  if(!currentUser){

    location.replace(
      "signup.html"
    );

    return;

  }


  const {
    data:follows,
    error:followError
  } =
    await supabase
      .from("followers")
      .select("following_id")
      .eq(
        "follower_id",
        currentUser.id
      );


  if(followError){

    feed.innerHTML =
      `<div class="empty-message">
         Could not load followed users' statuses.
       </div>`;

    return;

  }


  const ids =
    (follows || [])
      .map(
        x => x.following_id
      )
      .filter(Boolean);


  if(!ids.length){

    feed.innerHTML =
      `<div class="empty-message">
         Follow creators to see their statuses here.
       </div>`;

    return;

  }


  const result =
    await supabase
      .from("statuses")
      .select("*")
      .in(
        "user_id",
        ids
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(result.error){

    console.warn(
      "statuses table unavailable:",
      result.error.message
    );

    feed.innerHTML =
      `<div class="empty-message">
         No statuses available yet.
       </div>`;

    return;

  }


  const statuses =
    result.data || [];


  if(!statuses.length){

    feed.innerHTML =
      `<div class="empty-message">
         No new statuses from followed users.
       </div>`;

    return;

  }


  await getCreatorProfiles(
    statuses.map(
      x => ({
        creator_id:x.user_id
      })
    )
  );


  feed.innerHTML = "";


  statuses.forEach(
    status => {

      const uid =
        status.user_id;

      const profile =
        creatorProfiles.get(
          uid
        ) || {};


      const name =
        getCreatorNameFromProfile(
          profile
        );


      const text =
        String(
          status.text ||
          status.content ||
          status.caption ||
          ""
        );


      const avatar =
        getAvatarUrl(
          profile
        );


      const item =
        document.createElement(
          "div"
        );

      item.className =
        "status-card";


      item.innerHTML = `

        <div class="status-avatar">

          ${
            avatar

            ?

            `<img
               src="${escapeHtml(avatar)}"
               alt=""
               loading="lazy"
             >`

            :

            escapeHtml(
              name
                .charAt(0)
                .toUpperCase()
            )

          }

        </div>

        <div class="status-content">

          <div class="status-name">
            ${escapeHtml(name)}
          </div>

          <div class="status-text">
            ${escapeHtml(text)}
          </div>

          <div class="status-time">
            ${
              status.created_at
                ? new Date(
                    status.created_at
                  ).toLocaleString()
                : "Recent"
            }
          </div>

        </div>
      `;


      item.addEventListener(
        "click",
        () => openProfile(uid)
      );


      feed.appendChild(item);

    }
  );

}


/* =========================================================
   COUNTS
========================================================= */

async function getCounts(videoId){

  const [

    { count:likes },

    { count:comments },

    { count:views }

  ] =
    await Promise.all([

      supabase
        .from("likes")
        .select(
          "id",
          {
            head:true,
            count:"exact"
          }
        )
        .eq(
          "video_id",
          videoId
        ),

      supabase
        .from("comments")
        .select(
          "id",
          {
            head:true,
            count:"exact"
          }
        )
        .eq(
          "video_id",
          videoId
        ),

      supabase
        .from("views")
        .select(
          "id",
          {
            head:true,
            count:"exact"
          }
        )
        .eq(
          "video_id",
          videoId
        )

    ]);


  return {

    likes:
      likes || 0,

    comments:
      comments || 0,

    views:
      views || 0

  };

}

  );

    feed.innerHTML =
      `<div class="empty-message">
         No public videos available.
       </div>`;

  await getCreatorProfiles(
    videos
  );


  for(const video of videos){

    const counts =
      await getCounts(
        video.id
      );


    const card =
      document.createElement(
        "div"

    card.className =
      "video-card";


    card.dataset.id =
      video.id;


    card.dataset.creatorId =
      String(
        video.creator_id ||
        video.user_id ||
        ""
      );


    card.dataset.shortCode =
      video.short_code ||
      video.shortCode ||
      "";


    const videoUrl =
      String(
        video.video_url ||
        video.url ||
        ""
      );

      getCreatorName(
        video

      String(
        video.title || ""
      );


    const creatorId =
      String(

        video.user_id ||
        ""
      );

        )
      );

      <div class="video-stage">

        <video
          src="${escapeHtml(videoUrl)}"
          autoplay
          muted
          playsinline
          preload="auto"
        ></video>

        ${
          title

            ?

            `<div class="title-overlay">
               ${escapeHtml(title)}
             </div>`

            :

            ""
        }

      </div>


      <div class="meta-overlay">

        <div class="user-row">

          <span
            class="username"
            title="${escapeHtml(creatorName)}"
            data-action="profile"
          >
            ${escapeHtml(creatorName)}
          </span>


          <button
            class="follow-btn"
            type="button"
            data-action="follow"
          >
            Follow
          </button>


          ${
            video.is_live ||
            video.live

              ?

              `
              <span class="live-badge">
                <span class="live-dot"></span>
                LIVE

              `

              :

              ""
          }

        </div>


        <div class="video-actions">

          <div
            class="stat-btn"

          >
            <span aria-hidden="true">♡</span>
            <span id="like-${video.id}">
              ${counts.likes}
            </span>
          </div>


          <div
            class="stat-btn"
            data-action="comments"
            title="Comments"
          >
            <span aria-hidden="true">💬</span>
            <span id="commentCount-${video.id}">
              ${counts.comments}
            </span>
          </div>


          <button
            class="views-btn"
            type="button"
            title="Views"
          >
            ▶ ${counts.views}
          </button>


          <button
            class="share-btn"
            type="button"
            data-action="share"
          >
            ↗ Share
          </button>


          <div class="share-options">

            <button
              type="button"
              data-action="status"
            >
              Bigula Status
            </button>

            <button
              type="button"
              data-action="whatsapp"
            >
              WhatsApp
            </button>

        </div>

    `;


    feed.appendChild(

    );


    bindCardActions(
      card
    );


    setupVideo(
      card
    );

  }


  setupAutoplay();

}


/* =========================================================
   CARD ACTIONS
========================================================= */

function bindCardActions(card){

  const creatorId =
    card.dataset.creatorId ||
    "";


  const videoId =
    card.dataset.id;


  card
    .querySelector(
      ".username"
    )
    ?.addEventListener(
      "click",
      () => openProfile(
        creatorId
      )
    );


  card
    .querySelector(
      '[data-action="like"]'
    )
    ?.addEventListener(
      "click",
      async e => {

        if(
          await requireSignIn()
        ){

          await toggleLike(
            videoId,
            e.currentTarget
          );

        }

      }
    );


  card
    .querySelector(
      '[data-action="comments"]'
    )
    ?.addEventListener(
      "click",
      async () => {

        if(
          await requireSignIn()
        ){

          await openComments(
            videoId
          );

        }

      }
    );


  card
    .querySelector(
      '[data-action="follow"]'
    )
    ?.addEventListener(
      "click",
      async e => {

        if(
          await requireSignIn()
        ){

          await followUser(
            creatorId,
            e.currentTarget
          );

        }

      }
    );


  card
    .querySelector(
      '[data-action="share"]'
    )
    ?.addEventListener(
      "click",
      e =>
        toggleShare(
          e.currentTarget
        )
    );


  card
    .querySelector(
      '[data-action="status"]'
    )
    ?.addEventListener(
      "click",
      () =>
        shareStatus(
          videoId,
          getCreatorNameFromCard(
            card
          )
        )
    );


  card
    .querySelector(
      '[data-action="whatsapp"]'
    )
    ?.addEventListener(
      "click",
      () =>
        shareWhatsApp(
          videoId,
          getCreatorNameFromCard(
            card
          ),
          card.querySelector(
            ".title-overlay"
          )?.textContent || ""
        )

/* =========================================================
   VIDEO PLAYER
========================================================= */

function setupVideo(card){

  const video =
    card.querySelector(
      "video"
    );


  if(!video) return;


  let lastTap = 0;

  let viewRecorded =
    false;

  let maxWatched =
    0;


  /*
     When one video starts,
     pause every other video.
  */

  video.addEventListener(
    "play",
    () => {

      document
        .querySelectorAll(
          "#feed video"
        )
        .forEach(
          other => {

            if(
              other !== video
            ){

              other.pause();

            }

          }
        );

    }
  );


  /*
     Single tap = play/pause.
     Double tap = like.
  */

  video.addEventListener(
    "click",
    async e => {

      if(
        e.target !== video
      )
        return;


      const now =
        Date.now();


      if(
        now - lastTap < 350
      ){

        e.preventDefault();


        if(
          await requireSignIn()
        ){

          await toggleLike(
            card.dataset.id,
            card.querySelector(
              '[data-action="like"]'
            )
          );

        }


        lastTap = 0;

        return;

      }


      lastTap =
        now;


      setTimeout(
        () => {

          if(
            lastTap === now
          ){

            if(
              video.paused
            ){

              video
                .play()
                .catch(
                  () => {}
                );

            }else{

              video.pause();

            }

          }

        },
        350
      );

    }
  );


  /*
     Record a view after 50%
     watched.
  */

  video.addEventListener(
    "timeupdate",
    async () => {

      if(
        viewRecorded ||
        !isFinite(video.duration) ||
        video.duration <= 0
      )
        return;


      maxWatched =
        Math.max(
          maxWatched,
          video.currentTime
        );


      if(
        maxWatched >=
        video.duration * .5
      ){

        viewRecorded = true;


        const ok =
          await registerCompletedView(
            card.dataset.id
          );


        if(ok){

          const button =
            card.querySelector(
              ".views-btn"
            );


          if(button){

            const match =
              button.textContent
                .match(/\d+/);


            const current =
              match
                ? parseInt(
                    match[0],
                    10
                  )
                : 0;


            button.textContent =
              `▶ ${current + 1}`;

          }

        }else{

          viewRecorded =
            false;

        }

      }

    }
  );


  /*
     When video ends, go to
     the next complete card.
  */

  video.addEventListener(
    "ended",
    async () => {

      if(!viewRecorded){

        viewRecorded = true;


        const ok =
          await registerCompletedView(
            card.dataset.id
          );


        if(ok){

          const button =
            card.querySelector(
              ".views-btn"
            );


          if(button){

            const match =
              button.textContent
                .match(/\d+/);


            const current =
              match
                ? parseInt(
                    match[0],
                    10
                  )
                : 0;


            button.textContent =
              `▶ ${current + 1}`;

          }

        }

      }


      const next =
        card.nextElementSibling;


      if(next){

        next.scrollIntoView({
          behavior:"smooth",
          block:"start"
        });

      }

    }
  );


  /*
     Swipe left opens video_view.html.
  */

  let sx = null;
  let sy = null;


  video.addEventListener(
    "touchstart",
    e => {

      if(
        e.touches.length === 1
      ){

        sx =
          e.touches[0].clientX;

        sy =
          e.touches[0].clientY;

      }

    },
    {
      passive:true
    }
  );


  video.addEventListener(
    "touchend",
    e => {

      if(sx === null)
        return;


      const dx =
        e.changedTouches[0].clientX -
        sx;


      const dy =
        e.changedTouches[0].clientY -
        sy;


      sx = null;
      sy = null;


      if(
        dx < -70 &&
        Math.abs(dx) >
          Math.abs(dy) * 1.25
      ){

        const sc =
          card.dataset.shortCode;


        if(sc){

          location.href =
            `video_view.html?v=${encodeURIComponent(sc)}`;

        }

      }

    },
    {
      passive:true
    }
  );

}

async function registerCompletedView(
  videoId
){

  if(
    !currentUser ||
    !navigator.onLine
  )
    return false;


  const {
    error
  } =
    await supabase
      .from("views")

      });

    console.warn(
      "View could not be recorded:",
      error.message
    );

    return false;

  }


  return true;

}


/* =========================================================
   AUTOPLAY
========================================================= */

function setupAutoplay(){

  const videos =
    document.querySelectorAll(
      "#feed video"
    );


  const observer =
    new IntersectionObserver(
      entries => {

        entries.forEach(
          entry => {

            const video =
              entry.target;


            if(
              entry.isIntersecting &&
              entry.intersectionRatio >= .7
            ){

              videos.forEach(
                other => {

                  if(
                    other !== video
                  )
                    other.pause();

                }
              );


              /*
                 Try sound first.
                 If browser blocks autoplay
                 with sound, retry muted.
              */

              video.muted =
                false;

              video.volume =
                1;


              video
                .play()
                .catch(
                  () => {

                    video.muted =
                      true;

                    video
                      .play()
                      .catch(
                        () => {}
                      );

                  }
                );

            }else{

              video.pause();

            }

          }
        );

      },
      {
        threshold:[
          0,
          .7
        ]
      }
    );


  videos.forEach(
    video =>
      observer.observe(
        video
      )
  );


  /*
     First user interaction
     unlocks playback.
  */

  const unlock =
    () => {

      const active =
        [
          ...document.querySelectorAll(
            "#feed video"
          )
        ].find(
          video => {

            const rect =
              video.getBoundingClientRect();


            return (
              rect.top <
                innerHeight * .65 &&

              rect.bottom >
                innerHeight * .35
            );

          }
        );


      if(active){

        document
          .querySelectorAll(
            "#feed video"
          )
          .forEach(
            video => {

              if(
                video !== active
              )
                video.pause();

            }
          );


        active.muted =
          false;

        active.volume =
          1;

        active
          .play()
          .catch(
            () => {}
          );

      }

    };


  document.addEventListener(
    "pointerdown",
    unlock,
    {
      once:true,
      passive:true
    }
  );

}

function encodeVideoToken(id){

  const bytes =
    new TextEncoder()
      .encode(
        String(id)
      );


  let binary = "";


  bytes.forEach(
    b =>
      binary +=
        String.fromCharCode(b)
  );


  return btoa(binary)
    .replace(/\+/g,"-")
    .replace(/\//g,"_")
    .replace(/=+$/g,"");

}


function createVideoShareUrl(
  videoId
){

  const video =
    [
      ...document.querySelectorAll(
        ".video-card"
      )
    ].find(
      card =>
        card.dataset.id ===
        String(videoId)
    );


  const shortCode =
    video?.dataset.shortCode;


  if(shortCode){

    return new URL(
      `video_view.html?v=${encodeURIComponent(shortCode)}`,
      window.location.href
    ).href;

  }


  const token =
    encodeVideoToken(
      videoId
    );


  return new URL(
    `video_view.html?v=${token}`,
    window.location.href
  ).href;

}

/* =========================================================
   LIKE
========================================================= */

async function toggleLike(
  videoId,
  btn
){

  if(!currentUser)
    return false;


  if(!navigator.onLine){

    alert(
      "Turn on data or connect to your Wi-Fi to like this video."
    );

    return false;

  }


  const el =
    document.getElementById(
      `like-${videoId}`
    );


  if(!el)
    return false;


  const {
    data:exists,
    error:checkError
  } =
    await supabase
      .from("likes")
      .select("id")
      .eq(
        "video_id",
        videoId
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .limit(1);


  if(checkError){

    console.warn(
      "Like check failed:",
      checkError.message
    );

    return false;

  }


  if(exists?.length){

    const {
      error
    } =
      await supabase
        .from("likes")
        .delete()
        .eq(
          "video_id",
          videoId
        )
        .eq(
          "user_id",
          currentUser.id
        );


    if(error){

      console.warn(
        "Unlike failed:",
        error.message
      );

      return false;

    }


    el.textContent =
      Math.max(
        0,
        parseInt(
          el.textContent || "0",
          10
        ) - 1
      );


  }else{

    const {
      error
    } =
      await supabase
        .from("likes")
        .insert({

          video_id:
            videoId,

          user_id:
            currentUser.id

        });


    if(error){

      console.warn(
        "Like could not be recorded:",
        error.message
      );

      return false;

    }


    el.textContent =
      parseInt(
        el.textContent || "0",
        10
      ) + 1;

  }


  return true;

}

          div

    );

  }

}

/* =========================================================
   FOOTER NAVIGATION
========================================================= */

document.addEventListener(
  "click",
  async function(e){

    const btn =
      e.target.closest(
        "#footerUpload, #notifBtn, #accountBtn"
      );


    if(!btn)
      return;


    e.preventDefault();
    e.stopPropagation();


    let sessionUser =
      null;


    try{

      const params =
        new URLSearchParams(
          window.location.search
        );


      const code =
        params.get("code");


      if(code){

        const result =
          await supabase.auth
            .exchangeCodeForSession(
              code
            );


        if(result.error)
          throw result.error;


        sessionUser =
          result.data?.session?.user ||
          null;


        history.replaceState(
          {},
          document.title,
          window.location.pathname
        );

      }else{

        const result =
          await supabase.auth
            .getSession();


        sessionUser =
          result.data?.session?.user ||
          null;

      }

    }catch(error){

      console.warn(
        "Footer sign-in check failed:",
        error
      );

    }


    if(!sessionUser){

      if(
        btn.id ===
        "accountBtn"
      ){

        location.href =
          "signup.html";

        return;

      }


      alert(
        "Please sign in first to upload videos."
      );


      location.href =
        "signup.html";


      return;

    }


    currentUser =
      sessionUser;


    updateFooterUserState();


    if(
      btn.id ===
      "footerUpload"
    ){

      location.href =
        "upload.html";

    }


    if(
      btn.id ===
      "notifBtn"
    ){

      location.href =
        "notifications.html";

    }


    if(
      btn.id ===
      "accountBtn"
    ){

      location.href =
        "account.html";

    }

  },
  true
);

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
