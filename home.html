<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>BIGULA — Home</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",Arial,sans-serif;
}

html,
body{
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  overflow:hidden;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

/* =========================================================
   APP
========================================================= */

#app{
  width:100%;
  height:100%;
  position:relative;
  background:#000;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:62px;
  z-index:50;

  display:flex;
  align-items:center;
  gap:10px;

  padding:8px 12px;

  background:rgba(0,0,0,.92);
  backdrop-filter:blur(10px);
}

.logo{
  width:42px;
  height:42px;
  object-fit:contain;
  flex-shrink:0;
  border-radius:10px;
  display:block;
}

.search-wrap{
  flex:1;
  min-width:0;
  position:relative;
}

#search{
  width:100%;
  height:40px;

  border:1px solid #333;
  border-radius:22px;

  background:#171717;
  color:#fff;

  padding:0 16px;

  outline:none;
}

#search::placeholder{
  color:#888;
}

#search:focus{
  border-color:#777;
}

.search-clear{
  position:absolute;
  right:8px;
  top:6px;

  width:28px;
  height:28px;

  border:0;
  border-radius:50%;

  background:#333;
  color:#fff;

  display:none;
}

/* =========================================================
   TABS
========================================================= */

.tabs{
  position:fixed;
  top:62px;
  left:0;
  right:0;

  height:48px;

  z-index:49;

  display:flex;
  align-items:center;

  background:rgba(0,0,0,.94);
  border-bottom:1px solid #222;

  overflow-x:auto;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  height:48px;

  min-width:20%;

  padding:0 15px;

  border:0;
  background:none;

  color:#888;

  font-size:14px;
  font-weight:700;

  white-space:nowrap;
}

.tab.active{
  color:#fff;
  position:relative;
}

.tab.active::after{
  content:"";

  position:absolute;

  left:18px;
  right:18px;
  bottom:0;

  height:3px;

  border-radius:3px;

  background:#fff;
}

/* =========================================================
   FEED
========================================================= */

#feed{
  position:absolute;

  top:0;
  bottom:0;

  left:0;
  right:0;

  height:100dvh;

  overflow-y:auto;
  overflow-x:hidden;

  scroll-snap-type:y mandatory;
  scroll-behavior:smooth;

  scrollbar-width:none;

  background:#000;
}

#feed::-webkit-scrollbar{
  display:none;
}

.feed-card{
  width:100%;
  height:100dvh;
  min-height:100dvh;

  position:relative;

  scroll-snap-align:start;
  scroll-snap-stop:always;
  scroll-margin:0;

  background:#000;

  overflow:hidden;
}

.video{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  background:#000;
}

/* =========================================================
   VIDEO OVERLAYS
========================================================= */

.video-shade{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:45%;

  pointer-events:none;

  background:linear-gradient(
    transparent,
    rgba(0,0,0,.75)
  );
}

.video-loading{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  font-size:13px;
  color:#aaa;
}

.pause-indicator{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%) scale(.7);

  width:72px;
  height:72px;

  border-radius:50%;

  background:rgba(0,0,0,.65);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:30px;

  opacity:0;
  pointer-events:none;

  transition:.15s;
}

.pause-indicator.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

/* =========================================================
   VIDEO INFO
========================================================= */

.video-info{
  position:absolute;

  left:14px;
  right:94px;
  bottom:24px;

  z-index:5;
}

.creator-line{
  display:flex;
  align-items:center;
  gap:9px;

  margin-bottom:9px;
}

.creator-avatar{
  width:39px;
  height:39px;

  border-radius:50%;

  background:#222;

  overflow:hidden;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:800;
}

.creator-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.creator-name{
  font-size:15px;
  font-weight:800;
}

.creator-badge{
  font-size:10px;
  padding:3px 6px;

  border-radius:7px;

  background:#fff;
  color:#000;

  font-weight:800;
}

.follow-btn{
  border:1px solid rgba(255,255,255,.7);

  background:rgba(0,0,0,.4);
  color:#fff;

  border-radius:8px;

  padding:5px 9px;

  font-size:11px;
  font-weight:800;
}

.follow-btn.following{
  background:#fff;
  color:#000;
}

.video-title{
  font-size:16px;
  font-weight:700;

  line-height:1.35;

  margin-bottom:5px;
}

.video-description{
  font-size:13px;

  line-height:1.35;

  color:#ddd;

  max-height:54px;

  overflow:hidden;
}

/* =========================================================
   SIDE ACTIONS
========================================================= */

.actions{
  position:absolute;

  right:14px;
  top:50%;
  transform:translateY(-50%);

  z-index:7;

  width:54px;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:14px;
}

.action{
  border:0;
  background:none;
  color:#fff;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;

  text-shadow:0 1px 5px #000;
}

.action-icon{
  width:42px;
  height:42px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.45);

  font-size:21px;
}

.action-count{
  font-size:10px;
  font-weight:700;
}

.like-button.liked .action-icon{
  color:#ff3b5f;
}

.comment-button .action-icon{
  font-size:20px;
}

.share-button .action-icon{
  font-size:19px;
}

/* =========================================================
   DOUBLE TAP HEART
========================================================= */

.double-heart{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%) scale(.3);

  font-size:92px;

  opacity:0;

  pointer-events:none;

  z-index:20;
}

.double-heart.animate{
  animation:heartPop .75s ease forwards;
}

@keyframes heartPop{

  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.3);
  }

  20%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.15);
  }

  60%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }

  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.35);
  }

}

/* =========================================================
   FOOTER
========================================================= */

.footer{
  position:fixed;

  left:10px;
  right:10px;
  bottom:10px;

  height:66px;
  padding:5px;
  padding-bottom:calc(5px + env(safe-area-inset-bottom));

  z-index:60;

  background:rgba(12,12,12,.94);
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;

  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;

  box-sizing:border-box;

  box-shadow:0 8px 30px rgba(0,0,0,.45);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.footer-btn{
  border:0;
  background:transparent;

  color:#8c8c8c;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:4px;

  border-radius:13px;

  font-size:11px;
  font-weight:700;

  transition:
    background .18s ease,
    color .18s ease,
    transform .18s ease;
}

.footer-btn:active{
  transform:scale(.95);
}

.footer-btn.active,
.footer-btn:hover{
  color:#fff;
  background:rgba(255,255,255,.08);
}

.footer-icon{
  width:28px;
  height:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:22px;
  line-height:1;
}

.account-avatar{
  width:28px;
  height:28px;

  border-radius:50%;

  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#222;

  font-size:16px;
}

.account-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.notification-wrap{
  position:relative;
}

.notification-badge{
  position:absolute;

  top:-3px;
  right:-12px;

  min-width:17px;
  height:17px;

  border-radius:10px;

  padding:0 4px;

  background:#ff3157;
  color:#fff;

  font-size:9px;

  display:none;
  align-items:center;
  justify-content:center;
}

/* =========================================================
   STATES
========================================================= */

.center-message{
  width:100%;
  min-height:100%;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  color:#888;

  padding:30px;
}

.center-message strong{
  color:#fff;
  font-size:18px;
  margin-bottom:7px;
}

.center-message button{
  margin-top:15px;

  padding:10px 17px;

  border:0;
  border-radius:10px;

  background:#fff;
  color:#000;

  font-weight:800;
}

/* =========================================================
   COMMENTS OVERLAY
========================================================= */

#commentsOverlay{
  position:fixed;

  inset:0;

  z-index:200;

  background:rgba(0,0,0,.68);

  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);

  display:none;

  align-items:flex-end;
}

#commentsOverlay.open{
  display:flex;
}

.comments-panel{
  width:100%;

  height:min(88dvh,760px);
  max-height:88dvh;

  background:linear-gradient(
    180deg,
    #ffffff 0%,
    #f7f7f8 100%
  );

  color:#111;

  border:1px solid rgba(255,255,255,.9);

  border-radius:28px 28px 0 0;

  box-shadow:
    0 -18px 60px rgba(0,0,0,.38);

  display:flex;
  flex-direction:column;

  overflow:hidden;

  animation:commentsUp .2s ease;
}

@keyframes commentsUp{

  from{
    transform:translateY(100%);
  }

  to{
    transform:translateY(0);
  }

}

/* =========================================================
   COMMENT HEADER
========================================================= */

.comments-header{
  flex-shrink:0;

  padding:17px 16px 12px;

  border-bottom:1px solid #e7e7e7;

  background:rgba(255,255,255,.96);
}

.comment-top{
  display:flex;

  align-items:center;
  justify-content:space-between;
}

.comment-heading{
  font-size:18px;

  font-weight:950;

  letter-spacing:.4px;
}

.comment-close{
  width:34px;
  height:34px;

  border:0;

  border-radius:50%;

  background:#f0f0f0;

  font-size:20px;
}

.comment-subheading{
  font-size:12px;

  color:#777;

  margin-top:4px;
}

/* =========================================================
   REACTION STRIP
========================================================= */

.reactions{
  display:flex;

  gap:7px;

  margin-top:12px;

  overflow-x:auto;

  scrollbar-width:none;
}

.reactions::-webkit-scrollbar{
  display:none;
}

.reaction{
  flex-shrink:0;

  border:1px solid #e4e4e4;

  background:#fafafa;

  border-radius:20px;

  padding:6px 10px;

  font-size:14px;
}

/* =========================================================
   COMMENT SORT
========================================================= */

.comment-sort{
  display:flex;

  gap:8px;

  margin-top:10px;
}

.sort-btn{
  border:0;

  background:#f1f1f1;

  border-radius:15px;

  padding:6px 10px;

  font-size:11px;

  font-weight:700;

  color:#666;
}

.sort-btn.active{
  background:#111;
  color:#fff;
}

/* =========================================================
   COMMENTS LIST
========================================================= */

#commentsList{
  flex:1;

  min-height:0;

  overflow-y:auto;

  overscroll-behavior:contain;

  padding:12px 14px 18px;

  scrollbar-width:none;
}

#commentsList::-webkit-scrollbar{
  display:none;
}

.comment{
  display:flex;

  gap:10px;

  padding:10px 9px;

  margin-bottom:7px;

  border-radius:17px;

  background:#fff;

  border:1px solid #ececef;

  box-shadow:
    0 2px 10px rgba(0,0,0,.035);
}

.comment-avatar{
  width:38px;
  height:38px;

  border-radius:50%;

  overflow:hidden;

  flex-shrink:0;

  background:#e8e8e8;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:900;

  color:#444;
}

.comment-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.comment-body{
  min-width:0;
  flex:1;
}

.comment-author-line{
  display:flex;
  align-items:center;
  flex-wrap:wrap;

  gap:6px;

  margin-bottom:4px;
}

.comment-author{
  font-size:13px;

  font-weight:900;

  color:#111;
}

.comment-time{
  font-size:10px;

  color:#999;
}

.comment-creator{
  font-size:9px;

  padding:2px 5px;

  border-radius:6px;

  background:#111;

  color:#fff;

  font-weight:800;
}

.comment-text{
  font-size:13px;

  line-height:1.4;

  color:#222;

  word-break:break-word;
}

.comment-meta{
  display:flex;

  align-items:center;

  gap:13px;

  margin-top:6px;
}

.comment-action{
  border:0;

  background:none;

  color:#777;

  padding:0;

  font-size:10px;

  font-weight:700;
}

.comment-action:hover{
  color:#111;
}

.comment-action.reacted{
  color:#e51d48;
}

.reply-list{
  margin-top:8px;

  margin-left:5px;

  padding-left:10px;

  border-left:2px solid #e5e5e8;
}

.reply{
  margin-top:9px;

  padding:8px;

  border-radius:14px;

  background:#f5f5f7;
}

.reply .comment-avatar{
  width:32px;
  height:32px;
}

.reply .comment-text{
  font-size:12px;
}

.reply .comment-meta{
  margin-top:5px;
}

.pin-label{
  font-size:9px;

  color:#777;

  font-weight:800;

  margin-bottom:4px;
}

.comments-empty{
  padding:55px 20px;

  text-align:center;

  color:#777;
}

.comments-empty strong{
  display:block;

  color:#111;

  font-size:16px;

  margin-bottom:5px;
}

.comments-empty span{
  display:block;

  font-size:12px;

  line-height:1.45;
}

/* =========================================================
   COMMENT COMPOSER
========================================================= */

.comment-composer{
  flex-shrink:0;

  border-top:1px solid #eee;

  padding:10px;

  background:#fff;

  display:flex;

  gap:8px;

  align-items:flex-end;
}

.composer-avatar{
  width:34px;
  height:34px;

  border-radius:50%;

  flex-shrink:0;

  background:#111;
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:12px;
  font-weight:800;

  overflow:hidden;
}

.composer-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

#commentInput{
  flex:1;

  min-width:0;

  min-height:40px;
  max-height:100px;

  resize:none;

  border:1px solid #ddd;

  border-radius:20px;

  padding:10px 14px;

  outline:none;

  font-size:14px;
}

#commentInput:focus{
  border-color:#111;
}

#commentSend{
  width:40px;
  height:40px;

  border:0;
  border-radius:50%;

  background:#111;
  color:#fff;

  font-size:17px;

  flex-shrink:0;
}

#commentSend:disabled{
  opacity:.4;
}

/* =========================================================
   REPLY BAR
========================================================= */

#replyBar{
  display:none;

  padding:7px 12px;

  background:#f5f5f5;

  border-top:1px solid #eee;

  font-size:11px;

  color:#555;
}

#replyBar.show{
  display:flex;

  align-items:center;
  justify-content:space-between;
}

#cancelReply{
  border:0;
  background:none;

  font-weight:800;

  font-size:11px;
}

/* =========================================================
   SEARCH RESULTS
========================================================= */

.search-result{
  height:100%;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  padding:30px;

  text-align:center;
}

.search-result h2{
  margin-bottom:8px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px){

  .topbar{
    height:58px;
  }

  .tabs{
    top:58px;
  }

  #feed{
    top:0;
    bottom:0;
    height:100dvh;
  }

  .feed-card{
    height:100dvh;
    min-height:100dvh;
  }

  .video-info{
    left:12px;
    right:88px;
    bottom:78px;
  }

  .actions{
    right:7px;
    top:50%;
    bottom:auto;
    transform:translateY(-50%);
    gap:11px;
  }

  .action-icon{
    width:39px;
    height:39px;
  }

  .footer{
    left:7px;
    right:7px;
    bottom:7px;
    height:64px;
  }

  .comments-panel{
    height:91dvh;
    max-height:91dvh;
    border-radius:24px 24px 0 0;
  }

}
</style>
</head>

<body>

<div id="app">

<header class="topbar">

  <img
    class="logo"
    src="https://bit.ly/4rgV7E7"
    alt="BIGULA"
    onerror="this.onerror=null;this.src='https://afrixx-app.github.io/live/logo.png';"
  >

  <div class="search-wrap">

    <input
      id="search"
      type="search"
      autocomplete="off"
      placeholder="Search BIGULA"
    >

    <button
      id="searchClear"
      class="search-clear"
    >×</button>

  </div>

</header>

<nav class="tabs">

  <button class="tab active" data-tab="foryou">
    For You
  </button>

  <button class="tab" data-tab="latest">
    Latest
  </button>

  <button class="tab" data-tab="viral">
    Viral
  </button>

  <button class="tab" data-tab="live">
    Live
  </button>

  <button class="tab" data-tab="status">
    Status
  </button>

</nav>

<main id="feed">

  <div class="center-message">
    Loading BIGULA…
  </div>

</main>

<footer class="footer">

  <button
    class="footer-btn"
    id="uploadBtn"
  >
    <span class="footer-icon">＋</span>
    Upload
  </button>

  <button
    class="footer-btn"
    id="notificationsBtn"
  >
    <span class="footer-icon notification-wrap">
      ♡

      <span
        id="notificationBadge"
        class="notification-badge"
      >0</span>

    </span>

    Notifications

  </button>

  <button
    class="footer-btn"
    id="accountBtn"
  >

    <span
      class="footer-icon account-avatar"
      id="accountAvatar"
    >
      <span class="account-avatar-fallback">
        ●
      </span>
    </span>

    Account

  </button>

</footer>

</div>

<!-- =======================================================
     BIGULA CONVERSATIONS
======================================================= -->

<div id="commentsOverlay">

<section class="comments-panel">

<div class="comments-header">

  <div class="comment-top">

    <div>

      <div class="comment-heading">
        CONVERSATIONS
      </div>

      <div
        id="commentSubheading"
        class="comment-subheading"
      >
        Join the conversation
      </div>

    </div>

    <button
      id="commentClose"
      class="comment-close"
    >
      ×
    </button>

  </div>

  <div class="reactions">

    <button class="reaction" data-reaction="😂">
      😂
    </button>

    <button class="reaction" data-reaction="❤️">
      ❤️
    </button>

    <button class="reaction" data-reaction="🔥">
      🔥
    </button>

    <button class="reaction" data-reaction="👀">
      👀
    </button>

    <button class="reaction" data-reaction="👏">
      👏
    </button>

    <button class="reaction" data-reaction="🤣">
      🤣
    </button>

  </div>

  <div class="comment-sort">

    <button
      class="sort-btn active"
      data-sort="interesting"
    >
      Interesting
    </button>

    <button
      class="sort-btn"
      data-sort="newest"
    >
      Newest
    </button>

  </div>

</div>

<div id="replyBar">

  <span>
    Replying to
    <strong id="replyName"></strong>
  </span>

  <button id="cancelReply">
    Cancel
  </button>

</div>

<div id="commentsList">

function esc(value){

    value ??
    ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )

}


/* =========================================================
   FORMAT COUNT
========================================================= */

function formatCount(
  value
){

  const n =
  Number(value || 0);

  if(n >= 1000000)
    return (
      (n / 1000000)
      .toFixed(
        n >= 10000000
        ? 0
        : 1
      )
      .replace(
        ".0",
        ""
      ) +
      "M"
    );

  if(n >= 1000)
    return (
      (n / 1000)
      .toFixed(
        n >= 10000
        ? 0
        : 1
      )
      .replace(
        ".0",
        ""
      ) +
      "K"
    );

  return String(n);

}


/* =========================================================
   TIME AGO
========================================================= */

function timeAgo(
  date
){

  if(!date)
    return "";

  const time =
  new Date(date).getTime();

  if(
    Number.isNaN(time)
  )
    return "";

  const diff =
  Math.max(
    0,
    Date.now() - time
  );

  const minute =
  60000;

  const hour =
  minute * 60;

  const day =
  hour * 24;

  const week =
  day * 7;

  if(diff < minute)
    return "now";

  if(diff < hour)
    return (
      Math.floor(
        diff / minute
      ) + "m"
    );

  if(diff < day)
    return (
      Math.floor(
        diff / hour
      ) + "h"
    );

  if(diff < week)
    return (
      Math.floor(
        diff / day
      ) + "d"
    );

  return new Date(date)
    .toLocaleDateString();

}

/* =========================================================
   VIDEO TAP
========================================================= */

function handleVideoTap(
  card,
  videoEl,
  video
){

  const now =
  Date.now();

  const sameVideo =
  lastTapVideoId ===
  video.id;

  const isDouble =
  sameVideo &&
  now - lastTap < 350;

  lastTap =
  now;

  lastTapVideoId =
  video.id;

  if(isDouble){

    showDoubleHeart(
      card
    );

    toggleLike(
      video.id,
      card
    );

    return;

  }

  if(videoEl.paused){

    videoEl
      .play()
      .catch(
        () => {}
      );

    const indicator =
    card.querySelector(
      ".pause-indicator"
    );

    indicator.classList.remove(
      "show"
    );

  }else{

    videoEl.pause();

    const indicator =
    card.querySelector(
      ".pause-indicator"
    );

    indicator.textContent =
    "▶";

    indicator.classList.add(
      "show"
    );

  }

}

/* =========================================================
   VIDEO OBSERVER
========================================================= */

function setupObserver(){

  if(observer)
    observer.disconnect();

  observer =
  new IntersectionObserver(

    entries => {

      entries.forEach(
        entry => {

          const video =
          entry.target.querySelector(
            ".video"
          );

          if(!video)
            return;

          if(
            entry.isIntersecting &&
            entry.intersectionRatio >= .75
          ){

            activeVideo =
            video;

            activeVideoId =
            entry.target.dataset.videoId;

            document
              .querySelectorAll(
                ".feed-card .video"
              )
              .forEach(
                other => {

                  if(
                    other !== video
                  ){

                    other.pause();

                  }

                }
              );

            video
              .play()
              .catch(
                () => {}
              );

            recordViewOnce(
              entry.target.dataset.videoId
            );

          }else{

            video.pause();

          }

        }
      );

    },

    {
      threshold:[
        0,
        .75,
        1
      ]
    }

  );

  document
    .querySelectorAll(
      ".feed-card"
    )
    .forEach(
      card =>
        observer.observe(
          card
        )
    );

}

async function loadComments(){

  const {
    data,
    error
  } =
  await supabase
    .from("comments")
    .select(
      "id,video_id,user_id,comment,parent_id,likes_count,created_at,updated_at,display_name"
    )
    .eq(
      "video_id",
      commentsVideoId
    )

      commentsSort === "newest"

    )

      "created_at",

      "Comments load error:",

        </strong>

        <span>
          ${esc(error.message)}

  commentRows =
  data || [];

/* =========================================================
   RENDER COMMENTS
========================================================= */

async function renderComments(){

  if(!commentRows.length){

    commentsList.innerHTML = `
      <div class="comments-empty">

        <strong>
          Start the conversation.
        </strong>

        <span>
          Be the first person to say something
          about this video.
        </span>

      </div>
    `;

    commentSubheading.textContent =
    "Be the first to join";

    return;

  }

  const userIds =
  [
    ...new Set(
      commentRows
        .map(
          getCommentUserId
        )
        .filter(Boolean)
    )
  ];

  await Promise.all(
    userIds.map(
      id =>
        getUserProfile(
          id
        )
    )
  );

  const topLevel =
  commentRows.filter(
    comment =>
      !getParentId(
        comment
      )
  );

  const replies =
  commentRows.filter(
    comment =>
      getParentId(
        comment
      )
  );

  commentSubheading.textContent =
  `${commentRows.length} ${
    commentRows.length === 1
      ? "person"
      : "people"
  } joined the conversation`;

  commentsList.innerHTML =
  topLevel
    .map(
      comment => {

        const childReplies =
        replies.filter(
          reply =>
            String(
              getParentId(
                reply
              )
            ) ===
            String(
              comment.id
            )
        );

        return renderComment(
          comment,
          childReplies
        );

      }
    )
    .join("");

  bindCommentButtons();

}

/* =========================================================
   COMMENT BUTTONS
========================================================= */

function bindCommentButtons(){

  document
    .querySelectorAll(
      ".comment-reply"
    )
    .forEach(
      button => {

        button.onclick =
        () => {

          if(!currentUser){

            alert(
              "Please sign in to reply."
            );

            location.href =
            "signup.html";

            return;

          }

          replyToComment =
          button.dataset.id;

          replyName.textContent =
          button.dataset.name;

          replyBar.classList.add(
            "show"
          );

          commentInput.focus();

        };

      }
    );


  document
    .querySelectorAll(
      ".comment-react"
    )
    .forEach(
      button => {

        button.onclick =
        async () => {

          if(!currentUser){

            alert(
              "Please sign in to like a comment."
            );

            location.href =
            "signup.html";

            return;

          }

          const id =
          button.dataset.id;

          const row =
          commentRows.find(
            comment =>
              String(
                comment.id
              ) ===
              String(id)
          );

          if(!row)
            return;

          const currentCount =
          Number(
            row.likes_count ||
            0
          );

          const alreadyReacted =
          button.classList.contains(
            "reacted"
          );

          const nextCount =
          Math.max(
            0,
            currentCount +
            (
              alreadyReacted
              ? -1
              : 1
            )
          );

          button.disabled =
          true;

          const {
            error
          } =
          await supabase
            .from("comments")
            .update({

              likes_count:
                nextCount,

              updated_at:
                new Date()
                  .toISOString()

            })
            .eq(
              "id",
              id
            );

          if(error){

            console.error(
              "Comment like error:",
              error
            );

            alert(
              "Could not update comment reaction: " +
              error.message
            );

            button.disabled =
            false;

            return;

          }

          row.likes_count =
          nextCount;

          await renderComments();

        };

      }
    );


  document
    .querySelectorAll(
      ".comment-delete"
    )
    .forEach(
      button => {

        button.onclick =
        () =>
          deleteComment(
            button.dataset.id
          );

      }
    );


  document
    .querySelectorAll(
      ".comment-report"
    )
    .forEach(
      button => {

        button.onclick =
        () =>
          reportComment(
            button.dataset.id
          );

      }
    );

}

async function sendComment(){

  if(!currentUser){

    alert(
      "Please sign in to join the conversation."
    );

    location.href =
    "signup.html";

    return;

  }

  const text =
  commentInput.value.trim();

  if(
    !text ||
    !commentsVideoId
  )
    return;

  commentSend.disabled =
  true;

  const payload = {

    video_id:
      commentsVideoId,

    user_id:
      currentUser.id,

    comment:
      text,

    ...(replyToComment
      ?
      {
        parent_id:
          replyToComment
      }
      :
      {})

  };

  const {
    error
  } =
  await supabase
    .from("comments")
    .insert(
      payload
    );

  if(error){

    console.error(
      "Comment insert error:",
      error
    );

    alert(
      "Comment could not be posted: " +
      error.message
    );

    commentSend.disabled =
    false;

    return;

  }

  commentInput.value =
  "";

  commentInput.style.height =
  "40px";

  replyToComment =
  null;

  replyBar.classList.remove(
    "show"
  );

  commentSend.disabled =
  true;

  await loadComments();

  commentsList.scrollTop =
  commentsList.scrollHeight;

}

/* =========================================================
   REPORT COMMENT
========================================================= */

async function reportComment(
  commentId
){

  if(!currentUser){

    alert(
      "Please sign in first."
    );

    return;

  }

  const reason =
  prompt(
    "Why are you reporting this comment?",
    "Inappropriate content"
  );

  if(!reason)
    return;

  /*
    Use the existing reports table without
    assuming extra columns.
  */

  const payload = {

    user_id:
      currentUser.id,

    reason:
      reason

  };

  /*
    Try the comment-specific structure first.
  */

  let result =
  await supabase
    .from("reports")
    .insert({

      ...payload,

      comment_id:
        commentId

    });

  /*
    If comment_id is not available in the
    current reports table, retry with a
    generic content reference.
  */

  if(result.error){

    result =
    await supabase
      .from("reports")
      .insert({

        ...payload,

        target_id:
          commentId,

        target_type:
          "comment"

      });

  }

  if(result.error){

    alert(
      "Report could not be submitted: " +
      result.error.message
    );

    return;

  }

  alert(
    "Thanks. BIGULA received your report."
  );

}

========================================================= */

async function shareVideo(
  video
){

  const code =
  video.short_code ||
  video.shortCode ||
  "";

  const url =
  code
  ?
  `${location.origin}${location.pathname.replace(
    "home.html",
    ""
  )}video_view.html?short_code=${encodeURIComponent(code)}`
  :
  `${location.origin}${location.pathname.replace(
    "home.html",
    ""
  )}video_view.html?id=${encodeURIComponent(video.id)}`;

  if(
    navigator.share
  ){

    try{

      await navigator.share({

        title:
          video.title ||
          "BIGULA video",

        text:
          "Watch this on BIGULA",

        url

      });

      return;

    }catch(error){

      if(
        error.name ===
        "AbortError"
      )
        return;

    }

  }

  try{

    await navigator.clipboard.writeText(
      url
    );

    alert(
      "BIGULA video link copied."
    );

  }catch(error){

    prompt(
      "Copy this BIGULA link:",
      url
    );

  }

}

========================================================= */

async function setupComposer(){

  if(!currentUser){

    if(accountAvatar){

      accountAvatar.innerHTML =
      `
      <span class="account-avatar-fallback">
        ●
      </span>
      `;

    }

    return;

  }

  /*
    This deliberately reads the current user's
    row from the users table.
  */

  const profile =
  await getUserProfile(
    currentUser.id
  );

  const name =
  getName(
    currentUser,
    profile
  );

  const avatar =
  getAvatar(
    currentUser,
    profile
  );

  if(avatar){

    composerAvatar.innerHTML =
    `
    <img
      src="${esc(avatar)}"
      alt=""
    >
    `;

    if(accountAvatar){

      accountAvatar.innerHTML =
      `
      <img
        src="${esc(avatar)}"
        alt=""
      >
      `;

    }

  }else{

    const initial =
    name
      .charAt(0)
      .toUpperCase();

    composerAvatar.textContent =
    initial;

    if(accountAvatar){

      accountAvatar.innerHTML =
      `
      <span class="account-avatar-fallback">
        ${esc(initial)}
      </span>
      `;

    }

  }

}


/* =========================================================
   AUTH STATE
========================================================= */

supabase.auth.onAuthStateChange(
  async (
    event,
    session
  ) => {

    currentUser =
    session?.user ||
    null;

    await setupComposer();

    if(currentUser){

      await loadNotificationBadge();

    }

  }
);


/* =========================================================
   START
========================================================= */

async function init(){

  currentUser =
  await getCurrentUser();

  await setupComposer();

  if(currentUser){

    await loadNotificationBadge();

  }

  await loadVideos();

}

init();

</script>
