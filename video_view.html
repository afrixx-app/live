const SUPABASE_URL="https://vfteiggdhthvrrlndtbs.supabase.co";

const SUPABASE_KEY="sb_publishable_7LUjk7PBJeCy-_ZdrEqDzA_sGUruHRe";

/* =========================
   HELPERS
========================= */

const esc=s=>String(s??"").replace(
  /[&<>"']/g,
  m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[m])
);

const fmt=n=>Intl.NumberFormat(
  undefined,
  {
    notation:"compact",
    maximumFractionDigits:1
  }
).format(Number(n)||0);

const dateFmt=d=>{
  if(!d)return"—";

  const x=new Date(d);

  if(Number.isNaN(x.getTime()))return"—";

  return new Intl.DateTimeFormat(
    undefined,
    {
      year:"numeric",
      month:"short",
      day:"numeric",
      hour:"numeric",
      minute:"2-digit"
    }
  ).format(x);
};

const ownerId=v=>
  v?.user_id||
  v?.creator_id||
  v?.owner_id||
  null;

const avatar=u=>
  u?.avatar_url||
  u?.photo_url||
  u?.profile_photo||
  u?.profile_image||
  u?.image_url||
  u?.picture||
  u?.avatar||
  "";


/*
  IMPORTANT:

  BIGULA Supabase Storage bucket is:
      videos

  Uploaded files are inside:
      videos/<filename>

  If storage_path already contains "videos/",
  it will not be duplicated.
*/

const videoUrl=v=>{

  if(
    v?.video_url||
    v?.url||
    v?.file_url||
    v?.public_url||
    v?.storage_url
  ){
    return (
      v.video_url||
      v.url||
      v.file_url||
      v.public_url||
      v.storage_url
    );
  }

  if(v?.storage_path){

    const rawPath=String(v.storage_path)
      .replace(/^\/+/,"");

    /*
      The bucket itself is "videos".

      The folder can also be named "videos".
      Therefore:
        storage_path = videos/file.mp4
      becomes:
        bucket videos
        path videos/file.mp4

      while:
        storage_path = file.mp4
      becomes:
        bucket videos
        path videos/file.mp4
    */

    const storagePath=
      rawPath.startsWith("videos/")
        ? rawPath
        : `videos/${rawPath}`;

    const result=
      supabase
        .storage
        .from("videos")
        .getPublicUrl(storagePath);

    return result?.data?.publicUrl||"";
  }

  return "";
};

function profileUrl(){

  return owner?.id

function decodeToken(t){

  try{

    let s=t
      .replace(/-/g,"+")
      .replace(/_/g,"/");

    while(s.length%4)s+="=";

    const b=atob(s);

    return decodeURIComponent(
      Array.from(
        b,
        c=>"%"+
        c.charCodeAt(0)
          .toString(16)
          .padStart(2,"0")
      ).join("")
    );

  }catch(e){

    return null;
  }
}


async function withTimeout(p,ms=12000){

  let timer;

  const timeout=new Promise(
    (_,rej)=>
      timer=setTimeout(
        ()=>rej(new Error("Request timed out")),
        ms
      )
  );

  try{

    return await Promise.race([
      p,
      timeout
    ]);

  }finally{

    clearTimeout(timer);
  }
}

/* =========================
   DATABASE COUNTS
========================= */

async function countRows(
  table,
  field,
  value
){

  try{

    const r=await withTimeout(
      supabase
        .from(table)
        .select("*",{count:"exact",head:true})
        .eq(field,value),
      9000
    );

    return r.error
      ? 0
      : (r.count||0);

  }catch(e){

    console.warn("Count",table,e);

    return 0;
  }
}


/* =========================
   FIND VIDEO
========================= */

async function findVideo(){

  let r=null;

  /*
    1. Try short_code.
  */

  if(token){

    r=await withTimeout(
      supabase
        .from("videos")
        .select("*")
        .eq("short_code",token)
        .maybeSingle(),
      12000
    ).catch(
      e=>({
        error:e,
        data:null
      })
    );

    if(r?.data)
      return r.data;


    /*
      2. v= can also contain the UUID.
    */

    if(
      /^[0-9a-f]{8}-[0-9a-f-]{27,}$/i
        .test(token)
    ){

      r=await withTimeout(
        supabase
          .from("videos")
          .select("*")
          .eq("id",token)
          .maybeSingle(),
        12000
      ).catch(
        e=>({
          error:e,
          data:null
        })
      );

      if(r?.data)
        return r.data;
    }


    /*
      3. URL-safe base64 UUID.
    */

    const decoded=decodeToken(token);

    if(
      decoded &&
      /^[0-9a-f]{8}-[0-9a-f-]{27,}$/i
        .test(decoded)
    ){

      r=await withTimeout(
        supabase
          .from("videos")
          .select("*")
          .eq("id",decoded)
          .maybeSingle(),
        12000
      ).catch(
        e=>({
          error:e,
          data:null
        })
      );

      if(r?.data)
        return r.data;
    }

    if(r?.error)
      console.warn("Video lookup:",r.error);
  }


  /*
    Legacy ?id=
  */

  if(legacyId){

    r=await withTimeout(
      supabase
        .from("videos")
        .select("*")
        .eq("id",legacyId)
        .maybeSingle(),
      12000
    );

    if(r.data)
      return r.data;

    if(r.error)
      throw r.error;
  }

  return null;
}

/* =========================
   LIKE + FOLLOW STATUS
========================= */

async function loadInteractions(){

  if(!me||!video)
    return;

  const oid=ownerId(video);

  const results=await Promise.allSettled([

    withTimeout(
      supabase
        .from("likes")
        .select("id")
        .eq("video_id",video.id)
        .eq("user_id",me.id)
        .limit(1),
      7000
    ),

    oid&&oid!==me.id

      ? withTimeout(
          supabase
            .from("followers")
            .select("id")
            .eq("follower_id",me.id)
            .eq("following_id",oid)
            .limit(1),
          7000
        )

      : Promise.resolve({
          data:[]
        })
  ]);


  liked=
    results[0].status==="fulfilled" &&
    !!results[0].value.data?.length;


  following=
    results[1].status==="fulfilled" &&
    !!results[1].value.data?.length;
}


/* =========================
   COUNTS
========================= */

async function loadCounts(){

  const oid=ownerId(video);

  const results=await Promise.allSettled([

    countRows(
      "likes",
      "video_id",
      video.id
    ),

    countRows(
      "comments",
      "video_id",
      video.id
    ),

    countRows(
      "views",
      "video_id",
      video.id
    ),

    oid
      ? countRows(
          "followers",
          "following_id",
          oid
        )
      : Promise.resolve(0)
  ]);


  likeCount=
    results[0].status==="fulfilled"
      ? results[0].value
      : 0;

  commentCount=
    results[1].status==="fulfilled"
      ? results[1].value
      : 0;

  viewCount=
    results[2].status==="fulfilled"
      ? results[2].value
      : 0;

  followerCount=
    results[3].status==="fulfilled"
      ? results[3].value
      : 0;
}

/* =========================
   VIDEO PLAYER
========================= */

function setupPlayer(){

  const v=
    document.getElementById("vid");

  const shell=
    document.getElementById("player");

  const play=
    document.getElementById("play");

  const center=
    document.getElementById("center");

  const progress=
    document.getElementById("progress");

  const time=
    document.getElementById("time");

  const mute=
    document.getElementById("mute");

  const disc=
    document.getElementById("disc");


  if(!v)
    return;


  const ft=s=>{

    s=Math.max(
      0,
      Math.floor(s||0)
    );

    return (
      Math.floor(s/60)+
      ":"+
      String(s%60).padStart(2,"0")
    );
  };


  const toggle=async()=>{

    if(v.paused){

      try{

        await v.play();

      }catch(e){

        toast(
          "Tap play to start the video"
        );
      }

    }else{

      v.pause();
    }
  };


  play.onclick=toggle;

  center.onclick=toggle;

  v.onclick=toggle;


  v.addEventListener(
    "play",
    ()=>{
      shell.classList.remove("paused");

      play.textContent="Ⅱ";

      disc?.classList.remove("stop");
    }
  );


  v.addEventListener(
    "pause",
    ()=>{
      shell.classList.add("paused");

      play.textContent="▶";

      disc?.classList.add("stop");
    }
  );


  v.addEventListener(
    "loadedmetadata",
    ()=>{
      time.textContent=
        `0:00 / ${ft(v.duration)}`;
    }
  );


  v.addEventListener(
    "timeupdate",
    ()=>{

      progress.value=
        v.duration
          ? (v.currentTime/v.duration)*1000
          : 0;

      time.textContent=
        `${ft(v.currentTime)} / ${ft(v.duration)}`;
    }
  );


  v.addEventListener(
    "error",
    ()=>{

      console.error(
        "Video element error:",
        v.error
      );

      toast(
        "Video could not be played"
      );
    }
  );


  progress.oninput=()=>{

    if(v.duration){

      v.currentTime=
        Number(progress.value)/
        1000*
        v.duration;
    }
  };


  mute.onclick=()=>{

    v.muted=!v.muted;

    mute.textContent=
      v.muted
        ? "🔇"
        : "🔊";
  };


  document.getElementById(
    "speed"
  ).onclick=()=>{

    const rates=[
      1,
      .75,
      1.25,
      1.5,
      2
    ];

    const i=
      rates.indexOf(
        v.playbackRate
      );

    v.playbackRate=
      rates[
        (i+1)%rates.length
      ];

    document.getElementById(
      "speed"
    ).textContent=
      v.playbackRate+"×";
  };


  document.getElementById(
    "full"
  ).onclick=async()=>{

    try{

      if(document.fullscreenElement){

        await document.exitFullscreen();

      }else{

        await shell.requestFullscreen?.();
      }

    }catch(e){}
  };


  document.getElementById(
    "pip"
  ).onclick=async()=>{

    try{

      if(document.pictureInPictureElement){

        await document.exitPictureInPicture();

      }else if(
        document.pictureInPictureEnabled
      ){

        await v.requestPictureInPicture();
      }

    }catch(e){}
  };


  /*
    Attempt autoplay.

    If browser blocks autoplay,
    try muted autoplay.
  */

  v.play().catch(
    async()=>{

      try{

        v.muted=true;

        await v.play();

        mute.textContent="🔇";

      }catch(e){}
    }
  );
}


/* =========================
   ACTIONS
========================= */

function bindActions(reuse){

  const follow=
    document.getElementById("follow");


  follow?.addEventListener(
    "click",
    async()=>{

      if(!me){

        toast(
          "Sign in to follow creators"
        );

        return;
      }


      const oid=ownerId(video);

      if(!oid||oid===me.id)
        return;


      follow.disabled=true;


      try{

        if(following){

          const r=
            await supabase
              .from("followers")
              .delete()
              .eq("follower_id",me.id)
              .eq("following_id",oid);

          if(r.error)
            throw r.error;

          following=false;

          followerCount=
            Math.max(
              0,
              followerCount-1
            );

        }else{

          const r=
            await supabase
              .from("followers")
              .insert({
                follower_id:me.id,
                following_id:oid
              });

          if(r.error)
            throw r.error;

          following=true;

          followerCount++;
        }


        updateUI();

      }catch(e){

        console.error(
          "Follow:",
          e
        );

        toast(
          "Could not update follow status"
        );

      }finally{

        follow.disabled=false;
      }
    }
  );


  document.getElementById(
    "like"
  ).onclick=async()=>{

    if(!me){

      toast(
        "Sign in to like this video"
      );

      return;
    }


    const b=
      document.getElementById("like");

    b.disabled=true;


    try{

      if(liked){

        const r=
          await supabase
            .from("likes")
            .delete()
            .eq("video_id",video.id)
            .eq("user_id",me.id);

        if(r.error)
          throw r.error;

        liked=false;

        likeCount=
          Math.max(
            0,
            likeCount-1
          );

      }else{

        const r=
          await supabase
            .from("likes")
            .insert({
              video_id:video.id,
              user_id:me.id
            });

        if(r.error)
          throw r.error;

        liked=true;

        likeCount++;
      }


      updateUI();

    }catch(e){

      console.error(
        "Like:",
        e
      );

      toast(
        "Could not update like"
      );

    }finally{

      b.disabled=false;
    }
  };


  document.getElementById(
    "commentBtn"
  ).onclick=()=>{

    document
      .getElementById("commentInput")
      ?.focus();
  };


  document.getElementById(
    "commentForm"
  ).onsubmit=postComment;


  document.getElementById(
    "share"
  ).onclick=async()=>{

    const link=shareLink();

    if(navigator.share){

      try{

        await navigator.share({
          title:
            video.title||
            "BIGULA video",
          url:link
        });

      }catch(e){}

    }else{

      await copy(link);

      toast(
        "BIGULA video link copied"
      );
    }
  };


  document.getElementById(
    "copyLink"
  ).onclick=async()=>{

    await copy(
      shareLink()
    );

    toast(
      "BIGULA video link copied"
    );
  };


  document.getElementById(
    "reuse"
  ).onclick=()=>{

    if(reuse){

      location.href=
        "upload.html?sound_video="+
        encodeURIComponent(
          video.id
        );
    }
  };


  document.getElementById(
    "notInterested"
  ).onclick=()=>{

    toast(
      "We'll show you fewer videos like this"
    );
  };


  document.getElementById(
    "report"
  ).onclick=reportVideo;


  document.getElementById(
    "moreTop"
  ).onclick=()=>{

    toast(
      "More options are available below"
    );
  };
}


/* =========================
   SHARING
========================= */

function shareLink(){

  return video.short_code

    ? location.origin+
      location.pathname+
      "?v="+
      encodeURIComponent(
        video.short_code
      )

    : location.origin+
      location.pathname+
      "?id="+
      encodeURIComponent(
        video.id
      );
}


async function copy(t){

  try{

    await navigator.clipboard.writeText(t);

  }catch(e){

    const i=
      document.createElement("input");

    i.value=t;

    document.body.appendChild(i);

    i.select();

    document.execCommand("copy");

    i.remove();
  }
}


/* =========================
   COMMENTS
========================= */

async function postComment(e){

  e.preventDefault();


  if(!me){

    toast(
      "Sign in to comment"
    );

    return;
  }


  const input=
    document.getElementById(
      "commentInput"
    );

  const text=
    input.value.trim();


  if(!text)
    return;


  /*
    IMPORTANT:

    The comments table uses:
      video_id
      user_id
      comment

    It does NOT use full_name.
  */

  const r=
    await supabase
      .from("comments")
      .insert({
        video_id:video.id,
        user_id:me.id,
        comment:text
      });


  if(r.error){

    console.error(
      "Comment:",
      r.error
    );

    toast(
      "Could not post comment"
    );

    return;
  }


  input.value="";

  commentCount++;

  updateUI();

  toast(
    "Comment posted"
  );

  loadComments();
}


/* =========================
   LOAD COMMENTS
========================= */

async function loadComments(){

  const box=
    document.getElementById(
      "commentList"
    );

  if(!box||!video)
    return;


  const r=
    await withTimeout(

      supabase
        .from("comments")
        .select("*")
        .eq(
          "video_id",
          video.id
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        )
        .limit(50),

      9000

    ).catch(
      e=>({
        error:e,
        data:null
      })
    );


  if(r.error){

    box.innerHTML=`
      <div
        style="color:#888;padding:12px 0"
      >
        Comments could not be loaded.
      </div>
    `;

    return;
  }


  if(!r.data?.length){

    box.innerHTML=`
      <div
        style="color:#888;padding:12px 0"
      >
        No comments yet.
        Be the first to comment.
      </div>
    `;

    return;
  }


  const ids=[
    ...new Set(
      r.data
        .map(x=>x.user_id)
        .filter(Boolean)
    )
  ];


  let users=[];


  if(ids.length){

    const u=
      await supabase
        .from("users")
        .select(
          "id,username,name,avatar_url"
        )
        .in(
          "id",
          ids
        );

    users=u.data||[];
  }


  box.innerHTML=
    r.data
      .map(c=>{

        const u=
          users.find(
            x=>x.id===c.user_id
          )||{};


        const name=
          u.name||
          u.username||
          "BIGULA user";


        const av=
          avatar(u);


        return `

          <div class="comment">

            ${
              av

              ? `<img
                  class="avatar"
                  src="${esc(av)}"
                  alt=""
                >`

              : `<div
                  class="avatar"
                  style="display:flex;align-items:center;justify-content:center"
                >
                  👤
                </div>`
            }


            <div class="commentBody">

              <div class="commentTop">

                <b>
                  ${esc(name)}
                </b>

                <span>
                  ${esc(
                    dateFmt(
                      c.created_at
                    )
                  )}
                </span>

              </div>


              <div class="commentText">
                ${esc(
                  c.comment||""
                )}
              </div>

            </div>

          </div>
        `;
      })
      .join("");
}

========================= */

async function recordView(){

  if(!video)
    return;


  const key=
    "bigula_viewed_"+
    video.id;


  if(
    sessionStorage.getItem(key)
  )
    return;


  const payload={
    video_id:video.id
  };


  if(me?.id)
    payload.user_id=me.id;


  try{

    const r=
      await supabase
        .from("views")
        .insert(payload);


    if(!r.error){

      sessionStorage.setItem(
        key,
        "1"
      );

      viewCount++;

      updateUI();
    }

  }catch(e){

    console.warn(
      "View:",
      e
    );
  }
}

/* =========================
   MAIN LOAD
========================= */

async function loadVideo(){

  try{

    if(!token&&!legacyId){

      showError(
        "No video was selected."
      );

      return;
    }


    /*
      Complete Supabase PKCE if
      the URL contains ?code=...
    */

    const code=
      params.get("code");


    if(code){

      try{

        await withTimeout(
          supabase.auth.exchangeCodeForSession(
            code
          ),
          8000
        );

      }catch(e){

        console.warn(
          "PKCE:",
          e
        );
      }


      const clean=
        token

          ? location.pathname+
            "?v="+
            encodeURIComponent(
              token
            )

          : location.pathname+
            "?id="+
            encodeURIComponent(
              legacyId
            );


      history.replaceState(
        {},
        document.title,
        clean
      );
    }


    /*
      Authentication is optional
      for watching public videos.
    */

    await loadMe();


    /*
      The videos table is the ONLY
      request used to determine
      whether the video exists.
    */

    video=
      await findVideo();


    if(!video){

      showError(
        "Video not found or unavailable."
      );

      return;
    }


    /*
      Check publication status.
    */

    const status=
      String(
        video.publication_status||""
      ).toLowerCase();


    if(
      status &&
      ![
        "published",
        "public",
        "approved"
      ].includes(status) &&
      ownerId(video)!==me?.id
    ){

      showError(
        "This video is not publicly available."
      );

      return;
    }


    /*
      Render immediately.

      Analytics, comments, likes,
      creator profile and followers
      must NOT prevent the video
      player from appearing.
    */

    render();


    /*
      Secondary information loads
      independently.
    */

    const results=
      await Promise.allSettled([

        loadOwner(),

        loadInteractions(),

        loadCounts()

      ]);


    if(
      results[0].status===
      "fulfilled"
    ){

      owner=
        results[0].value;
    }


    updateUI();


    /*
      Comments and views are
      intentionally non-blocking.
    */

    loadComments()
      .catch(
        e=>console.warn(
          "Comments:",
          e
        )
      );


    recordView()
      .catch(
        e=>console.warn(
          "View:",
          e
        )
      );


  }catch(e){

    console.error(
      "BIGULA video_view load:",
      e
    );


    showError(

      e?.message===
      "Request timed out"

        ? "The video request timed out. Please try again."

        : "Could not load this video. Please try again."
    );
  }
}


/* =========================
   START

loadVideo();
