<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<title>BIGULA · Video</title>
<style>
:root{color-scheme:dark;--bg:#07080b;--panel:#11131a;--text:#f7f7fa;--muted:#a5a9b4;--line:#272b36;--accent:#ff2d55}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}button,a{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;height:58px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#07080bf2;border-bottom:1px solid #ffffff10}.back{width:38px;height:38px;border:0;border-radius:50%;background:#ffffff15;color:white;font-size:25px}.brand{font-size:20px;font-weight:900}.page{max-width:900px;margin:auto;padding-bottom:40px}.state{min-height:65vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;color:var(--muted);line-height:1.6}.state-inner{max-width:520px}.state button{margin-top:12px;padding:10px 16px;border:0;border-radius:10px;background:#fff;color:#111;font-weight:800}.player{position:relative;width:100%;height:min(76vh,760px);min-height:300px;background:#000;display:flex;align-items:center;justify-content:center}video{width:100%;height:100%;object-fit:contain;background:#000}.video-error{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:25px;color:#fff;background:#000c;line-height:1.6}.details{padding:18px 16px}h1{font-size:22px;line-height:1.3;margin:0 0 8px;font-weight:850;overflow-wrap:anywhere}.description{white-space:pre-wrap;overflow-wrap:anywhere;color:#d2d5dc;line-height:1.55;font-size:14px;margin:8px 0 16px}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:10px}.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 10px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}.stat{padding:12px 8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;text-align:center}.stat strong{display:block;font-size:17px}.stat span{display:block;font-size:11px;color:var(--muted);margin-top:4px}.link{display:inline-block;color:#fff;overflow-wrap:anywhere;font-size:12px;margin-top:14px}footer{color:#737987;text-align:center;font-size:11px;padding:16px}@media(min-width:760px){.player{border-radius:0 0 14px 14px}.details{padding-left:0;padding-right:0}}@media(max-width:480px){.player{height:65vh;min-height:260px}h1{font-size:19px}}
</style>
</head>
<body>
<header><button class="back" id="back" aria-label="Go back">‹</button><div class="brand">BIGULA</div></header>
<main class="page" id="app"><div class="state" id="initial-state"><div class="state-inner">Loading video…</div></div></main>
<footer>BIGULA · Short videos</footer>
<script>
"use strict";
const SUPABASE_URL="https://vfteiggdhthvrrlndtbs.supabase.co";
const SUPABASE_KEY="sb_publishable_7LUjk7PBJeCy-_ZdrEqDzA_sGUruHRe";
const SELECT_FIELDS="id,user_id,title,description,video_url,thumbnail_url,duration_seconds,file_size,visibility,status,views_count,likes_count,comments_count,created_at,updated_at,category,short_code";
let db=null;
const params=new URLSearchParams(location.search);
const shortCode=(params.get("short_code")||params.get("v")||params.get("code")||"").trim();
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function compact(v){return Intl.NumberFormat(undefined,{notation:"compact",maximumFractionDigits:1}).format(Number(v)||0);}
function dateFmt(v){if(!v)return "—";const d=new Date(v);return Number.isNaN(d.getTime())?"—":new Intl.DateTimeFormat(undefined,{year:"numeric",month:"short",day:"numeric"}).format(d);}
function showState(message,retry=false){const app=document.getElementById("app");app.innerHTML=`<div class="state"><div class="state-inner">${esc(message)}${retry?'<br><button id="retry">Try again</button>':""}</div></div>`;document.getElementById("retry")?.addEventListener("click",()=>location.reload());}
async function timeout(p,ms=12000){let t;try{return await Promise.race([p,new Promise((_,rej)=>t=setTimeout(()=>rej(new Error("Request timed out")),ms))]);}finally{clearTimeout(t);}}
async function loadSupabase(){if(window.supabase?.createClient)return;let last;for(const src of ["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2","https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"]){try{await new Promise((resolve,reject)=>{const s=document.createElement("script");s.src=src;s.async=true;s.onload=()=>window.supabase?.createClient?resolve():reject(new Error("Supabase library did not initialize"));s.onerror=()=>reject(new Error("Could not load Supabase library"));document.head.appendChild(s);});if(window.supabase?.createClient)return;}catch(e){last=e;console.warn("Supabase CDN failed",src,e);}}throw last||new Error("Could not load Supabase library");}
async function fetchByShortCode(code){let r=await timeout(db.from("videos").select(SELECT_FIELDS).eq("short_code",code).limit(1));if(r.error)throw r.error;if(r.data?.length)return r.data[0];
// Fallback for codes that have accidental trailing spaces in the database.
const safe=code.replace(/[\\%_]/g,c=>"\\"+c);r=await timeout(db.from("videos").select(SELECT_FIELDS).ilike("short_code",safe+"%").limit(10));if(r.error)throw r.error;return (r.data||[]).find(row=>String(row.short_code||"").trim().toLowerCase()===code.toLowerCase())||null;}
function render(row){const url=String(row.video_url||"").trim();if(!url){showState("This video record has no video_url.");return;}if(!/^https?:\/\//i.test(url)){showState("The video_url is not a valid HTTP or HTTPS link.");return;}const poster=row.thumbnail_url?String(row.thumbnail_url):"";document.getElementById("app").innerHTML=`<section class="player"><video id="player" controls playsinline preload="metadata" ${poster?`poster="${esc(poster)}"`:""}><source src="${esc(url)}">Your browser does not support HTML video playback.</video><div class="video-error" id="videoError"></div></section><section class="details"><h1>${esc(row.title||"Untitled video")}</h1>${row.description?`<div class="description">${esc(row.description)}</div>`:""}<div class="meta"><span class="pill">${esc(row.category||"Uncategorized")}</span><span class="pill">${esc(row.visibility||"—")}</span><span class="pill">${esc(row.status||"—")}</span><span class="pill">Code: ${esc(String(row.short_code||"").trim())}</span></div><div class="stats"><div class="stat"><strong>${compact(row.views_count)}</strong><span>Views</span></div><div class="stat"><strong>${compact(row.likes_count)}</strong><span>Likes</span></div><div class="stat"><strong>${compact(row.comments_count)}</strong><span>Comments</span></div></div><div class="meta"><span>Duration: ${row.duration_seconds?esc(row.duration_seconds)+" sec":"—"}</span><span>Published: ${esc(dateFmt(row.created_at))}</span><span>Updated: ${esc(dateFmt(row.updated_at))}</span></div><a class="link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open video file directly</a></section>`;const player=document.getElementById("player"),err=document.getElementById("videoError");player.addEventListener("error",()=>{err.style.display="flex";err.textContent=player.error?.code===4?"This video format or URL is not supported by the browser.":"The video file could not be played. Check that it exists and is publicly accessible in Supabase Storage.";});player.addEventListener("loadedmetadata",()=>{err.style.display="none";});}
async function start(){if(!shortCode){showState("No short code was supplied. Open this page with ?short_code=YOUR_VIDEO_CODE");return;}try{await loadSupabase();db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const row=await fetchByShortCode(shortCode);if(!row){showState(`No video was found for short code “${shortCode}”. Check the short_code value in Supabase.`,true);return;}const status=String(row.status||"").toLowerCase(),visibility=String(row.visibility||"").toLowerCase();if(status&&!['published','public','approved'].includes(status)){showState("This video is not published.");return;}if(visibility&&!['public','everyone',''].includes(visibility)){showState("This video is not public.");return;}render(row);}catch(e){console.error("BIGULA short-code video page:",e);showState(e?.message==="Request timed out"?"The video lookup timed out. Check your connection and try again.":"Could not fetch this video from Supabase. Check the browser console for the database or connection error.",true);}}
document.getElementById("back").addEventListener("click",()=>history.length>1?history.back():location.href="home.html");const watchdog=setTimeout(()=>{if(document.getElementById("initial-state"))showState("Video lookup timed out. Check your connection and try again.",true);},22000);start().finally(()=>clearTimeout(watchdog));
</script>
</body>
</html>
