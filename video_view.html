async function count(table,field,value){
 const {count}=await supabase
  .from(table)
  .select("*",{count:"exact",head:true})
  .eq(field,value);

 return count||0;
}

async function first(table,selects,filters){

 let q=supabase.from(table).select(selects);

 for(const [k,v] of filters)
  q=q.eq(k,v);

 const {data}=await q.limit(1);

 return data?.[0]||null;
}

function setupPlayer(){

 const v=document.getElementById("vid");
 const shell=document.getElementById("player");
 const play=document.getElementById("play");
 const center=document.getElementById("center");
 const progress=document.getElementById("progress");
 const time=document.getElementById("time");
 const mute=document.getElementById("mute");

 const fmtTime=s=>{
  s=Math.max(0,Math.floor(s||0));
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
 };

 const toggle=async()=>{
  if(v.paused){
   try{await v.play()}
   catch(e){toast("Tap play to start the video")}
  }else{
   v.pause();
  }
 };

 play.onclick=toggle;
 center.onclick=toggle;

 v.addEventListener("play",()=>{
  shell.classList.remove("paused");
  play.textContent="Ⅱ";
  document.getElementById("disc")?.classList.remove("stop");
 });

 v.addEventListener("pause",()=>{
  shell.classList.add("paused");
  play.textContent="▶";
  document.getElementById("disc")?.classList.add("stop");
 });

 v.addEventListener("loadedmetadata",()=>{
  time.textContent=
   `0:00 / ${fmtTime(v.duration)}`;
 });

 v.addEventListener("timeupdate",()=>{
  progress.value=
   v.duration?
   (v.currentTime/v.duration)*1000:
   0;

  time.textContent=
   `${fmtTime(v.currentTime)} / ${fmtTime(v.duration)}`;
 });

 progress.oninput=()=>{
  if(v.duration)
   v.currentTime=
    Number(progress.value)/1000*v.duration;
 };

 mute.onclick=()=>{
  v.muted=!v.muted;
  mute.textContent=v.muted?"🔇":"🔊";
 };

 document.getElementById("speed").onclick=()=>{
  const rates=[1,.75,1.25,1.5,2];
  const i=rates.indexOf(v.playbackRate);
  v.playbackRate=rates[(i+1)%rates.length];
  document.getElementById("speed").textContent=
   v.playbackRate+"×";
 };

 document.getElementById("full").onclick=
  ()=>shell.requestFullscreen?.();

 document.getElementById("pip").onclick=
  ()=>v.requestPictureInPicture?.().catch(()=>{});

 shell.onclick=e=>{
  if(e.target===v)toggle();
 };
}

async function bindActions(canReuse){

 document.getElementById("follow")?.addEventListener(
  "click",
  async()=>{
   if(!me){
    toast("Sign in to follow creators");
    return;
   }

   const oid=ownerId(video);

   if(following){

    const {error}=await supabase
     .from("followers")
     .delete()
     .eq("follower_id",me.id)
     .eq("following_id",oid);

    if(!error)following=false;

   }else{

    const {error}=await supabase
     .from("followers")
     .insert({
      follower_id:me.id,
      following_id:oid
     });

    if(!error)following=true;
   }

   const b=document.getElementById("follow");

   if(b){
    b.textContent=following?"Following":"Follow";
    b.classList.toggle("following",following);
   }
  }
 );

 document.getElementById("like").onclick=
 async()=>{
  if(!me){
   toast("Sign in to like this video");
   return;
  }

  if(liked){

   const {error}=await supabase
    .from("likes")
    .delete()
    .eq("video_id",video.id)
    .eq("user_id",me.id);

   if(!error)liked=false;

  }else{

   const {error}=await supabase
    .from("likes")
    .insert({
     video_id:video.id,
     user_id:me.id
    });

   if(!error)liked=true;
  }

  /*
    FIXED: use video.id, not undefined "id".
  */
  const n=await count(
   "likes",
   "video_id",
   video.id
  );

  const b=document.getElementById("like");

  b.classList.toggle("active",liked);

  document.getElementById("likeTxt").textContent=
   `${liked?"Liked":"Like"} · ${fmt(n)}`;
 };

    encodeURIComponent(video.id);
 };

 document.getElementById("share").onclick=async()=>{

  if(navigator.share){
   try{
    await navigator.share({
     title:video.title||"BIGULA video",
     url:link
    });
   }catch(e){}
  }else{
   await copy(link);
   toast("BIGULA video link copied");
  }
 };

 document.getElementById("copyLink").onclick=
 async()=>{
  await copy(shareLink());
  toast("BIGULA video link copied");
 };

 document.getElementById("commentBtn").onclick=

 document.getElementById("commentForm").onsubmit=
  postComment;

 document.getElementById("soundInfo").onclick=

 document.getElementById("notInterested").onclick=

 document.getElementById("report").onclick=
  reportVideo;

 document.getElementById("moreTop").onclick=
  ()=>toast("More options are available below");
}

function shareLink(){

 if(video.short_code){
  return `${location.origin}${location.pathname}?v=${encodeURIComponent(video.short_code)}`;
 }

 return `${location.origin}${location.pathname}?id=${encodeURIComponent(video.id)}`;
}

async function copy(text){
 try{
  await navigator.clipboard.writeText(text);
 }catch(e){
  const input=document.createElement("input");
  input.value=text;
  document.body.appendChild(input);
  input.select();
  document.execCommand("copy");
  input.remove();
 }
}

async function postComment(e){

 e.preventDefault();

 if(!me){
  toast("Sign in to comment");
  return;
 }

 const input=document.getElementById("commentInput");
 const text=input.value.trim();

 if(!text)return;

 let result=await supabase
  .from("comments")
  .insert({
   video_id:video.id,
   user_id:me.id,
   comment:text,
   content:text,
   text
  });

 if(result.error){

  result=await supabase
   .from("comments")
   .insert({
    video_id:video.id,
    user_id:me.id,
    content:text
   });
 }

 if(result.error){
  toast("Could not post comment");
  return;
 }

 input.value="";
 toast("Comment posted");
 loadComments();
}

async function loadComments(){

 const box=document.getElementById("commentList");

 if(!box)return;

 const {data,error}=await supabase
  .from("comments")
  .select("*")
  .eq("video_id",video.id)
  .order("created_at",{ascending:false})
  .limit(50);

 if(error||!data?.length){
  box.innerHTML=
   `<div style="color:#888;padding:12px 0">
      No comments yet. Be the first to comment.
    </div>`;
  return;
 }

 const ids=[
  ...new Set(
   data.map(x=>x.user_id).filter(Boolean)
  )
 ];

 let users=[];

 if(ids.length){
  const r=await supabase
   .from("users")
   .select("*")
   .in("id",ids);

  users=r.data||[];
 }

 box.innerHTML=data.map(c=>{

  const u=
   users.find(x=>x.id===c.user_id)||{};

  return `
  <div class="comment">

  <img
   class="avatar"
   src="${esc(avatar(u))}"
   onerror="this.style.display='none'">

  <div class="commentBody">

  <div class="commentTop">
   <b>${esc(
    u.display_name||
    u.username||
    u.name||
    "BIGULA user"
   )}</b>

   <span>

  <div class="commentText">
  ${esc(c.comment||c.content||c.text||"")}

  </div>
