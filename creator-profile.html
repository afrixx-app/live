<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BIGULA – Creator Profile</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  background:#0f0f0f;
  color:#fff;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:#111;
  padding:14px 18px;
  border-bottom:1px solid #222;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:24px;
  font-weight:900;
  color:#ff0050;
  letter-spacing:2px;
}

.back-btn{
  background:#1c1c1c;
  border:none;
  color:#fff;
  padding:10px 15px;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
}

/* PROFILE HERO */

.profile-hero{
  padding:30px 20px;
  text-align:center;
  border-bottom:1px solid #1f1f1f;
  background:linear-gradient(to bottom,#161616,#0f0f0f);
}

.avatar{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid gold;
  margin-bottom:15px;
}

.username{
  font-size:34px;
  font-weight:900;
  color:#ff4da6;
  margin-bottom:8px;
}

.gold-badge{
  color:gold;
  font-size:24px;
  margin-left:8px;
}

.bio{
  max-width:700px;
  margin:10px auto;
  color:#bbb;
  line-height:1.6;
  font-size:15px;
}

.creator-stats{
  margin-top:25px;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:15px;
}

.stat-box{
  background:#161616;
  border:1px solid #222;
  border-radius:18px;
  min-width:130px;
  padding:16px;
}

.stat-box h2{
  color:#fff;
  font-size:26px;
}

.stat-box p{
  color:#999;
  margin-top:5px;
  font-size:14px;
}

/* ACTION BUTTONS */

.action-row{
  margin-top:25px;
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

.follow-btn,
.message-btn,
.share-btn{

  border:none;
  border-radius:999px;
  padding:14px 24px;
  cursor:pointer;
  font-weight:800;
  font-size:15px;
  transition:.25s;
}

.follow-btn{
  background:linear-gradient(45deg,#ff0050,#ff7a00);
  color:#fff;
}

.follow-btn.following{
  background:#222;
  color:#aaa;
  border:1px solid #444;
}

.message-btn{
  background:#1e1e1e;
  color:#fff;
  border:1px solid #333;
}

.share-btn{
  background:linear-gradient(45deg,#0066ff,#00ccff);
  color:#fff;
}

.follow-btn:hover,
.message-btn:hover,
.share-btn:hover{
  transform:scale(1.05);
}

/* TABS */

.tabs{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:25px;
  padding-bottom:15px;
  border-bottom:1px solid #1f1f1f;
}

.tab{
  cursor:pointer;
  font-weight:800;
  opacity:.6;
  transition:.25s;
  padding-bottom:6px;
}

.tab.active{
  opacity:1;
  color:#ff0050;
  border-bottom:2px solid #ff0050;
}

/* VIDEO GRID */

.video-grid{
  padding:25px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:20px;
}

.video-card{
  background:#151515;
  border-radius:18px;
  overflow:hidden;
  border:1px solid #222;
  transition:.25s;
}

.video-card:hover{
  transform:translateY(-4px);
}

.video-card video{
  width:100%;
  height:320px;
  object-fit:cover;
  background:#000;
}

.video-info{
  padding:14px;
}

.video-title{
  font-size:15px;
  font-weight:700;
  margin-bottom:10px;
}

.video-stats{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  color:#aaa;
}

/* INFO BOXES */

.info-section{
  max-width:1000px;
  margin:30px auto;
  padding:0 20px;
}

.info-box{
  background:#161616;
  border:1px solid #222;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
}

.info-box h3{
  color:#ff0050;
  margin-bottom:12px;
}

.info-box p{
  color:#bbb;
  line-height:1.6;
}

/* RESPONSIVE */

@media(max-width:700px){

  .username{
    font-size:28px;
  }

  .creator-stats{
    gap:10px;
  }

  .stat-box{
    min-width:100px;
    padding:12px;
  }

  .video-card video{
    height:260px;
  }
}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

  <button class="back-btn"
    onclick="history.back()">
    ← Back
  </button>

  <div class="logo">
    BIGULA
  </div>

</div>

<!-- PROFILE HERO -->

<div class="profile-hero">

  <img
    id="avatar"
    class="avatar"
    src="https://placehold.co/300x300"
  >

  <div class="username" id="username">
    @creator
    <span id="badgeArea"></span>
  </div>

  <div class="bio" id="bio">
    Loading creator profile...
  </div>

  <!-- STATS -->

  <div class="creator-stats">

    <div class="stat-box">
      <h2 id="followersCount">0</h2>
      <p>Followers</p>
    </div>

    <div class="stat-box">
      <h2 id="likesCount">0</h2>
      <p>Total Likes</p>
    </div>

    <div class="stat-box">
      <h2 id="videosCount">0</h2>
      <p>Videos</p>
    </div>

    <div class="stat-box">
      <h2 id="viewsCount">0</h2>
      <p>Total Views</p>
    </div>

  </div>

  <!-- ACTION BUTTONS -->

  <div class="action-row">

    <button
      id="followBtn"
      class="follow-btn">
      Follow
    </button>

    <button
      class="message-btn">
      Message
    </button>

    <button
      class="share-btn">
      Share Profile
    </button>

  </div>

</div>

<!-- TABS -->

<div class="tabs">

  <div class="tab active">
    Videos
  </div>

  <div class="tab">
    About
  </div>

  <div class="tab">
    Achievements
  </div>

</div>

<!-- VIDEO GRID -->

<div class="video-grid" id="videoGrid">

</div>

<!-- INFO -->

<div class="info-section">

  <div class="info-box">

    <h3>Creator Status</h3>

    <p id="creatorStatus">
      Loading...
    </p>

  </div>

  <div class="info-box">

    <h3>Creator Journey</h3>

    <p>
      BIGULA creators grow through engagement,
      authentic content, community trust,
      and monetization milestones.
    </p>

  </div>

</div>

<script type="module">

import { createClient }
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const SUPABASE_URL =
"https://uyuofjiiptnbbcuntbfi.supabase.co"

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5dW9mamlpcHRuYmJjdW50YmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMzQ3MjcsImV4cCI6MjA4NzkxMDcyN30.-FBKM7NKTSm20qzkExueYhqrE6oaK6a6de1qCsl2nuQ"

const supabase =
createClient(SUPABASE_URL, SUPABASE_KEY)

/* GET UID FROM URL */

const params =
new URLSearchParams(location.search)

const uid = params.get("uid")

if(!uid){

  alert("Creator not found")
  history.back()
}

/* LOAD PROFILE */

async function loadProfile(){

  const {
    data:user
  } = await supabase
    .from("users")
    .select("*")
    .eq("id", uid)
    .single()

  if(!user) return

  document.getElementById("username")
    .innerHTML =
      `@${user.username}
      ${user.is_monetized
        ? '<span class="gold-badge">★</span>'
        : ''}`

  document.getElementById("bio")
    .innerText =
      user.bio || "No bio yet"

  if(user.avatar_url){

    document.getElementById("avatar")
      .src = user.avatar_url
  }

  /* FOLLOWERS */

  const { count:followers } =
    await supabase
      .from("followers")
      .select("*",{head:true,count:"exact"})
      .eq("following_id", uid)

  document.getElementById("followersCount")
    .innerText = followers || 0

  /* VIDEOS */

  const {
    data:videos
  } = await supabase
    .from("videos")
    .select("*")
    .eq("creator_id", uid)
    .order("created_at",{ascending:false})

  document.getElementById("videosCount")
    .innerText = videos.length

  let totalLikes = 0
  let totalViews = 0

  const grid =
    document.getElementById("videoGrid")

  grid.innerHTML = ""

  for(const video of videos){

    const { count:likes } =
      await supabase
        .from("likes")
        .select("*",{head:true,count:"exact"})
        .eq("video_id", video.id)

    const { count:views } =
      await supabase
        .from("views")
        .select("*",{head:true,count:"exact"})
        .eq("video_id", video.id)

    totalLikes += likes || 0
    totalViews += views || 0

    const card =
      document.createElement("div")

    card.className = "video-card"

    card.innerHTML = `

      <video
        src="${video.video_url}"
        muted
        loop
        playsinline>
      </video>

      <div class="video-info">

        <div class="video-title">
          ${video.title || ''}
        </div>

        <div class="video-stats">

          <div>
            ❤️ ${likes || 0}
          </div>

          <div>
            👁 ${views || 0}
          </div>

        </div>

      </div>
    `

    grid.appendChild(card)
  }

  document.getElementById("likesCount")
    .innerText = totalLikes

  document.getElementById("viewsCount")
    .innerText = totalViews

  /* STATUS */

  let statusText = ""

  if(user.is_monetized){

    statusText =
      "★ Monetized Creator"

  } else if(followers >= 500){

    statusText =
      "Eligible for LIVE streaming"

  } else if(followers >= 100){

    statusText =
      "Eligible for custom thumbnails"

  } else {

    statusText =
      "Growing creator"
  }

  document.getElementById("creatorStatus")
    .innerText = statusText

  setupAutoplay()
}

/* AUTOPLAY */

function setupAutoplay(){

  const videos =
    document.querySelectorAll("video")

  const observer =
    new IntersectionObserver(entries=>{

      entries.forEach(entry=>{

        if(entry.isIntersecting){

          entry.target.play()

        } else {

          entry.target.pause()
        }
      })

    },{threshold:.7})

  videos.forEach(v=>observer.observe(v))
}

/* FOLLOW SYSTEM */

document.getElementById("followBtn")
.onclick = async function(){

  const btn = this

  btn.classList.toggle("following")

  if(btn.classList.contains("following")){

    btn.innerText = "Following"

  } else {

    btn.innerText = "Follow"
  }
}

/* SHARE */

document.querySelector(".share-btn")
.onclick = ()=>{

  navigator.share?.({
    title:"BIGULA Creator",
    text:"Check out this creator on BIGULA",
    url:location.href
  })
}

loadProfile()

</script>

</body>
</html>
