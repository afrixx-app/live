<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIGULA — Edit Profile</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f7f7;color:#111}
main{max-width:620px;margin:20px auto;background:#fff;padding:22px;border-radius:16px}
a{color:#111;text-decoration:none}
h1{margin:16px 0 8px}
.sub{color:#666;margin:0 0 20px}
.photo-wrap{text-align:center;margin:18px 0 24px}
.avatar{width:130px;height:130px;border-radius:50%;object-fit:cover;background:#eee;border:2px solid #ddd;display:block;margin:0 auto 12px}
.photo-buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.photo-buttons button{width:auto;margin:0;padding:10px 16px}
input,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;font:inherit;background:#fff}
textarea{min-height:110px;resize:vertical}
label{display:block;font-weight:bold;margin:17px 0 7px}
button{border:0;border-radius:10px;background:#111;color:#fff;font-weight:bold;cursor:pointer}
#save{width:100%;padding:14px;margin-top:22px;font-size:15px}
button:disabled{opacity:.5;cursor:not-allowed}
.notice{padding:12px;border-radius:9px;background:#fff3cd;margin-top:15px}
#status{text-align:center;min-height:20px;margin-top:12px}
.photo-status{font-size:13px;color:#666;margin-top:8px}
#cameraBox{display:none;margin-top:15px}
#camera{width:100%;max-height:430px;background:#000;border-radius:12px;display:block}
.camera-actions{display:flex;gap:8px;margin-top:8px}
.camera-actions button{flex:1;padding:11px}
#fileInput{display:none}
</style>
</head>
<body>
<main>
<a href="account.html">‹ Account</a>
<h1>Edit profile</h1>
<p class="sub">Your profile can be edited once every 30 days.</p>

<div class="photo-wrap">
  <img id="avatar" class="avatar" src="" alt="Profile photo">
  <div class="photo-buttons">
    <button type="button" id="choosePhoto">Choose photo</button>
    <button type="button" id="cameraButton">Take selfie</button>
  </div>
  <input id="fileInput" type="file" accept="image/*">
  <div id="photoStatus" class="photo-status"></div>

  <div id="cameraBox">
    <video id="camera" autoplay playsinline></video>
    <div class="camera-actions">
      <button type="button" id="capture">Take photo</button>
      <button type="button" id="closeCamera">Close camera</button>
    </div>
  </div>
</div>

<label for="name">Name</label>
<input id="name" maxlength="100" placeholder="Your name">

<label for="username">@Handle</label>
<input id="username" maxlength="30" placeholder="yourhandle">

<label for="bio">Bio</label>
<textarea id="bio" maxlength="500" placeholder="Tell people about yourself"></textarea>

<div id="locked" class="notice" style="display:none"></div>
<button id="save">Publish changes</button>
<div id="status"></div>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SB="https://vfteiggdhthvrrlndtbs.supabase.co";
const KEY="sb_publishable_7LUjk7PBJeCy-_ZdrEqDzA_sGUruHRe";
const supabase=createClient(SB,KEY,{
  auth:{
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:true,
    flowType:"pkce"
  }
});

let accessToken="";
function headers(extra={}){
  return {
    apikey:KEY,
    Authorization:"Bearer "+accessToken,
    "Content-Type":"application/json",
    ...extra
  };
}
const PHOTO_BUCKET="photos";

let me=null, oldProfile=null, pendingPhotoUrl="";
let cameraStream=null;

async function req(path,options={}){
  const response=await fetch(SB+"/rest/v1/"+path,{
    ...options,
    headers:headers(options.headers||{})
  });
  return response;
}
function setStatus(text){
  document.getElementById("status").textContent=text;
}

function setPhotoStatus(text){
  document.getElementById("photoStatus").textContent=text;
}

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function getProfilePhoto(profile){
  return profile.profile_photo || profile.avatar_url || profile.photo_url || "";
}

function showPhoto(url){
  const avatar=document.getElementById("avatar");
  avatar.src=url || "https://placehold.co/300x300?text=BIGULA";
}

function isLocked(profile){
  const last=profile.profile_updated_at || profile.profile_edit_at;
  if(!last)return false;
  return (Date.now()-new Date(last).getTime()) < 30*86400000;
}

function lockProfile(profile){
  const locked=document.getElementById("locked");
  const save=document.getElementById("save");
  const last=profile.profile_updated_at || profile.profile_edit_at;
  if(!last)return;
  const days=(Date.now()-new Date(last).getTime())/86400000;
  if(days<30){
    locked.style.display="block";
    locked.textContent="Profile editing is locked for "+Math.ceil(30-days)+" more day(s).";
    save.disabled=true;
  }
}

async function uploadPhoto(file){
  if(!file || !file.type.startsWith("image/"))return;

  setPhotoStatus("Uploading photo…");

  // Unique path prevents overwriting another user's image.
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
  const path=me.id+"/"+Date.now()+"-"+crypto.randomUUID()+"."+ext;

  const upload=await fetch(
    SB+"/storage/v1/object/"+PHOTO_BUCKET+"/"+path,
    {
      method:"POST",
      headers:{
        apikey:KEY,
        Authorization:"Bearer "+accessToken,
        "Content-Type":file.type,
        "x-upsert":"false"
      },
      body:file
    }
  );

  if(!upload.ok){
    const detail=await upload.text();
    console.error(detail);
    setPhotoStatus("Photo upload failed. Check the storage policies.");
    return;
  }

  // Public bucket URL.
  pendingPhotoUrl=SB+"/storage/v1/object/public/"+PHOTO_BUCKET+"/"+path;
  showPhoto(pendingPhotoUrl);
  setPhotoStatus("✓ Photo uploaded.");
}

document.getElementById("choosePhoto").onclick=()=>{
  document.getElementById("fileInput").click();
};

document.getElementById("fileInput").onchange=e=>{
  const file=e.target.files[0];
  if(file)uploadPhoto(file);
};

document.getElementById("cameraButton").onclick=async()=>{
  const box=document.getElementById("cameraBox");
  try{
    cameraStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"user"},
      audio:false
    });
    document.getElementById("camera").srcObject=cameraStream;
    box.style.display="block";
    setPhotoStatus("Front camera ready.");
  }catch(err){
    console.error(err);
    setPhotoStatus("Camera unavailable. Allow camera access and try again.");
  }
};

document.getElementById("capture").onclick=async()=>{
  const video=document.getElementById("camera");
  if(!cameraStream)return;

  const canvas=document.createElement("canvas");
  canvas.width=video.videoWidth||720;
  canvas.height=video.videoHeight||720;
  const ctx=canvas.getContext("2d");

  // Mirror the selfie naturally.
  ctx.translate(canvas.width,0);
  ctx.scale(-1,1);
  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  canvas.toBlob(blob=>{
    if(!blob)return;
    const file=new File([blob],"selfie-"+Date.now()+".jpg",{type:"image/jpeg"});
    uploadPhoto(file);
    stopCamera();
  },"image/jpeg",.92);
};

function stopCamera(){
  if(cameraStream){
    cameraStream.getTracks().forEach(t=>t.stop());
    cameraStream=null;
  }
  document.getElementById("camera").srcObject=null;
  document.getElementById("cameraBox").style.display="none";
}

document.getElementById("closeCamera").onclick=()=>{
  stopCamera();
  setPhotoStatus("");
};

window.addEventListener("beforeunload",stopCamera);

async function init(){
  try{
    // Let Supabase restore the real signed-in session.
    const {data,error}=await supabase.auth.getSession();

    if(error){
      console.error("Session error:",error);
      setStatus("Could not verify your sign-in. Please try again.");
      return;
    }

    let session=data.session;

    // If OAuth redirected back with a code, Supabase JS handles the
    // callback when detectSessionInUrl is enabled. Give it a moment to
    // finish before deciding the user is signed out.
    if(!session){
      await new Promise(resolve=>setTimeout(resolve,500));
      const retry=await supabase.auth.getSession();
      session=retry.data.session;
    }

    if(!session){
      location.replace("signup.html");
      return;
    }

    accessToken=session.access_token;
    me=session.user;

    const {data:profileRows,error:profileError}=await supabase
      .from("users")
      .select("*")
      .eq("id",me.id)
      .limit(1);

    if(profileError){
      console.error("Profile load error:",profileError);
      setStatus("Could not load your profile: "+profileError.message);
      return;
    }

    oldProfile=profileRows?.[0] || null;

    if(!oldProfile){
      setStatus("Profile not found.");
      return;
    }

    document.getElementById("name").value=
      oldProfile.name || oldProfile.full_name || oldProfile.display_name || "";

    document.getElementById("username").value=
      oldProfile.username || "";

    document.getElementById("bio").value=
      oldProfile.bio || "";

    pendingPhotoUrl=getProfilePhoto(oldProfile);
    showPhoto(pendingPhotoUrl);

    if(isLocked(oldProfile)){
      lockProfile(oldProfile);
    }
  }catch(err){
    console.error(err);
    setStatus("Unable to verify your account.");
  }
}

document.getElementById("save").onclick=async()=>{
  if(!me || !oldProfile)return;

  const save=document.getElementById("save");
  save.disabled=true;
  setStatus("Publishing changes…");

  // Re-check the server value immediately before updating.
  const {data:currentRows,error:checkError}=await supabase
    .from("users")
    .select("profile_updated_at,profile_edit_at")
    .eq("id",me.id)
    .limit(1);

  if(checkError){
    console.error("Profile verification error:",checkError);
    save.disabled=false;
    setStatus("Could not verify profile editing time: "+checkError.message);
    return;
  }

  const current=currentRows?.[0] || oldProfile;
  const last=current.profile_updated_at || current.profile_edit_at;

  if(last && (Date.now()-new Date(last).getTime())<30*86400000){
    save.disabled=true;
    lockProfile(current);
    setStatus("Profile editing is locked for 30 days.");
    return;
  }

  let handle=document.getElementById("username").value.trim()
    .replace(/^@+/,"")
    .toLowerCase();

  if(!handle){
    save.disabled=false;
    setStatus("Please enter a handle.");
    return;
  }

  const body={
    name:document.getElementById("name").value.trim(),
    username:handle,
    bio:document.getElementById("bio").value.trim(),
    profile_photo:pendingPhotoUrl,
    profile_updated_at:new Date().toISOString()
  };

  const {data:updatedRows,error:updateError}=await supabase
    .from("users")
    .update(body)
    .eq("id",me.id)
    .select()
    .limit(1);

  if(updateError){
    console.error("Profile update error:",updateError);
    save.disabled=false;
    setStatus("Update failed: "+updateError.message);
    return;
  }

  const updated=updatedRows?.[0] || {...oldProfile,...body};

  localStorage.setItem("bigula_user",JSON.stringify({
    ...oldProfile,
    ...updated,
    id:me.id
  }));

  setStatus("✓ Profile published instantly.");
  save.disabled=true;

  setTimeout(()=>location.href="account.html",800);
};

supabase.auth.onAuthStateChange((event,session)=>{
  if(session){
    accessToken=session.access_token;
    me=session.user;
  }
});

init();
</script>
</body>
</html>
