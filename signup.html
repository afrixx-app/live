
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIGULA – Sign Up</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  min-height:100%;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#050505;
  color:#fff;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow-x:hidden;
  position:relative;
}

.bg{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.glow{
  position:absolute;
  width:420px;
  height:420px;
  border-radius:50%;
  filter:blur(100px);
  opacity:.20;
}

.glow.one{
  background:#ff1744;
  top:-180px;
  left:-130px;
}

.glow.two{
  background:#7c4dff;
  right:-180px;
  bottom:-180px;
}

.glow.three{
  background:#00e5ff;
  width:260px;
  height:260px;
  left:45%;
  top:40%;
  opacity:.08;
}

.signup-card{
  position:relative;
  z-index:2;
  width:min(430px,92%);
  padding:42px 30px 30px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:30px;
  background:rgba(15,15,18,.82);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  box-shadow:
    0 30px 90px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.06);
}

.logo-wrap{
  width:92px;
  height:92px;
  margin:0 auto 22px;
  border-radius:25px;
  overflow:hidden;
  box-shadow:
    0 12px 35px rgba(0,0,0,.45),
    0 0 0 1px rgba(255,255,255,.10);
}

.logo-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.brand{
  text-align:center;
  font-size:34px;
  font-weight:900;
  letter-spacing:2px;
}

.subtitle{
  text-align:center;
  margin-top:9px;
  color:#a8a8b2;
  font-size:15px;
}

.tagline{
  text-align:center;
  margin-top:5px;
  font-size:13px;
  color:#777780;
}

.google-btn{
  width:100%;
  height:58px;
  margin-top:32px;
  border:0;
  border-radius:17px;
  background:#fff;
  color:#151515;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  transition:.18s ease;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.google-btn:hover{
  transform:translateY(-2px);
}

.google-btn:active{
  transform:scale(.98);
}

.google-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none;
}

.google-icon{
  width:21px;
  height:21px;
}

.status{
  display:none;
  margin-top:18px;
  padding:13px 15px;
  border-radius:13px;
  background:rgba(255,255,255,.05);
  color:#b9b9c2;
  text-align:center;
  font-size:13px;
  line-height:1.45;
}

.status.show{
  display:block;
}

.status.error{
  color:#ff8a9d;
  background:rgba(255,23,68,.08);
}

.status.success{
  color:#8ff0b2;
  background:rgba(0,220,120,.08);
}

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:25px 0 20px;
  color:#65656e;
  font-size:11px;
}

.divider span{
  flex:1;
  height:1px;
  background:rgba(255,255,255,.08);
}

.terms{
  text-align:center;
  color:#686872;
  font-size:11px;
  line-height:1.6;
}

.terms a{
  color:#aaaab4;
  text-decoration:none;
}

.footer{
  margin-top:27px;
  text-align:center;
  color:#50505a;
  font-size:11px;
}

@media(max-width:480px){
  body{
    align-items:flex-start;
    padding-top:45px;
  }

  .signup-card{
    padding:34px 22px 25px;
    border-radius:25px;
  }

  .brand{
    font-size:30px;
  }
}
</style>
</head>

<body>

<div class="bg">
  <div class="glow one"></div>
  <div class="glow two"></div>
  <div class="glow three"></div>
</div>

<main class="signup-card">

  <div class="logo-wrap">
    <img
      src="https://vfteiggdhthvrrlndtbs.supabase.co/storage/v1/object/public/photos/icon.png"
      alt="BIGULA">
  </div>

  <div class="brand">BIGULA</div>

  <div class="subtitle">
    Welcome to BIGULA
  </div>

  <div class="tagline">
    Watch. Create. Earn.
  </div>

  <button id="googleBtn" class="google-btn" type="button">

    <svg class="google-icon" viewBox="0 0 24 24">
      <path fill="#4285F4"
        d="M21.35 12.23c0-.72-.06-1.41-.18-2.08H12v3.94h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.25z"/>
      <path fill="#34A853"
        d="M12 21.99c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.93-3.31.93-2.54 0-4.7-1.72-5.47-4.03H3.28v2.53A9.75 9.75 0 0 0 12 21.99z"/>
      <path fill="#FBBC05"
        d="M6.53 14.08a5.87 5.87 0 0 1 0-3.75V7.8H3.28a9.98 9.98 0 0 0 0 8.81l3.25-2.53z"/>
      <path fill="#EA4335"
        d="M12 6.3c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.32 14.63 2.4 12 2.4a9.75 9.75 0 0 0-8.72 5.4l3.25 2.53C7.3 8.02 9.46 6.3 12 6.3z"/>
    </svg>

    <span id="googleText">Continue with Google</span>

  </button>

  <div id="status" class="status"></div>

  <div class="divider">
    <span></span>
    SECURE SIGN IN
    <span></span>
  </div>

  <div class="terms">
    By continuing, you agree to BIGULA's
    <a href="#">Terms</a> and
    <a href="#">Privacy Policy</a>.
  </div>

  <div class="footer">
    Your Google account identifies your BIGULA account.
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* =========================================================
   BIGULA AUTH CONFIG
========================================================= */

const SUPABASE_URL =
  "https://vfteiggdhthvrrlndtbs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_7LUjk7PBJeCy-_ZdrEqDzA_sGUruHRe";


/* =========================================================
   NATIVE DETECTION
========================================================= */

function isNativeApp(){

  if(
    window.Capacitor &&
    typeof window.Capacitor.isNativePlatform === "function"
  ){
    return window.Capacitor.isNativePlatform();
  }

  return false;
}

const NATIVE = isNativeApp();


/* =========================================================
   SUPABASE CLIENT

   WEB  = PKCE
   APP  = implicit

   This prevents the Android deep-link flow from depending
   on a browser PKCE verifier.
========================================================= */

const supabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,

        detectSessionInUrl:false,

        flowType:NATIVE
          ? "implicit"
          : "pkce"
      }
    }
  );


/* =========================================================
   ELEMENTS
========================================================= */

const googleBtn =
  document.getElementById("googleBtn");

const googleText =
  document.getElementById("googleText");

const statusBox =
  document.getElementById("status");


/* =========================================================
   STATUS
========================================================= */

function showStatus(message,type=""){

  statusBox.textContent = message;

  statusBox.className =
    "status show " + type;
}


/* =========================================================
   GOOGLE PROFILE
========================================================= */

function getGoogleName(user){

  const meta =
    user?.user_metadata || {};

  return (
    meta.name ||
    meta.full_name ||
    meta.display_name ||
    [meta.given_name,meta.family_name]
      .filter(Boolean)
      .join(" ") ||
    ("user_" + user.id.substring(0,8))
  );
}


/* =========================================================
   CREATE / UPDATE BIGULA PROFILE
========================================================= */

async function ensureProfile(user){

  if(!user) return;

  const meta =
    user.user_metadata || {};

  const name =
    getGoogleName(user);

  const avatar =
    meta.avatar_url ||
    meta.picture ||
    null;

  const {error} =
    await supabase
      .from("users")
      .upsert(
        {
          id:user.id,
          username:name,
          name:name,
          avatar_url:avatar
        },
        {
          onConflict:"id"
        }
      );

  if(error){
    console.error(
      "BIGULA profile error:",
      error
    );
  }
}


/* =========================================================
   GO HOME
========================================================= */

async function goHome(){

  const {
    data:{
      session
    }
  } =
    await supabase.auth.getSession();

  if(!session?.user){
    return false;
  }

  await ensureProfile(
    session.user
  );

  window.location.replace(
    "https://afrixx-app.github.io/home.html"
  );

  return true;
}


/* =========================================================
   ANDROID CALLBACK
========================================================= */

async function handleNativeCallback(callbackUrl){

  try{

    console.log(
      "BIGULA callback:",
      callbackUrl
    );

    const url =
      new URL(callbackUrl);


    /* OAuth error */

    const error =
      url.searchParams.get("error");

    if(error){

      const description =
        url.searchParams.get(
          "error_description"
        );

      showStatus(
        description ||
        "Google sign-in was cancelled.",
        "error"
      );

      googleBtn.disabled = false;
      googleText.textContent =
        "Continue with Google";

      return;
    }


    /* =====================================================
       IMPLICIT FLOW

       Tokens are returned after the #
       ===================================================== */

    const hash =
      url.hash
        ? url.hash.substring(1)
        : "";

    const params =
      new URLSearchParams(hash);

    const accessToken =
      params.get("access_token");

    const refreshToken =
      params.get("refresh_token");


    if(accessToken && refreshToken){

      googleBtn.disabled = true;
      googleText.textContent =
        "Signing you in...";

      showStatus(
        "Completing Google sign in..."
      );


      const {
        data,
        error:sessionError
      } =
        await supabase.auth.setSession({
          access_token:accessToken,
          refresh_token:refreshToken
        });


      if(sessionError){
        throw sessionError;
      }


      if(data?.session?.user){

        await ensureProfile(
          data.session.user
        );

        showStatus(
          "Welcome to BIGULA!",
          "success"
        );

        setTimeout(
          goHome,
          250
        );

        return;
      }
    }


    /* =====================================================
       FALLBACK: if callback contains ?code=
       ===================================================== */

    const code =
      url.searchParams.get("code");

    if(code){

      const {
        data,
        error:codeError
      } =
        await supabase.auth
          .exchangeCodeForSession(code);

      if(codeError){
        throw codeError;
      }

      if(data?.session?.user){

        await ensureProfile(
          data.session.user
        );

        setTimeout(
          goHome,
          250
        );

        return;
      }
    }


    console.warn(
      "BIGULA: No OAuth session found."
    );

  }catch(error){

    console.error(
      "BIGULA OAuth callback error:",
      error
    );

    showStatus(
      error?.message ||
      "Google sign-in could not be completed.",
      "error"
    );

    googleBtn.disabled = false;

    googleText.textContent =
      "Continue with Google";
  }
}


/* =========================================================
   CAPACITOR APP DEEP LINK
========================================================= */

async function setupNativeOAuth(){

  if(!NATIVE){
    return;
  }

  const App =
    window.Capacitor?.Plugins?.App;

  if(!App){

    console.error(
      "BIGULA: Capacitor App plugin unavailable."
    );

    showStatus(
      "BIGULA app authentication is not available.",
      "error"
    );

    return;
  }


  /* -----------------------------------------------
     App receives callback while already running
  ------------------------------------------------ */

  await App.addListener(
    "appUrlOpen",
    async ({url}) => {

      if(
        url &&
        url.startsWith(
          "com.bigula.app://auth/callback"
        )
      ){

        await handleNativeCallback(url);
      }
    }
  );


  /* -----------------------------------------------
     App was launched by callback
  ------------------------------------------------ */

  try{

    const launch =
      await App.getLaunchUrl();

    if(
      launch?.url &&
      launch.url.startsWith(
        "com.bigula.app://auth/callback"
      )
    ){

      await handleNativeCallback(
        launch.url
      );
    }

  }catch(error){

    console.error(
      "BIGULA launch URL error:",
      error
    );
  }
}


/* =========================================================
   GOOGLE LOGIN
========================================================= */

async function signInWithGoogle(){

  try{

    googleBtn.disabled = true;

    googleText.textContent =
      "Opening Google...";

    showStatus(
      "Connecting to Google..."
    );


    const redirectTo = NATIVE

      ? "com.bigula.app://auth/callback"

      : "https://afrixx-app.github.io/home.html";


    console.log(
      "BIGULA OAuth redirect:",
      redirectTo
    );


    const {
      data,
      error
    } =
      await supabase.auth.signInWithOAuth({
        provider:"google",

        options:{
          redirectTo:redirectTo,

          skipBrowserRedirect:false
        }
      });


    if(error){
      throw error;
    }


    console.log(
      "BIGULA OAuth started:",
      data
    );

  }catch(error){

    console.error(
      "BIGULA Google error:",
      error
    );

    showStatus(
      error?.message ||
      "Google sign-in could not be started.",
      "error"
    );

    googleBtn.disabled = false;

    googleText.textContent =
      "Continue with Google";
  }
}


/* =========================================================
   BUTTON
========================================================= */

googleBtn.addEventListener(
  "click",
  signInWithGoogle
);


/* =========================================================
   STARTUP
========================================================= */

(async function(){

  /*
     IMPORTANT:
     Install the native listener BEFORE
     checking for an incoming callback.
  */

  await setupNativeOAuth();


  /*
     If already signed in,
     go directly Home.
  */

  const {
    data:{
      session
    }
  } =
    await supabase.auth.getSession();


  if(session?.user){

    await ensureProfile(
      session.user
    );

    window.location.replace(
      "https://afrixx-app.github.io/home.html"
    );

    return;
  }


  /*
     WEB CALLBACK
     Only used for GitHub Pages.
  */

  if(!NATIVE){

    const url =
      new URL(
        window.location.href
      );


    /* Error returned by OAuth */

    const error =
      url.searchParams.get("error");

    if(error){

      showStatus(
        url.searchParams.get(
          "error_description"
        ) ||
        "Google sign-in failed.",
        "error"
      );

      return;
    }


    /* PKCE code */

    const code =
      url.searchParams.get("code");

    if(code){

      googleBtn.disabled = true;

      googleText.textContent =
        "Signing you in...";

      await handleNativeCallback(
        window.location.href
      );

      return;
    }
  }

})();
</script>

</body>
</html>
