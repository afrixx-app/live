<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BIGULA — Sign Up</title>
<meta name="theme-color" content="#07070b">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:#050507;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 18px;
  overflow-x:hidden;
  position:relative;
}

/* BIGULA background glow */
body::before{
  content:"";
  position:fixed;
  width:430px;
  height:430px;
  top:-190px;
  left:-150px;
  background:radial-gradient(
    circle,
    rgba(111,76,255,.30) 0%,
    rgba(111,76,255,.10) 35%,
    transparent 70%
  );
  pointer-events:none;
}

body::after{
  content:"";
  position:fixed;
  width:430px;
  height:430px;
  right:-180px;
  bottom:-190px;
  background:radial-gradient(
    circle,
    rgba(0,210,255,.20) 0%,
    rgba(0,210,255,.07) 35%,
    transparent 70%
  );
  pointer-events:none;
}

.container{
  width:100%;
  max-width:430px;
  position:relative;
  z-index:1;
}

/* Logo */
.brand{
  text-align:center;
  margin-bottom:26px;
}

.logo{
  display:inline-block;
  font-size:40px;
  line-height:1;
  font-weight:950;
  letter-spacing:5px;
  background:linear-gradient(
    100deg,
    #ffffff 5%,
    #bdafff 42%,
    #63eaff 100%
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 0 35px rgba(105,90,255,.18);
}

.subtitle{
  margin-top:9px;
  color:#85858f;
  font-size:13px;
  letter-spacing:.2px;
}

/* Main card */
.card{
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );
  border:1px solid rgba(255,255,255,.10);
  border-radius:24px;
  padding:30px 23px 25px;
  box-shadow:
    0 25px 80px rgba(0,0,0,.58),
    0 0 50px rgba(88,70,255,.06);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

h1{
  text-align:center;
  font-size:26px;
  line-height:1.2;
  margin:0 0 10px;
  font-weight:850;
  letter-spacing:-.4px;
}

.desc{
  text-align:center;
  color:#9999a5;
  font-size:14px;
  line-height:1.55;
  margin:0 0 25px;
}

/* Google button */
button{
  width:100%;
  height:55px;
  border:0;
  border-radius:14px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  margin-top:12px;
  transition:
    transform .15s ease,
    opacity .15s ease,
    box-shadow .15s ease;
}

button:active{
  transform:scale(.985);
}

.google{
  position:relative;
  background:#fff;
  color:#15151a;
  box-shadow:
    0 8px 25px rgba(0,0,0,.30);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:11px;
}

.google:hover{
  box-shadow:
    0 10px 30px rgba(90,75,255,.18);
}

.google-icon{
  width:20px;
  height:20px;
  flex:none;
}

.google:disabled{
  opacity:.55;
  cursor:wait;
  transform:none;
}

/* Spinner */
.spinner{
  width:18px;
  height:18px;
  border:2px solid rgba(20,20,25,.20);
  border-top-color:#5550ff;
  border-radius:50%;
  animation:spin .75s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* Divider */
.divider{
  display:flex;
  align-items:center;
  gap:13px;
  color:#555560;
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  margin:22px 0 4px;
}

.divider:before,
.divider:after{
  content:"";
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    #292930,
    transparent
  );
  flex:1;
}

/* Phone button */
.phone{
  background:#15151a;
  color:#60606a;
  border:1px solid #292930;
  cursor:not-allowed;
}

.phone:hover{
  opacity:1;
}

/* Status */
.status{
  display:none;
  margin-top:16px;
  padding:13px 14px;
  border-radius:12px;
  background:#101015;
  border:1px solid #24242c;
  font-size:13px;
  line-height:1.45;
  text-align:center;
}

.status.show{
  display:block;
}

.status.error{
  color:#ff9d9d;
  border-color:rgba(255,80,100,.22);
  background:rgba(120,20,35,.12);
}

.status.info{
  color:#aaaab5;
}

.status.success{
  color:#9fffc9;
  border-color:rgba(50,220,140,.20);
  background:rgba(20,100,65,.10);
}

/* Small note */
.note{
  text-align:center;
  color:#656570;
  font-size:11px;
  line-height:1.5;
  margin-top:17px;
}

/* Footer */
.footer{
  text-align:center;
  color:#45454e;
  font-size:10px;
  letter-spacing:2px;
  font-weight:700;
  margin-top:21px;
}

/* Mobile */
@media(max-width:380px){
  body{
    padding:18px 14px;
  }

  .logo{
    font-size:35px;
  }

  .card{
    padding:26px 18px 22px;
  }
}
</style>

</head>

<body>

  <div class="brand">
    <div class="logo">BIGULA</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {
  "use strict";

  /*
   * ============================================================
   * BIGULA SUPABASE CONFIGURATION
   * ============================================================
   */

  const SUPABASE_URL =
    "https://vfteiggdhthvrrlndtbs.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_7LUjk7PBJeCy-_ZdrEqDzA_sGUruHRe";


  /*
   * ============================================================
   * OAUTH REDIRECTS
   * ============================================================
   *
   * Android:
   *   com.bigula.app://auth/callback
   *
   * Website:
   *   https://afrixx-app.github.io/live/home.html
   */

  const WEB_REDIRECT_URL =
    "https://afrixx-app.github.io/live/home.html";

  const APP_REDIRECT_URL =
    "com.bigula.app://auth/callback";


  /*
   * ============================================================
   * CAPACITOR DETECTION
   * ============================================================
   */

  function isCapacitorApp() {

    try {

      return !!(
        window.Capacitor &&
        (
          typeof window.Capacitor.isNativePlatform === "function"
            ? window.Capacitor.isNativePlatform()
            : (
                typeof window.Capacitor.getPlatform === "function" &&
                window.Capacitor.getPlatform() !== "web"
              )
        )
      );

    } catch (e) {

      console.warn("Capacitor detection failed:", e);

      return false;
    }
  }


  function getRedirectURL() {

    if (isCapacitorApp()) {

      console.log("BIGULA native app detected.");
      console.log(
        "OAuth redirect:",
        APP_REDIRECT_URL
      );

      return APP_REDIRECT_URL;
    }

    console.log("BIGULA website detected.");
    console.log(
      "OAuth redirect:",
      WEB_REDIRECT_URL
    );

    return WEB_REDIRECT_URL;
  }


  const googleBtn =
    document.getElementById("googleBtn");

  const googleText =
    document.getElementById("googleText");

  const statusBox =
    document.getElementById("status");


  /*
   * ============================================================
   * STATUS
   * ============================================================
   */

  function status(message, type) {

    statusBox.textContent = message;

    statusBox.className =
      "status show " + (type || "info");
  }


  /*
   * ============================================================
   * SUPABASE
   * ============================================================
   */

  if (
    !window.supabase ||
    !window.supabase.createClient
  ) {

    status(
      "Supabase could not be loaded. Please check your internet connection.",
      "error"
    );

    googleBtn.disabled = true;

    return;
  }


  const client =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          flowType: "pkce"
        }
      }
    );


  /*
   * ============================================================
   * GOOGLE USER NAME
   * ============================================================
   */

  function googleName(user) {

    const m =
      user?.user_metadata || {};

    return (
      m.name ||
      m.full_name ||
      m.display_name ||
      [
        m.given_name,
        m.family_name
      ]
        .filter(Boolean)
        .join(" ") ||
      null
    );
  }


  /*
   * ============================================================
   * SYNC AUTH USER → BIGULA users TABLE
   * ============================================================
   *
   * The Supabase Auth UUID remains users.id.
   */

  async function syncUserProfile(user) {

    if (!user || !user.id) {
      return null;
    }

    const m =
      user.user_metadata || {};

    const name =
      googleName(user) ||
      `user_${user.id.slice(0, 8)}`;

    const avatar =
      m.avatar_url ||
      m.picture ||
      null;

    const payload = {
      id: user.id,
      name: name,
      username: name
    };

    if (avatar) {
      payload.avatar_url = avatar;
    }

    const {
      data,
      error
    } = await client
      .from("users")
      .upsert(
        payload,
        {
          onConflict: "id"
        }
      )
      .select("*")
      .single();

    if (error) {

      console.error(
        "BIGULA profile sync failed:",
        error
      );

      return null;
    }

    localStorage.setItem(
      "bigula_profile",
      JSON.stringify(data)
    );

    localStorage.setItem(
      "bigula_user_name",
      data.name || name
    );

    localStorage.setItem(
      "supabase_auth_user_id",
      user.id
    );

    localStorage.setItem(
      "isLoggedIn",
      "true"
    );

    localStorage.setItem(
      "loggedIn",
      "true"
    );

    return data;
  }


  /*
   * ============================================================
   * FINISH LOGIN
   * ============================================================
   */

  async function finishLogin(session) {

    if (
      !session ||
      !session.user
    ) {
      return false;
    }

    status(
      "Welcome to BIGULA...",
      "success"
    );

    googleBtn.disabled = true;

    googleText.textContent =
      "Signed in";

    try {

      await syncUserProfile(
        session.user
      );

    } catch (e) {

      console.error(
        "BIGULA profile synchronization error:",
        e
      );
    }

    /*
     * Give Supabase a moment to persist
     * the session before leaving signup.
     */

    setTimeout(
      function () {

        window.location.replace(
          WEB_REDIRECT_URL
        );

      },
      250
    );

    return true;
  }


  /*
   * ============================================================
   * COMPLETE PKCE CALLBACK
   * ============================================================
   *
   * Android MainActivity will later send the
   * com.bigula.app://auth/callback URL here.
   *
   * The callback contains:
   *
   *   ?code=XXXXXXXX
   *
   * Supabase requires this code to be exchanged
   * for the authenticated session.
   */

  async function handleOAuthCallback(callbackUrl) {

    if (!callbackUrl) {
      return false;
    }

    try {

      console.log(
        "BIGULA OAuth callback received:",
        callbackUrl
      );

      const parsed =
        new URL(callbackUrl);

      if (
        parsed.protocol !== "com.bigula.app:" ||
        parsed.hostname !== "auth" ||
        parsed.pathname !== "/callback"
      ) {
        return false;
      }

      const errorParam =
        parsed.searchParams.get("error");

      const errorDescription =
        parsed.searchParams.get(
          "error_description"
        );

      if (errorParam) {

        throw new Error(
          errorDescription ||
          errorParam ||
          "Google authentication failed."
        );
      }

      const code =
        parsed.searchParams.get("code");

      if (!code) {

        throw new Error(
          "Google returned without an authorization code."
        );
      }

      googleBtn.disabled = true;

      googleText.textContent =
        "Finishing sign-in...";

      status(
        "Finishing Google sign-in...",
        "info"
      );

      /*
       * This is the critical PKCE exchange.
       */

      const result =
        await client.auth.exchangeCodeForSession(
          code
        );

      if (result.error) {
        throw result.error;
      }

      if (
        !result.data ||
        !result.data.session ||
        !result.data.session.user
      ) {

        throw new Error(
          "Google sign-in completed, but no BIGULA session was created."
        );
      }

      await finishLogin(
        result.data.session
      );

      return true;

    } catch (e) {

      console.error(
        "BIGULA OAuth callback error:",
        e
      );

      status(
        e && e.message
          ? e.message
          : "Google sign-in could not be completed.",
        "error"
      );

      googleBtn.disabled = false;

      googleText.textContent =
        "Continue with Google";

      return false;
    }
  }


  /*
   * ============================================================
   * NATIVE OAUTH CALLBACK EVENT
   * ============================================================
   *
   * MainActivity.java will dispatch this event when
   * Android returns from Google.
   */

  window.addEventListener(
    "bigulaOAuthCallback",
    function (event) {

      const callbackUrl =
        event &&
        event.detail
          ? event.detail.url
          : null;

      if (callbackUrl) {
        handleOAuthCallback(
          callbackUrl
        );
      }

    }
  );


  /*
   * Also support direct function access from
   * native Android if needed.
   */

  window.bigulaHandleOAuthCallback =
    handleOAuthCallback;


  /*
   * ============================================================
   * EXISTING SESSION
   * ============================================================
   */

  async function existingSession() {

    try {

      const {
        data,
        error
      } = await client.auth.getSession();

      if (error) {
        throw error;
      }

      if (
        data &&
        data.session &&
        data.session.user
      ) {

        await finishLogin(
          data.session
        );

        return true;
      }

    } catch (e) {

      console.error(
        "Session check:",
        e
      );
    }

    return false;
  }


  /*
   * ============================================================
   * AUTH STATE CHANGES
   * ============================================================
   */

  client.auth.onAuthStateChange(
    async function (event, session) {

      console.log(
        "BIGULA Auth:",
        event
      );

      /*
       * Do not redirect immediately on
       * INITIAL_SESSION when there is no session.
       */

      if (
        session &&
        session.user
      ) {

        localStorage.setItem(
          "supabase_auth_user_id",
          session.user.id
        );

        localStorage.setItem(
          "isLoggedIn",
          "true"
        );

        localStorage.setItem(
          "loggedIn",
          "true"
        );

        /*
         * Only finish login if this is an
         * actual authenticated session.
         */

        if (
          event === "SIGNED_IN" ||
          event === "INITIAL_SESSION" ||
          event === "TOKEN_REFRESHED"
        ) {

          try {

            await syncUserProfile(
              session.user
            );

          } catch (e) {

            console.error(
              "BIGULA profile synchronization error:",
              e
            );
          }

          /*
           * Do not redirect repeatedly while
           * TOKEN_REFRESHED is firing.
           */

          if (
            event === "SIGNED_IN" ||
            event === "INITIAL_SESSION"
          ) {

            setTimeout(
              function () {

                window.location.replace(
                  WEB_REDIRECT_URL
                );

              },
              250
            );
          }
        }
      }
    }
  );


  /*
   * ============================================================
   * GOOGLE SIGN-IN
   * ============================================================
   */

  googleBtn.addEventListener(
    "click",
    async function () {

      googleBtn.disabled = true;

      googleText.textContent =
        "Opening Google...";

      status(
        "Connecting to Google...",
        "info"
      );

      try {

        const redirectURL =
          getRedirectURL();

        console.log(
          "BIGULA Google redirect:",
          redirectURL
        );

        const result =
          await client.auth.signInWithOAuth(
            {
              provider: "google",

              options: {
                redirectTo:
                  redirectURL,

                skipBrowserRedirect:
                  false
              }
            }
          );

        if (result.error) {
          throw result.error;
        }

        console.log(
          "Google OAuth started:",
          result.data
        );

      } catch (e) {

        console.error(
          "Google OAuth error:",
          e
        );

        let message =
          e && e.message
            ? e.message
            : "Google sign-in could not be started.";

        if (
          /provider.*not enabled|unsupported provider/i
            .test(message)
        ) {

          message =
            "Google is not enabled in Supabase Authentication.";

        } else if (
          /redirect/i.test(message)
        ) {

          message =
            "The Google/Supabase redirect URL is not configured correctly.";

        } else if (
          /api.?key/i.test(message)
        ) {

          message =
            "The BIGULA Supabase API key is invalid.";
        }

        status(
          message,
          "error"
        );

        googleBtn.disabled = false;

        googleText.textContent =
          "Continue with Google";
      }
    }
  );


  /*
   * ============================================================
   * STARTUP
   * ============================================================
   */

  existingSession();

})();
</script>
