<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BIGULA — Sign Up</title>
<meta name="theme-color" content="#07070b">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:#050507;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 18px;
  overflow-x:hidden;
  position:relative;
}

body::before{
  content:"";
  position:fixed;
  width:430px;
  height:430px;
  top:-190px;
  left:-150px;
  background:radial-gradient(
    circle,
    rgba(111,76,255,.30) 0%,
    rgba(111,76,255,.10) 35%,
    transparent 70%
  );
  pointer-events:none;
}

body::after{
  content:"";
  position:fixed;
  width:430px;
  height:430px;
  right:-180px;
  bottom:-190px;
  background:radial-gradient(
    circle,
    rgba(0,210,255,.20) 0%,
    rgba(0,210,255,.07) 35%,
    transparent 70%
  );
  pointer-events:none;
}

.container{
  width:100%;
  max-width:430px;
  position:relative;
  z-index:1;
}

.brand{
  text-align:center;
  margin-bottom:26px;
}

.logo{
  display:inline-block;
  font-size:40px;
  line-height:1;
  font-weight:950;
  letter-spacing:5px;
  background:linear-gradient(
    100deg,
    #ffffff 5%,
    #bdafff 42%,
    #63eaff 100%
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 0 35px rgba(105,90,255,.18);
}

.subtitle{
  margin-top:9px;
  color:#85858f;
  font-size:13px;
  letter-spacing:.2px;
}

.card{
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );
  border:1px solid rgba(255,255,255,.10);
  border-radius:24px;
  padding:30px 23px 25px;
  box-shadow:
    0 25px 80px rgba(0,0,0,.58),
    0 0 50px rgba(88,70,255,.06);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

h1{
  text-align:center;
  font-size:26px;
  line-height:1.2;
  margin:0 0 10px;
  font-weight:850;
  letter-spacing:-.4px;
}

.desc{
  text-align:center;
  color:#9999a5;
  font-size:14px;
  line-height:1.55;
  margin:0 0 25px;
}

button{
  width:100%;
  height:55px;
  border:0;
  border-radius:14px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  margin-top:12px;
  transition:
    transform .15s ease,
    opacity .15s ease,
    box-shadow .15s ease;
}

button:active{
  transform:scale(.985);
}

.google{
  position:relative;
  background:#fff;
  color:#15151a;
  box-shadow:0 8px 25px rgba(0,0,0,.30);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:11px;
}

.google:hover{
  box-shadow:0 10px 30px rgba(90,75,255,.18);
}

.google-icon{
  width:20px;
  height:20px;
  flex:none;
}

.google:disabled{
  opacity:.55;
  cursor:wait;
  transform:none;
}

.divider{
  display:flex;
  align-items:center;
  gap:13px;
  color:#555560;
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  margin:22px 0 4px;
}

.divider:before,
.divider:after{
  content:"";
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    #292930,
    transparent
  );
  flex:1;
}

.phone{
  background:#15151a;
  color:#60606a;
  border:1px solid #292930;
  cursor:not-allowed;
}

.phone:hover{
  opacity:1;
}

.status{
  display:none;
  margin-top:16px;
  padding:13px 14px;
  border-radius:12px;
  background:#101015;
  border:1px solid #24242c;
  font-size:13px;
  line-height:1.45;
  text-align:center;
  white-space:pre-line;
}

.status.show{
  display:block;
}

.status.error{
  color:#ff9d9d;
  border-color:rgba(255,80,100,.22);
  background:rgba(120,20,35,.12);
}

.status.info{
  color:#aaaab5;
}

.status.success{
  color:#9fffc9;
  border-color:rgba(50,220,140,.20);
  background:rgba(20,100,65,.10);
}

.note{
  text-align:center;
  color:#656570;
  font-size:11px;
  line-height:1.5;
  margin-top:17px;
}

.footer{
  text-align:center;
  color:#45454e;
  font-size:10px;
  letter-spacing:2px;
  font-weight:700;
  margin-top:21px;
}

@media(max-width:380px){
  body{
    padding:18px 14px;
  }

  .logo{
    font-size:35px;
  }

  .card{
    padding:26px 18px 22px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="brand">
    <div class="logo">BIGULA</div>
    <div class="subtitle">Your stressfree home</div>
  </div>

  <div class="card">

    <h1>Create your account</h1>

    <p class="desc">
      Join BIGULA and discover a world of short videos, creators and stories.
    </p>

    <button id="googleBtn" class="google" type="button">
      <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M21.35 12.23c0-.79-.07-1.55-.22-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42z"/>
        <path fill="#34A853" d="M12 21.5c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.75 9.75 0 0 0 12 21.5z"/>
        <path fill="#FBBC05" d="M6.54 13.59A5.86 5.86 0 0 1 6.23 12c0-.55.11-1.09.31-1.59V7.88H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.06 1.05 4.38l3.24-2.79z"/>
        <path fill="#EA4335" d="M12 6.38c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.29 14.63 2.5 12 2.5a9.75 9.75 0 0 0-8.7 5.38l3.24 2.53C7.31 8.1 9.46 6.38 12 6.38z"/>
      </svg>
      <span id="googleText">Continue with Google</span>
    </button>

    <div class="divider">OR</div>

    <button class="phone" type="button" disabled>
      Continue with phone number
    </button>

    <div id="status" class="status"></div>

    <div class="note">
      Phone sign-up is coming soon. It will be enabled after phone authentication is configured.
    </div>

  </div>

  <div class="footer">BIGULA</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {
  "use strict";

  /*
   * ============================================================
   * BIGULA SUPABASE CONFIGURATION
   * ============================================================
   */
  const SUPABASE_URL =
    "https://vfteiggdhthvrrlndtbs.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_7LUjk7PBJeCy-_ZdrEqDzA_sGUruHRe";

  /*
   * ============================================================
   * OAUTH REDIRECTS
   * ============================================================
   *
   * Website:
   *   https://afrixx-app.github.io/live/home.html
   *
   * Capacitor Android:
   *   com.bigula.app://auth/callback
   */
  const WEB_REDIRECT_URL =
    "https://afrixx-app.github.io/live/home.html";

  const HOME_URL = "https://afrixx-app.github.io/live/home.html";
  const APP_REDIRECT_URL =
    "com.bigula.app://auth/callback";

  const googleBtn = document.getElementById("googleBtn");
  const googleText = document.getElementById("googleText");
  const statusBox = document.getElementById("status");

  let loginFinishing = false;

  function status(message, type) {
    statusBox.textContent = message || "";
    statusBox.className = "status show " + (type || "info");
  }

  function isCapacitorApp() {
    try {
      if (window.Capacitor) {
        if (typeof window.Capacitor.isNativePlatform === "function") {
          return window.Capacitor.isNativePlatform();
        }

        if (typeof window.Capacitor.getPlatform === "function") {
          return window.Capacitor.getPlatform() !== "web";
        }
      }
    } catch (e) {
      console.warn("Capacitor detection failed:", e);
    }

    return false;
  }

  function getRedirectURL() {
    return isCapacitorApp()
      ? APP_REDIRECT_URL
      : WEB_REDIRECT_URL;
  }

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        flowType: "pkce"
      }
    }
  );

  function googleName(user) {
    const m = user.user_metadata || {};

    return (
      m.name ||
      m.full_name ||
      m.display_name ||
      [m.given_name, m.family_name].filter(Boolean).join(" ") ||
      (user.email ? user.email.split("@")[0] : "BIGULA User")
    ).trim();
  }

  function googleAvatar(user) {
    const m = user.user_metadata || {};
    return m.avatar_url || m.picture || null;
  }

  function makeUsername(user, name) {
    let base = name
      .toLowerCase()
      .replace(/[^a-z0-9_]/g, "")
      .slice(0, 15);

    if (!base) base = "user";

    return base + "_" +
      user.id.replace(/-/g, "").slice(0, 8).toLowerCase();
  }

  async function saveUser(user) {

    if (!user || !user.id) {
      throw new Error(
        "Google login succeeded, but no user ID was received."
      );
    }

    const name = googleName(user);
    const avatar = googleAvatar(user);
    const username = makeUsername(user, name);

    console.log("BIGULA AUTH USER:", user);
    console.log("BIGULA USER ID:", user.id);
    console.log("BIGULA NAME:", name);
    console.log("BIGULA USERNAME:", username);

    /*
     * IMPORTANT:
     * public.users.id is the real Supabase Auth UUID.
     */
    const existing = await client
      .from("users")
      .select("id,username,name,avatar_url,short_link")
      .eq("id", user.id)
      .limit(1);

    if (existing.error) {
      throw new Error(
        "USERS SELECT FAILED\n" +
        "Code: " + (existing.error.code || "none") + "\n" +
        "Message: " + (existing.error.message || "none")
      );
    }

    /*
     * Existing BIGULA user.
     */
    if (existing.data && existing.data.length > 0) {

      const profile = existing.data[0];

      localStorage.setItem(
        "bigula_profile",
        JSON.stringify(profile)
      );

      localStorage.setItem(
        "bigula_user_name",
        profile.name || name
      );

      localStorage.setItem(
        "supabase_auth_user_id",
        user.id
      );

      localStorage.setItem("isLoggedIn", "true");
      localStorage.setItem("loggedIn", "true");

      return profile;
    }

    /*
     * New BIGULA user.
     */
    const payload = {
      id: user.id,
      username: username,
      name: name
    };

    if (avatar) {
      payload.avatar_url = avatar;
    }

    const inserted = await client
      .from("users")
      .insert(payload)
      .select("id,username,name,avatar_url,short_link")
      .limit(1);

    if (inserted.error) {

      console.error(
        "BIGULA SUPABASE INSERT ERROR:",
        inserted.error
      );

      throw new Error(
        "USERS INSERT FAILED\n\n" +
        "Code: " + (inserted.error.code || "none") + "\n" +
        "Message: " + (inserted.error.message || "none") + "\n" +
        "Details: " + (inserted.error.details || "none") + "\n" +
        "Hint: " + (inserted.error.hint || "none")
      );
    }

    if (!inserted.data || !inserted.data.length) {
      throw new Error(
        "INSERT reported success, but Supabase returned no user row."
      );
    }

    const profile = inserted.data[0];

    localStorage.setItem(
      "bigula_profile",
      JSON.stringify(profile)
    );

    localStorage.setItem(
      "bigula_user_name",
      profile.name || name
    );

    localStorage.setItem(
      "supabase_auth_user_id",
      user.id
    );

    localStorage.setItem("isLoggedIn", "true");
    localStorage.setItem("loggedIn", "true");

    return profile;
  }

  async function finishLogin(session) {

    if (!session || !session.user) {
      return;
    }

    /*
     * Prevent the same OAuth result from being processed twice
     * by INITIAL_SESSION + SIGNED_IN + callback handling.
     */
    if (loginFinishing) {
      return;
    }

    loginFinishing = true;

    googleBtn.disabled = true;
    googleText.textContent = "Signing you in...";
    status("Creating your BIGULA account...", "info");

    try {

      await saveUser(session.user);

      status("Account created successfully!", "success");

      setTimeout(function () {
        window.location.replace(HOME_URL);
      }, 500);

    } catch (error) {

      console.error("BIGULA SIGNUP FAILURE:", error);

      loginFinishing = false;

      googleBtn.disabled = false;
      googleText.textContent = "Continue with Google";

      status(
        error && error.message
          ? error.message
          : "Could not create your BIGULA account.",
        "error"
      );
    }
  }

  /*
   * ============================================================
   * ANDROID / CAPACITOR OAUTH CALLBACK
   * ============================================================
   *
   * Android receives:
   *
   *   com.bigula.app://auth/callback?code=XXXX
   *
   * MainActivity.java forwards that URL to this page through:
   *
   *   bigulaOAuthCallback
   *
   * The Capacitor App plugin is also supported as a second
   * callback path. This makes the page resilient to whether
   * the native callback arrives through MainActivity or the
   * Capacitor App plugin.
   */
  async function handleOAuthCallback(callbackUrl) {

    if (!callbackUrl) {
      return false;
    }

    console.log("BIGULA OAUTH CALLBACK:", callbackUrl);

    let parsed;

    try {
      parsed = new URL(callbackUrl);
    } catch (error) {
      console.error("Invalid OAuth callback URL:", error);
      status("Invalid Google sign-in callback.", "error");
      return false;
    }

    if (
      parsed.protocol !== "com.bigula.app:" ||
      parsed.hostname !== "auth" ||
      parsed.pathname !== "/callback"
    ) {
      console.warn("Ignoring unrelated callback:", callbackUrl);
      return false;
    }

    const oauthError =
      parsed.searchParams.get("error") ||
      parsed.searchParams.get("error_code");

    const oauthErrorDescription =
      parsed.searchParams.get("error_description");

    if (oauthError) {

      console.error(
        "GOOGLE OAUTH ERROR:",
        oauthError,
        oauthErrorDescription
      );

      status(
        oauthErrorDescription
          ? decodeURIComponent(oauthErrorDescription.replace(/\+/g, " "))
          : "Google sign-in was cancelled or failed.",
        "error"
      );

      googleBtn.disabled = false;
      googleText.textContent = "Continue with Google";

      return false;
    }

    const code = parsed.searchParams.get("code");

    if (!code) {
      status(
        "Google sign-in returned without an authorization code.",
        "error"
      );

      googleBtn.disabled = false;
      googleText.textContent = "Continue with Google";

      return false;
    }

    googleBtn.disabled = true;
    googleText.textContent = "Finishing sign-in...";
    status("Finishing Google sign-in...", "info");

    try {

      /*
       * PKCE REQUIREMENT:
       * The authorization code must be exchanged on the same
       * device/browser context that started the login.
       */
      const result =
        await client.auth.exchangeCodeForSession(code);

      if (result.error) {
        throw result.error;
      }

      if (
        !result.data ||
        !result.data.session ||
        !result.data.session.user
      ) {
        throw new Error(
          "Google sign-in completed, but BIGULA did not receive a session."
        );
      }

      await finishLogin(result.data.session);

      return true;

    } catch (error) {

      console.error(
        "BIGULA OAUTH EXCHANGE FAILURE:",
        error
      );

      loginFinishing = false;

      googleBtn.disabled = false;
      googleText.textContent = "Continue with Google";

      status(
        "Google sign-in could not be completed.\n\n" +
        (error && error.message
          ? error.message
          : "Unknown authentication error."),
        "error"
      );

      return false;
    }
  }

  /*
   * Expose callback for MainActivity.java.
   */
  window.bigulaHandleOAuthCallback = handleOAuthCallback;

  /*
   * MainActivity.java dispatches this event.
   */
  window.addEventListener(
    "bigulaOAuthCallback",
    function (event) {

      const callbackUrl =
        event &&
        event.detail &&
        event.detail.url
          ? event.detail.url
          : null;

      if (callbackUrl) {
        handleOAuthCallback(callbackUrl);
      }
    }
  );

  /*
   * Capacitor App plugin callback.
   */
  async function registerCapacitorCallback() {

    try {

      if (
        !window.Capacitor ||
        !window.Capacitor.Plugins ||
        !window.Capacitor.Plugins.App
      ) {
        return;
      }

      const App = window.Capacitor.Plugins.App;

      await App.addListener(
        "appUrlOpen",
        function (event) {

          if (event && event.url) {
            handleOAuthCallback(event.url);
          }
        }
      );

      console.log("BIGULA Capacitor OAuth listener ready.");

    } catch (error) {

      console.warn(
        "Capacitor App listener unavailable:",
        error
      );
    }
  }

  /*
   * ============================================================
   * GOOGLE BUTTON
   * ============================================================
   */
  googleBtn.addEventListener(
    "click",
    async function () {

      if (loginFinishing) {
        return;
      }

      googleBtn.disabled = true;
      googleText.textContent = "Opening Google...";
      status("Connecting to Google...", "info");

      try {

        const redirectTo = getRedirectURL();

        console.log(
          "BIGULA OAuth redirect:",
          redirectTo
        );

        const result =
          await client.auth.signInWithOAuth({
            provider: "google",
            options: {
              redirectTo: redirectTo,
              skipBrowserRedirect: false
            }
          });

        if (result.error) {
          throw result.error;
        }

      } catch (error) {

        console.error("BIGULA GOOGLE ERROR:", error);

        googleBtn.disabled = false;
        googleText.textContent = "Continue with Google";

        status(
          error && error.message
            ? error.message
            : "Google sign-in could not be started.",
          "error"
        );
      }
    }
  );

  /*
   * ============================================================
   * WEB CALLBACK
   * ============================================================
   *
   * On the normal website, Supabase's PKCE callback is:
   *
   *   home.html?code=...
   *
   * This signup page does not need to exchange that web code.
   * The Home page already handles its own web callback.
   */

  /*
   * ============================================================
   * EXISTING SESSION
   * ============================================================
   */
  async function checkSession() {

    try {

      const result = await client.auth.getSession();

      if (result.error) {
        console.error(
          "BIGULA SESSION ERROR:",
          result.error
        );
        return;
      }

      if (
        result.data &&
        result.data.session &&
        result.data.session.user
      ) {
        await finishLogin(result.data.session);
      }

    } catch (error) {

      console.error(
        "BIGULA CHECK SESSION ERROR:",
        error
      );
    }
  }

  /*
   * Supabase auth events.
   *
   * INITIAL_SESSION is enough for an already-existing session.
   * SIGNED_IN handles normal browser auth completion.
   */
  client.auth.onAuthStateChange(
    function (event, session) {

      console.log(
        "BIGULA AUTH EVENT:",
        event
      );

      if (
        (event === "SIGNED_IN" ||
         event === "INITIAL_SESSION") &&
        session &&
        session.user
      ) {
        finishLogin(session);
      }
    }
  );

  /*
   * Start native callback listener first, then check session.
   */
  registerCapacitorCallback();
  checkSession();

})();
</script>

</body>
</html>
