}

.subtitle{

  font-size:15px;
}

.tagline{
  text-align:center;
  margin-top:5px;
  font-size:13px;
  color:#777780;
}

.google-btn{
  width:100%;
  height:58px;
  margin-top:32px;
  border:0;
  border-radius:17px;
  background:#fff;
  color:#151515;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  transition:.18s ease;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.google-btn:hover{
  transform:translateY(-2px);
}

.google-btn:active{
  transform:scale(.98);
}

.google-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none;
}

.google-icon{
  width:21px;
  height:21px;
}

.status{
  display:none;
  margin-top:18px;
  padding:13px 15px;
  border-radius:13px;
  background:rgba(255,255,255,.05);
  color:#b9b9c2;
  text-align:center;
  font-size:13px;
  line-height:1.45;
}

.status.show{
  display:block;
}

.status.error{
  color:#ff8a9d;
  background:rgba(255,23,68,.08);
}

.status.success{
  color:#8ff0b2;
  background:rgba(0,220,120,.08);
}

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:25px 0 20px;
  color:#65656e;
  font-size:11px;
}

.divider span{
  flex:1;
  height:1px;
  background:rgba(255,255,255,.08);
}

.terms{
  text-align:center;
  color:#686872;
  font-size:11px;
  line-height:1.6;
}

.terms a{
  color:#aaaab4;
  text-decoration:none;
}

.footer{
  margin-top:27px;
  text-align:center;
  color:#50505a;
  font-size:11px;
}

@media(max-width:480px){
  body{

    padding-top:45px;
  }

  .signup-card{
    padding:34px 22px 25px;
    border-radius:25px;
  }

  .brand{
    font-size:30px;
  }
}
</style>

</head>

<script>
/* =========================================================
   BIGULA SUPABASE CONFIG
   ========================================================= */

const BIGULA_SUPABASE_URL =
  "https://vfteiggdhthvrrlndtbs.supabase.co";

const BIGULA_SUPABASE_KEY =
  "sb_publishable_7LUjk7PBJeCy-_ZdrEqDzA_sGUruHRe";

const WEB_HOME_URL =
  "https://afrixx-app.github.io/live/home.html";

const WEB_SIGNUP_URL =
  "https://afrixx-app.github.io/live/signup.html";

const APP_CALLBACK_URL =
  "com.bigula.app://auth/callback";


/* =========================================================
   PAGE ELEMENTS
   ========================================================= */

const googleBtn =
  document.getElementById("googleBtn");

const googleText =
  document.getElementById("googleText");

const statusBox =
  document.getElementById("status");


/* =========================================================
   NATIVE APP DETECTION
   ========================================================= */

function isNativeApp(){

  return !!(
    window.Capacitor &&
    typeof window.Capacitor.isNativePlatform === "function" &&
    window.Capacitor.isNativePlatform()
  );

}

const BIGULA_NATIVE =
  isNativeApp();


/* =========================================================
   SUPABASE CLIENT
   IMPORTANT:
   Do NOT use the variable name "supabase".
   ========================================================= */

const BIGULA_SUPABASE =
  window.supabase.createClient(
    BIGULA_SUPABASE_URL,
    BIGULA_SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:false,
        flowType:"pkce"
      }
    }
  );


/* =========================================================
   STATUS
   ========================================================= */

function showStatus(message,type=""){

  statusBox.textContent = message;

  statusBox.className =
    "status show " + type;

}


function resetGoogleButton(){

  googleBtn.disabled = false;

  googleText.textContent =
    "Continue with Google";

}


/* =========================================================
   GOOGLE USER NAME
   ========================================================= */

function getGoogleName(user){

  const meta =
    user?.user_metadata || {};

  return (
    meta.name ||
    meta.full_name ||
    meta.display_name ||
    [
      meta.given_name,
      meta.family_name
    ]
      .filter(Boolean)
      .join(" ") ||
    "BIGULA User"
  );

}


/* =========================================================
   CREATE / UPDATE BIGULA PROFILE
   ========================================================= */

async function ensureProfile(user){

  if(!user){
    return null;
  }

  const meta =
    user.user_metadata || {};

  const name =
    getGoogleName(user);

  const avatar =
    meta.avatar_url ||
    meta.picture ||
    null;

  const profileData = {
    id:user.id,
    username:name,
    name:name
  };

  if(avatar){
    profileData.avatar_url =
      avatar;
  }

  const {
    data,
    error
  } =
    await BIGULA_SUPABASE
      .from("users")
      .upsert(
        profileData,
        {
          onConflict:"id"
        }
      )
      .select()
      .maybeSingle();

  if(error){

    console.warn(
      "BIGULA profile update failed:",
      error
    );

    return null;
  }

  if(data){

    try{

      localStorage.setItem(
        "bigula_user",
        JSON.stringify(data)
      );

    }catch(e){}

  }

  return data;

}


/* =========================================================
   FINISH LOGIN
   ========================================================= */

async function finishLogin(session){

  if(!session?.user){

    throw new Error(
      "No BIGULA session was created."
    );

  }

  await ensureProfile(
    session.user
  );

  showStatus(
    "Welcome to BIGULA!",
    "success"
  );

  setTimeout(
    ()=>{
      window.location.replace(
        WEB_HOME_URL
      );
    },
    300
  );

}


/* =========================================================
   PROCESS WEB / NATIVE OAUTH CALLBACK
   ========================================================= */

async function processOAuthCallback(
  callbackUrl
){

  const url =
    new URL(callbackUrl);


  /* OAuth error */

  const oauthError =
    url.searchParams.get("error");

  if(oauthError){

    throw new Error(
      url.searchParams.get(
        "error_description"
      ) ||
      "Google sign-in was cancelled."
    );

  }


  /* PKCE callback */

  const code =
    url.searchParams.get("code");

  if(code){

    googleBtn.disabled =
      true;

    googleText.textContent =
      "Signing you in...";

    showStatus(
      "Completing Google sign-in..."
    );

    const {
      data,
      error
    } =
      await BIGULA_SUPABASE
        .auth
        .exchangeCodeForSession(
          code
        );

    if(error){
      throw error;
    }

    if(!data?.session){

      throw new Error(
        "Google sign-in completed without a session."
      );

    }

    await finishLogin(
      data.session
    );

    return true;

  }


  /* Implicit callback fallback */

  if(url.hash){

    const hashParams =
      new URLSearchParams(
        url.hash.substring(1)
      );

    const accessToken =
      hashParams.get(
        "access_token"
      );

    const refreshToken =
      hashParams.get(
        "refresh_token"
      );

    if(
      accessToken &&
      refreshToken
    ){

      googleBtn.disabled =
        true;

      googleText.textContent =
        "Signing you in...";

      showStatus(
        "Completing Google sign-in..."
      );

      const {
        data,
        error
      } =
        await BIGULA_SUPABASE
          .auth
          .setSession({
            access_token:
              accessToken,

            refresh_token:
              refreshToken
          });

      if(error){
        throw error;
      }

      if(!data?.session){

        throw new Error(
          "Google sign-in completed without a session."
        );

      }

      await finishLogin(
        data.session
      );

      return true;

    }

  }


  return false;

}


/* =========================================================
   NATIVE CAPACITOR OAUTH
   ========================================================= */

async function setupNativeOAuth(){

  if(!BIGULA_NATIVE){
    return;
  }

  const App =
    window.Capacitor?.Plugins?.App;

  if(!App){

    console.error(
      "Capacitor App plugin is unavailable."
    );

    return;
  }


  /* Listen for Google callback */

  await App.addListener(
    "appUrlOpen",
    async ({url})=>{

      try{

        if(
          url &&
          url.startsWith(
            APP_CALLBACK_URL
          )
        ){

          await processOAuthCallback(
            url
          );

        }

      }catch(error){

        console.error(
          "Native callback error:",
          error
        );

        showStatus(
          error?.message ||
          "Google sign-in could not be completed.",
          "error"
        );

        resetGoogleButton();

      }

    }
  );


  /* Handle callback if app was launched by URL */

  try{

    const launch =
      await App.getLaunchUrl();

    if(
      launch?.url &&
      launch.url.startsWith(
        APP_CALLBACK_URL
      )
    ){

      await processOAuthCallback(
        launch.url
      );

    }

  }catch(error){

    console.warn(
      "Could not read Android launch URL:",
      error
    );

  }

}


/* =========================================================
   GOOGLE SIGN IN
   ========================================================= */

async function signInWithGoogle(){

  try{

    googleBtn.disabled =
      true;

    googleText.textContent =
      "Opening Google...";

    showStatus(
      "Connecting to Google..."
    );


    const redirectTo =
      BIGULA_NATIVE
        ? APP_CALLBACK_URL
        : WEB_SIGNUP_URL;


    console.log(
      "BIGULA native mode:",
      BIGULA_NATIVE
    );

    console.log(
      "BIGULA OAuth redirect:",
      redirectTo
    );


    const {
      error
    } =
      await BIGULA_SUPABASE
        .auth
        .signInWithOAuth({

          provider:"google",

          options:{

            redirectTo,

            skipBrowserRedirect:false

          }

        });


    if(error){
      throw error;
    }


  }catch(error){

    console.error(
      "Google sign-in error:",
      error
    );

    showStatus(
      error?.message ||
      "Google sign-in could not be started.",
      "error"
    );

    resetGoogleButton();

  }

}


/* =========================================================
   BUTTON
   ========================================================= */

googleBtn.addEventListener(
  "click",
  signInWithGoogle
);


/* =========================================================
   STARTUP
   ========================================================= */

(async function init(){

  console.log(
    "BIGULA signup started"
  );

  console.log(
    "BIGULA running native:",
    BIGULA_NATIVE
  );


  try{

    /* Set up Android callback */

    await setupNativeOAuth();


    /* Process web OAuth callback */

    if(!BIGULA_NATIVE){

      const url =
        new URL(
          window.location.href
        );


      if(
        url.searchParams.has("code") ||
        url.searchParams.has("error") ||
        url.hash.includes(
          "access_token="
        )
      ){

        const handled =
          await processOAuthCallback(
            window.location.href
          );

        if(handled){
          return;
        }

      }

    }


    /* Check existing session */

    const {
      data:{
        session
      }
    } =
      await BIGULA_SUPABASE
        .auth
        .getSession();


    if(session?.user){

      await finishLogin(
        session
      );

    }


  }catch(error){

    console.error(
      "BIGULA startup error:",
      error
    );

    showStatus(
      error?.message ||
      "Could not start BIGULA sign-in.",
      "error"
    );

    resetGoogleButton();

  }

})();
</script>
