<script>

/* =========================================================
   BIGULA SUPABASE CONFIGURATION
   ========================================================= */

const SUPABASE_URL =
    "https://vfteiggdhthvrrlndtbs.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_7LUjk7PBJeCy-_ZdrEqDzA_sGUruHRe";


/* =========================================================
   REDIRECT URLS
   ========================================================= */

const WEB_REDIRECT_URL =
    "https://afrixx-app.github.io/live/home.html";

const HOME_URL =
    "https://afrixx-app.github.io/live/home.html";

const APP_REDIRECT_URL =
    "com.bigula.app://auth/callback";


/* =========================================================
   SUPABASE CLIENT
   IMPORTANT:
   detectSessionInUrl MUST remain FALSE here.

   Google OAuth is started from signup.html but the callback
   goes to home.html.

   This prevents signup.html from trying to consume the
   one-time PKCE authorization code.
   ========================================================= */

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:false,
            flowType:"pkce"
        }
    }
);


/* =========================================================
   ELEMENTS
   ========================================================= */

const googleBtn =
    document.getElementById("googleBtn");

const statusEl =
    document.getElementById("status");


/* =========================================================
   STATUS MESSAGE
   ========================================================= */

function setStatus(message, type="info"){

    statusEl.className = "status " + type;

    statusEl.innerHTML = message;
}


/* =========================================================
   GET CORRECT OAUTH REDIRECT
   ========================================================= */

function getRedirectUrl(){

    /*
       When BIGULA is running inside the Capacitor/native
       application, use the custom app callback.

       On the normal website, send Google back to Home.
    */

    const isNative =
        window.location.protocol === "capacitor:" ||
        window.location.protocol === "ionic:" ||
        window.location.protocol === "file:";

    if(isNative){
        return APP_REDIRECT_URL;
    }

    return WEB_REDIRECT_URL;
}


/* =========================================================
   SAVE USER PROFILE
   ========================================================= */

async function saveUser(user){

    if(!user){
        return null;
    }

    try{

        const metadata =
            user.user_metadata || {};

        const googleName =
            metadata.name ||
            metadata.full_name ||
            metadata.display_name ||
            [
                metadata.given_name,
                metadata.family_name
            ]
            .filter(Boolean)
            .join(" ");

        const avatar =
            metadata.avatar_url ||
            metadata.picture ||
            null;

        /*
           The database trigger normally creates the public.users
           row automatically.

           We only update useful Google profile information here.
        */

        const profileData = {
            id:user.id
        };

        if(googleName){
            profileData.name = googleName;
            profileData.username = googleName;
        }

        if(avatar){
            profileData.avatar_url = avatar;
        }

        const { data, error } =
            await client
                .from("users")
                .upsert(
                    profileData,
                    {
                        onConflict:"id"
                    }
                )
                .select()
                .single();

        if(error){

            console.warn(
                "Could not update public profile:",
                error
            );

            /*
               Do not block login if the auth session itself
               was successfully created.
            */

            return null;
        }

        /*
           Cache profile locally for quick UI loading.
        */

        try{
            localStorage.setItem(
                "bigula_user",
                JSON.stringify(data)
            );
        }catch(e){
            console.warn(
                "Could not cache BIGULA profile",
                e
            );
        }

        return data;

    }catch(error){

        console.warn(
            "saveUser error:",
            error
        );

        return null;
    }
}


/* =========================================================
   FINISH LOGIN
   ========================================================= */

async function finishLogin(session){

    if(!session || !session.user){

        setStatus(
            "No active session was found.",
            "error"
        );

        googleBtn.disabled = false;

        return;
    }

    setStatus(
        '<span class="loading"></span>Signing you in...',
        "info"
    );

    googleBtn.disabled = true;

    /*
       Save/refresh public profile.
    */

    await saveUser(session.user);

    /*
       Store basic session information locally.
       Supabase remains the source of truth.
    */

    try{

        localStorage.setItem(
            "bigula_auth_user",
            JSON.stringify({
                id:session.user.id,
                email:session.user.email || null,
                name:
                    session.user.user_metadata?.name ||
                    session.user.user_metadata?.full_name ||
                    session.user.user_metadata?.display_name ||
                    null,
                avatar:
                    session.user.user_metadata?.avatar_url ||
                    session.user.user_metadata?.picture ||
                    null
            })
        );

    }catch(e){
        console.warn(
            "Could not cache auth user",
            e
        );
    }

    setStatus(
        "Login successful. Opening BIGULA...",
        "success"
    );

    /*
       Small delay so the user can see the success message.
    */

    setTimeout(() => {

        window.location.replace(HOME_URL);

    }, 300);

}


/* =========================================================
   GOOGLE SIGN-IN
   ========================================================= */

async function signInWithGoogle(){

    if(googleBtn.disabled){
        return;
    }

    googleBtn.disabled = true;

    setStatus(
        '<span class="loading"></span>Connecting to Google...',
        "info"
    );

    try{

        /*
           Make sure there is no stale OAuth callback data
           sitting on signup.html.
        */

        const redirectTo =
            getRedirectUrl();

        const { data, error } =
            await client.auth.signInWithOAuth({
                provider:"google",

                options:{
                    redirectTo:redirectTo,

                    /*
                       Let Supabase perform the browser redirect.
                    */

                    skipBrowserRedirect:false
                }
            });

        if(error){

            console.error(
                "Google sign-in error:",
                error
            );

            setStatus(
                "Google sign-in could not be started. " +
                error.message,
                "error"
            );

            googleBtn.disabled = false;

            return;
        }

        /*
           Normally the browser immediately leaves this page.
        */

        console.log(
            "Google OAuth started:",
            data
        );

    }catch(error){

        console.error(
            "Google OAuth exception:",
            error
        );

        setStatus(
            "Google sign-in could not be completed. " +
            (error.message || "Please try again."),
            "error"
        );

        googleBtn.disabled = false;
    }
}


/* =========================================================
   GOOGLE BUTTON
   ========================================================= */

googleBtn.addEventListener(
    "click",
    signInWithGoogle
);


/* =========================================================
   AUTH STATE LISTENER
   ========================================================= */

client.auth.onAuthStateChange(
    async (event, session) => {

        console.log(
            "BIGULA auth event:",
            event
        );

        /*
           If an existing session is already available,
           send the user to Home.

           Do NOT process URL OAuth codes here.
           Home owns the web callback.
        */

        if(
            event === "SIGNED_IN" &&
            session
        ){

            await finishLogin(session);

        }

    }
);


/* =========================================================
   CHECK EXISTING SESSION
   ========================================================= */

async function checkExistingSession(){

    try{

        const {
            data,
            error
        } = await client.auth.getSession();

        if(error){

            console.warn(
                "Session check error:",
                error
            );

            return;
        }

        const session =
            data?.session;

        if(session){

            /*
               User is already logged in.
               There is no reason to display signup again.
            */

            await finishLogin(session);
        }

    }catch(error){

        console.warn(
            "Existing session check failed:",
            error
        );
    }
}


/* =========================================================
   NATIVE CAPACITOR CALLBACK
   =========================================================

   This section is only for:

   com.bigula.app://auth/callback?code=...

   The normal website callback is NOT handled here.

   The native callback can be handled if signup.html is
   opened inside the Capacitor application.
   ========================================================= */

async function handleOAuthCallback(callbackUrl){

    try{

        if(!callbackUrl){
            return false;
        }

        const url =
            new URL(callbackUrl);

        const code =
            url.searchParams.get("code");

        if(!code){
            return false;
        }

        setStatus(
            '<span class="loading"></span>Completing Google sign-in...',
            "info"
        );

        googleBtn.disabled = true;

        /*
           Exchange the one-time authorization code exactly once.
        */

        const {
            data,
            error
        } =
            await client.auth.exchangeCodeForSession(
                code
            );

        if(error){

            console.error(
                "Native OAuth exchange error:",
                error
            );

            setStatus(
                "Google sign-in could not be completed. " +
                error.message,
                "error"
            );

            googleBtn.disabled = false;

            return true;
        }

        if(data?.session){

            await finishLogin(
                data.session
            );

            return true;
        }

        setStatus(
            "Google sign-in completed but no session was returned.",
            "error"
        );

        googleBtn.disabled = false;

        return true;

    }catch(error){

        console.error(
            "Native callback error:",
            error
        );

        setStatus(
            "Google sign-in could not be completed.",
            "error"
        );

        googleBtn.disabled = false;

        return true;
    }
}


/* =========================================================
   HANDLE NATIVE APP URL
   ========================================================= */

async function checkNativeCallback(){

    /*
       Capacitor may expose the callback through the app URL.
    */

    try{

        if(
            window.location.protocol === "capacitor:" ||
            window.location.protocol === "ionic:"
        ){

            const handled =
                await handleOAuthCallback(
                    window.location.href
                );

            if(handled){
                return true;
            }
        }

    }catch(error){

        console.warn(
            "Native callback detection failed:",
            error
        );
    }

    return false;
}


/* =========================================================
   START PAGE
   ========================================================= */

(async function init(){

    console.log(
        "BIGULA signup page started"
    );

    /*
       IMPORTANT:

       We intentionally do NOT call
       exchangeCodeForSession() for normal web URLs here.

       Google redirects the website to:

       home.html?code=...

       Home handles that code exactly once.
    */

    const nativeHandled =
        await checkNativeCallback();

    if(nativeHandled){
        return;
    }

    /*
       If an authenticated session already exists,
       go directly to Home.
    */

    await checkExistingSession();

})();

</script>

</body>
</html>
