<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BIGULA — Sign Up</title>
<meta name="theme-color" content="#07070b">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:#050507;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 18px;
  overflow-x:hidden;
  position:relative;
}

/* BIGULA background glow */
body::before{
  content:"";
  position:fixed;
  width:430px;
  height:430px;
  top:-190px;
  left:-150px;
  background:radial-gradient(
    circle,
    rgba(111,76,255,.30) 0%,
    rgba(111,76,255,.10) 35%,
    transparent 70%
  );
  pointer-events:none;
}

body::after{
  content:"";
  position:fixed;
  width:430px;
  height:430px;
  right:-180px;
  bottom:-190px;
  background:radial-gradient(
    circle,
    rgba(0,210,255,.20) 0%,
    rgba(0,210,255,.07) 35%,
    transparent 70%
  );
  pointer-events:none;
}

.container{
  width:100%;
  max-width:430px;
  position:relative;
  z-index:1;
}

/* Logo */
.brand{
  text-align:center;
  margin-bottom:26px;
}

.logo{
  display:inline-block;
  font-size:40px;
  line-height:1;
  font-weight:950;
  letter-spacing:5px;
  background:linear-gradient(
    100deg,
    #ffffff 5%,
    #bdafff 42%,
    #63eaff 100%
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 0 35px rgba(105,90,255,.18);
}

.subtitle{
  margin-top:9px;
  color:#85858f;
  font-size:13px;
  letter-spacing:.2px;
}

/* Main card */
.card{
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );
  border:1px solid rgba(255,255,255,.10);
  border-radius:24px;
  padding:30px 23px 25px;
  box-shadow:
    0 25px 80px rgba(0,0,0,.58),
    0 0 50px rgba(88,70,255,.06);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

h1{
  text-align:center;
  font-size:26px;
  line-height:1.2;
  margin:0 0 10px;
  font-weight:850;
  letter-spacing:-.4px;
}

.desc{
  text-align:center;
  color:#9999a5;
  font-size:14px;
  line-height:1.55;
  margin:0 0 25px;
}

/* Google button */
button{
  width:100%;
  height:55px;
  border:0;
  border-radius:14px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  margin-top:12px;
  transition:
    transform .15s ease,
    opacity .15s ease,
    box-shadow .15s ease;
}

button:active{
  transform:scale(.985);
}

.google{
  position:relative;
  background:#fff;
  color:#15151a;
  box-shadow:
    0 8px 25px rgba(0,0,0,.30);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:11px;
}

.google:hover{
  box-shadow:
    0 10px 30px rgba(90,75,255,.18);
}

.google-icon{
  width:20px;
  height:20px;
  flex:none;
}

.google:disabled{
  opacity:.55;
  cursor:wait;
  transform:none;
}

/* Spinner */
.spinner{
  width:18px;
  height:18px;
  border:2px solid rgba(20,20,25,.20);
  border-top-color:#5550ff;
  border-radius:50%;
  animation:spin .75s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* Divider */
.divider{
  display:flex;
  align-items:center;
  gap:13px;
  color:#555560;
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  margin:22px 0 4px;
}

.divider:before,
.divider:after{
  content:"";
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    #292930,
    transparent
  );
  flex:1;
}

/* Phone button */
.phone{
  background:#15151a;
  color:#60606a;
  border:1px solid #292930;
  cursor:not-allowed;
}

.phone:hover{
  opacity:1;
}

/* Status */
.status{
  display:none;
  margin-top:16px;
  padding:13px 14px;
  border-radius:12px;
  background:#101015;
  border:1px solid #24242c;
  font-size:13px;
  line-height:1.45;
  text-align:center;
}

.status.show{
  display:block;
}

.status.error{
  color:#ff9d9d;
  border-color:rgba(255,80,100,.22);
  background:rgba(120,20,35,.12);
}

.status.info{
  color:#aaaab5;
}

.status.success{
  color:#9fffc9;
  border-color:rgba(50,220,140,.20);
  background:rgba(20,100,65,.10);
}

/* Small note */
.note{
  text-align:center;
  color:#656570;
  font-size:11px;
  line-height:1.5;
  margin-top:17px;
}

/* Footer */
.footer{
  text-align:center;
  color:#45454e;
  font-size:10px;
  letter-spacing:2px;
  font-weight:700;
  margin-top:21px;
}

/* Mobile */
@media(max-width:380px){
  body{
    padding:18px 14px;
  }

  .logo{
    font-size:35px;
  }

  .card{
    padding:26px 18px 22px;
  }
}
</style>

</head>

<body>

<div class="container">

  <div class="brand">
    <div class="logo">BIGULA</div>
    <div class="subtitle">Your stressfree home</div>
  </div>

  <div class="card">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {
  "use strict";

  const SUPABASE_URL =
    "https://vfteiggdhthvrrlndtbs.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_7LUjk7PBJeCy-_ZdrEqDzA_sGUruHRe";

  const HOME_URL =
    "https://afrixx-app.github.io/live/home.html";

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        flowType: "pkce"
      }
    }
  );

  const googleBtn = document.getElementById("googleBtn");
  const googleText = document.getElementById("googleText");
  const statusBox = document.getElementById("status");

  function status(message, type) {
    statusBox.textContent = message;
    statusBox.className = "status show " + (type || "info");
  }

  function googleName(user) {
    const m = user.user_metadata || {};

    return (
      m.name ||
      m.full_name ||
      m.display_name ||
      [m.given_name, m.family_name].filter(Boolean).join(" ") ||
      (user.email ? user.email.split("@")[0] : "BIGULA User")
    ).trim();
  }

  function googleAvatar(user) {
    const m = user.user_metadata || {};
    return m.avatar_url || m.picture || null;
  }

  /*
   * Create a simple unique username.
   * We do NOT perform a username SELECT first.
   */
  function makeUsername(user, name) {
    let base = name
      .toLowerCase()
      .replace(/[^a-z0-9_]/g, "")
      .slice(0, 15);

    if (!base) base = "user";

    return base + "_" +
      user.id.replace(/-/g, "").slice(0, 8).toLowerCase();
  }

  async function saveUser(user) {

    if (!user || !user.id) {
      throw new Error("Google login succeeded, but no user ID was received.");
    }

    const name = googleName(user);
    const avatar = googleAvatar(user);
    const username = makeUsername(user, name);

    console.log("AUTH USER:", user);
    console.log("USER ID:", user.id);
    console.log("NAME:", name);
    console.log("USERNAME:", username);

    /*
     * First check whether this exact Auth user already
     * exists in public.users.
     */
    const existing = await client
      .from("users")
      .select("id,username,name,avatar_url,short_link")
      .eq("id", user.id)
      .limit(1);

    if (existing.error) {
      throw new Error(
        "USERS SELECT FAILED\n" +
        "Code: " + (existing.error.code || "none") + "\n" +
        "Message: " + existing.error.message
      );
    }

    /*
     * EXISTING USER
     */
    if (existing.data && existing.data.length > 0) {

      const profile = existing.data[0];

      localStorage.setItem(
        "bigula_profile",
        JSON.stringify(profile)
      );

      localStorage.setItem(
        "bigula_user_name",
        profile.name || name
      );

      localStorage.setItem(
        "supabase_auth_user_id",
        user.id
      );

      localStorage.setItem("isLoggedIn", "true");
      localStorage.setItem("loggedIn", "true");

      return profile;
    }

    /*
     * NEW USER
     */
    const payload = {
      id: user.id,
      username: username,
      name: name
    };

    if (avatar) {
      payload.avatar_url = avatar;
    }

    console.log("INSERTING USER:", payload);

    const inserted = await client
      .from("users")
      .insert(payload)
      .select("id,username,name,avatar_url,short_link")
      .limit(1);

    /*
     * THIS IS THE IMPORTANT PART.
     * We expose the REAL Supabase error.
     */
    if (inserted.error) {

      console.error(
        "SUPABASE INSERT ERROR:",
        inserted.error
      );

      throw new Error(
        "USERS INSERT FAILED\n\n" +
        "Code: " + (inserted.error.code || "none") + "\n" +
        "Message: " + (inserted.error.message || "none") + "\n" +
        "Details: " + (inserted.error.details || "none") + "\n" +
        "Hint: " + (inserted.error.hint || "none")
      );
    }

    if (!inserted.data || !inserted.data.length) {
      throw new Error(
        "INSERT reported success, but Supabase returned no user row."
      );
    }

    const profile = inserted.data[0];

    localStorage.setItem(
      "bigula_profile",
      JSON.stringify(profile)
    );

    localStorage.setItem(
      "bigula_user_name",
      profile.name || name
    );

    localStorage.setItem(
      "supabase_auth_user_id",
      user.id
    );

    localStorage.setItem("isLoggedIn", "true");
    localStorage.setItem("loggedIn", "true");

    return profile;
  }

  async function finishLogin(session) {

    if (!session || !session.user) {
      return;
    }

    googleBtn.disabled = true;
    googleText.textContent = "Creating account...";
    status("Creating your BIGULA account...", "info");

    try {

      await saveUser(session.user);

      status("Account created successfully!", "success");

      setTimeout(function () {
        window.location.replace(HOME_URL);
      }, 500);

    } catch (error) {

      console.error("BIGULA SIGNUP FAILURE:", error);

      googleBtn.disabled = false;
      googleText.textContent = "Continue with Google";

      status(
        error.message ||
        "Could not create your BIGULA account.",
        "error"
      );
    }
  }

  /*
   * Google button
   */
  googleBtn.addEventListener("click", async function () {

    googleBtn.disabled = true;
    googleText.textContent = "Opening Google...";
    status("Connecting to Google...", "info");

    try {

      const result = await client.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: HOME_URL
        }
      });

      if (result.error) {
        throw result.error;
      }

    } catch (error) {

      console.error("GOOGLE ERROR:", error);

      googleBtn.disabled = false;
      googleText.textContent = "Continue with Google";

      status(
        error.message ||
        "Google sign-in could not be started.",
        "error"
      );
    }
  });

  /*
   * Check for an existing session after returning
   * from Google.
   */
  async function checkSession() {

    try {

      const result = await client.auth.getSession();

      if (result.error) {
        console.error("SESSION ERROR:", result.error);
        return;
      }

      if (
        result.data &&
        result.data.session &&
        result.data.session.user
      ) {
        await finishLogin(result.data.session);
      }

    } catch (error) {
      console.error("CHECK SESSION ERROR:", error);
    }
  }

  client.auth.onAuthStateChange(function (event, session) {

    console.log("AUTH EVENT:", event);

    if (
      (event === "SIGNED_IN" ||
       event === "INITIAL_SESSION") &&
      session &&
      session.user
    ) {
      finishLogin(session);
    }
  });

  checkSession();

})();
</script></body>
</html>
