<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BIGULA — Sign Up</title>
<meta name="theme-color" content="#07070b">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:#050507;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 18px;
  overflow-x:hidden;
  position:relative;
}

/* BIGULA background glow */
body::before{
  content:"";
  position:fixed;
  width:430px;
  height:430px;
  top:-190px;
  left:-150px;
  background:radial-gradient(
    circle,
    rgba(111,76,255,.30) 0%,
    rgba(111,76,255,.10) 35%,
    transparent 70%
  );
  pointer-events:none;
}

body::after{
  content:"";
  position:fixed;
  width:430px;
  height:430px;
  right:-180px;
  bottom:-190px;
  background:radial-gradient(
    circle,
    rgba(0,210,255,.20) 0%,
    rgba(0,210,255,.07) 35%,
    transparent 70%
  );
  pointer-events:none;
}

.container{
  width:100%;
  max-width:430px;
  position:relative;
  z-index:1;
}

/* Logo */
.brand{
  text-align:center;
  margin-bottom:26px;
}

.logo{
  display:inline-block;
  font-size:40px;
  line-height:1;
  font-weight:950;
  letter-spacing:5px;
  background:linear-gradient(
    100deg,
    #ffffff 5%,
    #bdafff 42%,
    #63eaff 100%
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 0 35px rgba(105,90,255,.18);
}

.subtitle{
  margin-top:9px;
  color:#85858f;
  font-size:13px;
  letter-spacing:.2px;
}

/* Main card */
.card{
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );
  border:1px solid rgba(255,255,255,.10);
  border-radius:24px;
  padding:30px 23px 25px;
  box-shadow:
    0 25px 80px rgba(0,0,0,.58),
    0 0 50px rgba(88,70,255,.06);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

h1{
  text-align:center;
  font-size:26px;
  line-height:1.2;
  margin:0 0 10px;
  font-weight:850;
  letter-spacing:-.4px;
}

.desc{
  text-align:center;
  color:#9999a5;
  font-size:14px;
  line-height:1.55;
  margin:0 0 25px;
}

/* Google button */
button{
  width:100%;
  height:55px;
  border:0;
  border-radius:14px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  margin-top:12px;
  transition:
    transform .15s ease,
    opacity .15s ease,
    box-shadow .15s ease;
}

button:active{
  transform:scale(.985);
}

.google{
  position:relative;
  background:#fff;
  color:#15151a;
  box-shadow:
    0 8px 25px rgba(0,0,0,.30);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:11px;
}

.google:hover{
  box-shadow:
    0 10px 30px rgba(90,75,255,.18);
}

.google-icon{
  width:20px;
  height:20px;
  flex:none;
}

.google:disabled{
  opacity:.55;
  cursor:wait;
  transform:none;
}

/* Spinner */
.spinner{
  width:18px;
  height:18px;
  border:2px solid rgba(20,20,25,.20);
  border-top-color:#5550ff;
  border-radius:50%;
  animation:spin .75s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* Divider */
.divider{
  display:flex;
  align-items:center;
  gap:13px;
  color:#555560;
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  margin:22px 0 4px;
}

.divider:before,
.divider:after{
  content:"";
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    #292930,
    transparent
  );
  flex:1;
}

/* Phone button */
.phone{
  background:#15151a;
  color:#60606a;
  border:1px solid #292930;
  cursor:not-allowed;
}

.phone:hover{
  opacity:1;
}

/* Status */
.status{
  display:none;
  margin-top:16px;
  padding:13px 14px;
  border-radius:12px;
  background:#101015;
  border:1px solid #24242c;
  font-size:13px;
  line-height:1.45;
  text-align:center;
}

.status.show{
  display:block;
}

.status.error{
  color:#ff9d9d;
  border-color:rgba(255,80,100,.22);
  background:rgba(120,20,35,.12);
}

.status.info{
  color:#aaaab5;
}

.status.success{
  color:#9fffc9;
  border-color:rgba(50,220,140,.20);
  background:rgba(20,100,65,.10);
}

/* Small note */
.note{
  text-align:center;
  color:#656570;
  font-size:11px;
  line-height:1.5;
  margin-top:17px;
}

/* Footer */
.footer{
  text-align:center;
  color:#45454e;
  font-size:10px;
  letter-spacing:2px;
  font-weight:700;
  margin-top:21px;
}

/* Mobile */
@media(max-width:380px){
  body{
    padding:18px 14px;
  }

  .logo{
    font-size:35px;
  }

  .card{
    padding:26px 18px 22px;
  }
}
</style>

</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {
  "use strict";

  const SUPABASE_URL =
    "https://vfteiggdhthvrrlndtbs.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_7LUjk7PBJeCy-_ZdrEqDzA_sGUruHRe";

  const WEB_REDIRECT_URL =
    "https://afrixx-app.github.io/live/home.html";

  const APP_REDIRECT_URL =
    "com.bigula.app://auth/callback";


  /* =========================================================
     SUPABASE
  ========================================================= */

  if (!window.supabase || !window.supabase.createClient) {
    console.error("Supabase JS failed to load.");
    return;
  }

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        flowType: "pkce"
      }
    }
  );


  /* =========================================================
     ELEMENTS
  ========================================================= */

  const googleBtn =
    document.getElementById("googleBtn");

  const googleText =
    document.getElementById("googleText");

  const statusBox =
    document.getElementById("status");


  /* =========================================================
     STATUS
  ========================================================= */

  function showStatus(message, type) {

    if (!statusBox) {
      console.log(message);
      return;
    }

    statusBox.textContent = message;

    statusBox.className =
      "status show " + (type || "info");
  }


  /* =========================================================
     CAPACITOR DETECTION
  ========================================================= */

  function isNativeApp() {

    try {

      if (!window.Capacitor) {
        return false;
      }

      if (
        typeof window.Capacitor.isNativePlatform ===
        "function"
      ) {
        return window.Capacitor.isNativePlatform();
      }

      if (
        typeof window.Capacitor.getPlatform ===
        "function"
      ) {
        return (
          window.Capacitor.getPlatform() !== "web"
        );
      }

    } catch (error) {
      console.warn(
        "Could not detect Capacitor:",
        error
      );
    }

    return false;
  }


  function getRedirectURL() {

    if (isNativeApp()) {
      return APP_REDIRECT_URL;
    }

    return WEB_REDIRECT_URL;
  }


  /* =========================================================
     GOOGLE PROFILE INFORMATION
  ========================================================= */

  function getGoogleName(user) {

    const metadata =
      user && user.user_metadata
        ? user.user_metadata
        : {};

    let name =
      metadata.name ||
      metadata.full_name ||
      metadata.display_name ||
      "";

    if (!name) {

      const first =
        metadata.given_name || "";

      const last =
        metadata.family_name || "";

      name =
        (first + " " + last).trim();
    }

    if (!name && user.email) {

      name =
        user.email.split("@")[0];
    }

    if (!name) {
      name = "BIGULA User";
    }

    return String(name).trim();
  }


  function getGoogleAvatar(user) {

    const metadata =
      user && user.user_metadata
        ? user.user_metadata
        : {};

    return (
      metadata.avatar_url ||
      metadata.picture ||
      null
    );
  }


  /* =========================================================
     USERNAME
     
     IMPORTANT:
     username must NOT simply equal the Google name.

     Example:
     Google name = Jeff

     First Jeff:
       jeff

     Another Jeff:
       jeff_f9aa99

     This prevents username collisions.
  ========================================================= */

  function makeUsernameBase(user, name) {

    const metadata =
      user && user.user_metadata
        ? user.user_metadata
        : {};

    let base =
      metadata.user_name ||
      metadata.preferred_username ||
      metadata.username ||
      "";


    if (!base) {
      base = name;
    }


    base = String(base)
      .toLowerCase()
      .replace(/[^a-z0-9_]/g, "")
      .slice(0, 20);


    if (!base) {
      base = "user";
    }


    return base;
  }


  async function createUniqueUsername(user, name) {

    const base =
      makeUsernameBase(user, name);


    /*
      First try the clean username.
    */

    let candidate = base;


    let result = await client
      .from("users")
      .select("id")
      .eq("username", candidate)
      .limit(1);


    if (result.error) {
      throw result.error;
    }


    if (
      !result.data ||
      result.data.length === 0
    ) {
      return candidate;
    }


    /*
      Username exists.

      Add part of the Auth UUID.
    */

    candidate =
      base +
      "_" +
      user.id
        .replace(/-/g, "")
        .slice(0, 6)
        .toLowerCase();


    result = await client
      .from("users")
      .select("id")
      .eq("username", candidate)
      .limit(1);


    if (result.error) {
      throw result.error;
    }


    if (
      !result.data ||
      result.data.length === 0
    ) {
      return candidate;
    }


    /*
      Final guaranteed-style fallback.
    */

    return (
      "user_" +
      user.id
        .replace(/-/g, "")
        .slice(0, 8)
        .toLowerCase()
    );
  }


  /* =========================================================
     SYNC USER PROFILE
     
     ACTUAL SCHEMA:

       id
       username
       avatar_url
       bio
       created_at
       last_edit
       name
       short_link
       profile_updated_at

     We only write fields that signup should control.

     We DO NOT manually write:

       bio
       created_at
       last_edit
       short_link
       profile_updated_at

     Those should remain database-controlled.
  ========================================================= */

  async function syncUserProfile(user) {

    if (!user || !user.id) {

      throw new Error(
        "No authenticated BIGULA user was found."
      );
    }


    const name =
      getGoogleName(user);

    const avatar =
      getGoogleAvatar(user);


    /*
      STEP 1
      Look for the Auth UUID.

      This is much safer than blindly upserting.
    */

    const lookup =
      await client
        .from("users")
        .select("*")
        .eq("id", user.id)
        .limit(1);


    if (lookup.error) {

      console.error(
        "Users lookup error:",
        lookup.error
      );

      throw lookup.error;
    }


    let profile =
      lookup.data &&
      lookup.data.length
        ? lookup.data[0]
        : null;


    /* =======================================================
       EXISTING USER
    ======================================================= */

    if (profile) {

      /*
        User already exists.

        Do NOT change username.
        Do NOT change bio.
        Do NOT change short_link.

        Only synchronize Google name/avatar.
      */

      const updatePayload = {
        name: name
      };


      if (avatar) {
        updatePayload.avatar_url = avatar;
      }


      const updated =
        await client
          .from("users")
          .update(updatePayload)
          .eq("id", user.id)
          .select("*")
          .limit(1);


      if (updated.error) {

        console.error(
          "Users update error:",
          updated.error
        );

        throw updated.error;
      }


      if (
        updated.data &&
        updated.data.length
      ) {
        profile =
          updated.data[0];
      }


    } else {


      /* =====================================================
         NEW USER
      ===================================================== */

      const username =
        await createUniqueUsername(
          user,
          name
        );


      /*
        IMPORTANT:

        We only insert these known fields:

          id
          username
          name
          avatar_url

        We do NOT send database-managed fields.
      */

      const insertPayload = {

        id: user.id,

        username: username,

        name: name

      };


      if (avatar) {

        insertPayload.avatar_url =
          avatar;
      }


      console.log(
        "Creating BIGULA user:",
        insertPayload
      );


      const inserted =
        await client
          .from("users")
          .insert(insertPayload)
          .select("*")
          .limit(1);


      if (inserted.error) {

        console.error(
          "Users INSERT failed:",
          inserted.error
        );

        throw inserted.error;
      }


      if (
        !inserted.data ||
        !inserted.data.length
      ) {

        throw new Error(
          "BIGULA created the account but returned no profile."
        );
      }


      profile =
        inserted.data[0];
    }


    /* =======================================================
       LOCAL CACHE
    ======================================================= */

    localStorage.setItem(
      "bigula_profile",
      JSON.stringify(profile)
    );


    localStorage.setItem(
      "bigula_user_name",
      profile.name || name
    );


    localStorage.setItem(
      "supabase_auth_user_id",
      user.id
    );


    localStorage.setItem(
      "isLoggedIn",
      "true"
    );


    localStorage.setItem(
      "loggedIn",
      "true"
    );


    return profile;
  }


  /* =========================================================
     LOGIN FINISH
  ========================================================= */

  let redirecting = false;


  async function finishLogin(session) {

    if (
      !session ||
      !session.user
    ) {
      return false;
    }


    if (redirecting) {
      return true;
    }


    redirecting = true;


    if (googleBtn) {
      googleBtn.disabled = true;
    }


    if (googleText) {
      googleText.textContent =
        "Signing in...";
    }


    showStatus(
      "Setting up your BIGULA profile...",
      "info"
    );


    try {

      /*
        IMPORTANT:

        We now WAIT for the users table
        operation to succeed.

        The old page redirected even when
        profile creation failed.
      */

      await syncUserProfile(
        session.user
      );


      showStatus(
        "Welcome to BIGULA!",
        "success"
      );


      setTimeout(function () {

        window.location.replace(
          WEB_REDIRECT_URL
        );

      }, 350);


      return true;


    } catch (error) {

      console.error(
        "BIGULA profile synchronization failed:",
        error
      );


      redirecting = false;


      if (googleBtn) {
        googleBtn.disabled = false;
      }


      if (googleText) {
        googleText.textContent =
          "Continue with Google";
      }


      let message =
        error && error.message
          ? error.message
          : "Could not save your BIGULA profile.";


      /*
        Give useful messages for common
        Supabase errors.
      */

      if (
        /row-level security|permission denied|rls/i
          .test(message)
      ) {

        message =
          "BIGULA could not save your profile because database access is blocked. Check the users table RLS policies.";

      } else if (
        /duplicate key|unique constraint|already exists/i
          .test(message)
      ) {

        message =
          "A BIGULA username conflict occurred. Please try Google sign-in again.";

      } else if (
        /null value.*not-null/i
          .test(message)
      ) {

        message =
          "The BIGULA users table has a required field without a database default.";

      }


      showStatus(
        message,
        "error"
      );


      /*
        Also print complete Supabase
        diagnostic information to console.
      */

      if (error) {

        console.error(
          "Supabase error message:",
          error.message
        );

        console.error(
          "Supabase error code:",
          error.code
        );

        console.error(
          "Supabase error details:",
          error.details
        );

        console.error(
          "Supabase error hint:",
          error.hint
        );
      }


      return false;
    }
  }


  /* =========================================================
     NATIVE OAUTH CALLBACK
  ========================================================= */

  async function handleOAuthCallback(
    callbackUrl
  ) {

    if (!callbackUrl) {
      return false;
    }


    try {

      const parsed =
        new URL(callbackUrl);


      if (
        parsed.protocol !==
          "com.bigula.app:" ||
        parsed.hostname !== "auth" ||
        parsed.pathname !== "/callback"
      ) {
        return false;
      }


      const oauthError =
        parsed.searchParams.get(
          "error"
        );


      const errorDescription =
        parsed.searchParams.get(
          "error_description"
        );


      if (oauthError) {

        throw new Error(
          errorDescription ||
          oauthError ||
          "Google authentication failed."
        );
      }


      const code =
        parsed.searchParams.get(
          "code"
        );


      if (!code) {

        throw new Error(
          "Google returned without an authorization code."
        );
      }


      if (googleBtn) {
        googleBtn.disabled = true;
      }


      if (googleText) {
        googleText.textContent =
          "Finishing sign-in...";
      }


      showStatus(
        "Finishing Google sign-in...",
        "info"
      );


      const result =
        await client.auth
          .exchangeCodeForSession(code);


      if (result.error) {
        throw result.error;
      }


      if (
        !result.data ||
        !result.data.session
      ) {

        throw new Error(
          "Google sign-in completed, but no BIGULA session was created."
        );
      }


      await finishLogin(
        result.data.session
      );


      return true;


    } catch (error) {

      console.error(
        "OAuth callback error:",
        error
      );


      if (googleBtn) {
        googleBtn.disabled = false;
      }


      if (googleText) {
        googleText.textContent =
          "Continue with Google";
      }


      showStatus(
        error && error.message
          ? error.message
          : "Google sign-in could not be completed.",
        "error"
      );


      return false;
    }
  }


  /* =========================================================
     CAPACITOR CALLBACK SUPPORT
  ========================================================= */

  window.addEventListener(
    "bigulaOAuthCallback",
    function (event) {

      const callbackUrl =
        event &&
        event.detail
          ? event.detail.url
          : null;


      if (callbackUrl) {

        handleOAuthCallback(
          callbackUrl
        );
      }
    }
  );


  window.bigulaHandleOAuthCallback =
    handleOAuthCallback;


  /* =========================================================
     EXISTING SESSION
  ========================================================= */

  async function checkExistingSession() {

    try {

      const result =
        await client.auth.getSession();


      if (result.error) {

        console.error(
          "Session check error:",
          result.error
        );

        return;
      }


      const session =
        result.data
          ? result.data.session
          : null;


      if (
        session &&
        session.user
      ) {

        await finishLogin(
          session
        );
      }


    } catch (error) {

      console.error(
        "Existing session error:",
        error
      );
    }
  }


  /* =========================================================
     AUTH STATE CHANGES
     
     Do NOT sync on TOKEN_REFRESHED.
     
     Otherwise every access-token refresh could
     unnecessarily write to public.users.
  ========================================================= */

  client.auth.onAuthStateChange(
    function (event, session) {

      console.log(
        "BIGULA Auth event:",
        event
      );


      if (
        session &&
        session.user &&
        (
          event === "SIGNED_IN" ||
          event === "INITIAL_SESSION"
        )
      ) {

        finishLogin(session);
      }
    }
  );


  /* =========================================================
     GOOGLE SIGN-IN BUTTON
  ========================================================= */

  if (googleBtn) {

    googleBtn.addEventListener(
      "click",
      async function () {

        if (redirecting) {
          return;
        }


        googleBtn.disabled = true;


        if (googleText) {
          googleText.textContent =
            "Opening Google...";
        }


        showStatus(
          "Connecting to Google...",
          "info"
        );


        try {

          const result =
            await client.auth
              .signInWithOAuth({

                provider: "google",

                options: {

                  redirectTo:
                    getRedirectURL(),

                  skipBrowserRedirect:
                    false
                }
              });


          if (result.error) {
            throw result.error;
          }


        } catch (error) {

          console.error(
            "Google OAuth error:",
            error
          );


          let message =
            error && error.message
              ? error.message
              : "Google sign-in could not be started.";


          if (
            /provider.*not enabled|unsupported provider/i
              .test(message)
          ) {

            message =
              "Google is not enabled in Supabase Authentication.";

          } else if (
            /redirect/i.test(message)
          ) {

            message =
              "The Google/Supabase redirect URL is not configured correctly.";

          } else if (
            /api.?key/i.test(message)
          ) {

            message =
              "The BIGULA Supabase API key is invalid.";
          }


          googleBtn.disabled = false;


          if (googleText) {
            googleText.textContent =
              "Continue with Google";
          }


          showStatus(
            message,
            "error"
          );
        }
      }
    );
  }


  /* =========================================================
     START
  ========================================================= */

  checkExistingSession();

})();
</script></body>
</html>
